${r} Züge bis zum Ziel.`,type:'good'};\n  }\n  hint(){\n    if(this.done)return null;\n    const path=this.plan();if(!path.length)return null;\n    const mv=path[0];this.sel=-1;this.step(mv);\n    return `Tipp: Scheibe ${mv.disc+1} von Stab ${HN_PEG[mv.from]} nach Stab ${HN_PEG[mv.to]} – schon ausgeführt. Noch ${path.length-1} ${path.length-1===1?'Zug':'Züge'} bis zum Ziel.`;\n  }\n  reset(){this.state=this.spec.start;this.stack=[];this.moves=0;this.sel=-1;this.done=false;this.refresh();}\n  reveal(){\n    const path=this.plan();this.done=true;this.sel=-1;let i=0;\n    const run=()=>{if(i>=path.length||!this.stage.isConnected)return;this.state=path[i++].next;this.refresh();setTimeout(run,path.length>40?120:350);};\n    run();\n  }\n  finish(){this.done=true;this.sel=-1;this.refresh();}\n  winInfo(){return `Züge: <b>${this.moves}<\/b> (kürzeste Lösung: ${this.spec.optimum})`;}\n  keydown(e){\n    const k=e.key.toLowerCase(),i='1234'.indexOf(k)>=0&&k?'1234'.indexOf(k):'abcd'.indexOf(k);\n    if(k.length!==1||i<0||i>=this.spec.P)return false;\n    this.pegClick(i);return true;\n  }\n  applyAutoCheck(){}\n  clearSelection(){this.sel=-1;this.refresh();}\n}\nconst SVGNS_H='http://www.w3.org/2000/svg';\n\nconst GAME={\n  title:'Turm-von-Hanoi-Trainer',\n  id:'hanoi', name:'Hanoi', icon:'🗼', units:['Zug','Züge'],\n  intro:'Versetze den Turm Scheibe für Scheibe – nie eine grössere auf eine kleinere.',\n  sizes:[3,4,5,6,7,8], size:3, lvl:'sl',\n  sizeTitle:'Anzahl Scheiben', newLabel:'Neues Spiel',\n  sizeLabel:v=>String(v),\n  tag:(s,l)=>`${s} Scheiben · ${LEVEL_NAMES[l]}`,\n  tools:{notes:false,undo:true,auto:false,legend:false},\n  padHelp:'', missing:()=>'',\n  levels:{\n    sl:{desc:n=>`Klassisch: Der Turm steht auf Stab A und soll auf Stab C. Kürzeste Lösung: ${2**n-1} Züge.`},\n    l: {desc:n=>`Die Scheiben liegen zufällig verteilt (auf 3 Stäben), alle sollen als Turm auf Stab C.`},\n    m: {desc:n=>`Zufälliger Start und zufälliges Ziel – auch das Ziel ist eine Verteilung (siehe «Ziel» unter dem Spielfeld).`},\n    s: {desc:n=>`Mit 4 Stäben (A–D): Turm von A nach D. Mehr Platz, aber die beste Zugfolge ist schwer zu finden.`}\n  },\n  create(size,lvl){return new HanoiPuzzle(this,size,lvl,hnCreate(size,lvl));},\n  rules(n){\n    return `\n      <li>Bewege alle Scheiben vom Start zum <b>Ziel<\/b> (siehe «Ziel» unter dem Spielfeld).<\/li>\n      <li>Pro Zug wird <b>genau eine Scheibe<\/b> bewegt – immer die <b>oberste<\/b> eines Stabs.<\/li>\n      <li>Nie eine <b>grössere<\/b> Scheibe auf eine <b>kleinere<\/b> legen.<\/li>\n      <li><b>Bedienung:<\/b> erst den Stab antippen, von dem du eine Scheibe nimmst, dann den Zielstab. Tasten 1–4 oder A–D funktionieren auch, Z nimmt einen Zug zurück.<\/li>\n      <li><b>Strategie:<\/b> Mit ${n} Scheiben und 3 Stäben braucht es mindestens 2<sup>${n}<\/sup> − 1 = ${2**n-1} Züge. Tipp: Wie versetzt man erst einen Turm mit einer Scheibe weniger?<\/li>\n      <li><b>Hilfen:<\/b> «Tipp» führt den nächsten besten Zug aus, «Überprüfen» zeigt die Mindestzahl der noch nötigen Züge, «Lösung zeigen» spielt die kürzeste Lösung vor.<\/li>`;\n  }\n};\n\n/* =====================================================================\n   KERN – Oberfläche (gilt für jedes Rätsel)\n   Erwartet eine globale Konstante GAME (vom Rätsel-Modul definiert).\n   Kümmert sich um: Auswahl Grösse/Niveau, Zeit, Statistik, Prüfen, Tipp,\n   Neu beginnen, Lösung zeigen, Drucken, Gewonnen-Dialog, Tastatur,\n   Einbettung in die Plattform (?embed=1).\n   ===================================================================== */\nconst $=id=>document.getElementById(id);\nconst def=GAME;\nconst EMBED=/[?&]embed=1/.test(location.search)||window.name==='raetsel-embed';\nconst STORE_KEY='raetsel-trainer-v1-'+def.id;\nconst settings={size:def.size,lvl:def.lvl};\nlet solUsed=false,puz=null,noteMode=false,tips=0,checks=0,startT=0,timerId=null,genToken=0;\n\nfunction loadStore(){\n  try{\n    const o=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');\n    if(def.sizes.includes(o.size))settings.size=o.size;\n    if(def.levels[o.lvl])settings.lvl=o.lvl;\n  }catch(e){}\n}\nfunction saveStore(){try{localStorage.setItem(STORE_KEY,JSON.stringify(settings));}catch(e){}}\n\n/* Meldungen, Zeit, Statistik */\nfunction showMsg(t,type){const m=$('msg');m.textContent=t;m.className='msg show '+type;}\nfunction hideMsg(){$('msg').className='msg';}\nfunction elapsed(){return Math.floor((Date.now()-startT)/1000);}\nfunction fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}\nfunction startTimer(){stopTimer();startT=Date.now();$('stTime').textContent='00:00';timerId=setInterval(()=>$('stTime').textContent=fmt(elapsed()),1000);}\nfunction stopTimer(){if(timerId)clearInterval(timerId);timerId=null;}\n/* Deutlich sichtbare Kennzeichnung: Wurde die Lösung angezeigt, bleibt das für dieses Rätsel sichtbar\n   (auch nach «Neu beginnen» und nach dem Lösen) – ein Screenshot kann also nicht als eigene Lösung gelten. */\nfunction updateStatus(){\n  const st=$('stStatus'),won=puz&&puz.done&&!solUsed&&puz.solved();\n  st.className=solUsed?'bad':won?'good':'';\n  st.textContent=solUsed?'⚠ Lösung angezeigt':won?'✔ selbst gelöst':'in Arbeit';\n  $('solBanner').style.display=solUsed?'block':'none';\n  $('stage').classList.toggle('sol',solUsed);\n}\nfunction updateStats(){$('stTips').textContent=tips;$('stChecks').textContent=checks;}\n\nconst ctx={\n  autoCheck:()=>$('autoCheck').checked,\n  noteMode:()=>noteMode,\n  hideMsg,\n  changed:()=>{if(puz&&!puz.done&&puz.solved())win();},\n  msg:showMsg\n};\n/* Beschriftungen – Rätsel dürfen sie überschreiben (def.sizeLabel, def.tag, def.newLabel …) */\nconst sizeLabel=v=>def.sizeLabel?def.sizeLabel(v):`${v} × ${v}`;\nconst tagOf=(s,l)=>def.tag?def.tag(s,l):`${LEVEL_NAMES[l]} (${s}×${s})`;\n\n/* Auswahl-Leisten */\nfunction makeSeg(el,items,current,onPick){\n  el.innerHTML='';\n  for(const it of items){\n    const b=document.createElement('button');\n    b.textContent=it.label;b.dataset.v=it.v;\n    b.classList.toggle('on',String(it.v)===String(current));\n    b.addEventListener('click',()=>onPick(it.v));\n    el.appendChild(b);\n  }\n}\nfunction buildOptions(){\n  makeSeg($('sizeSeg'),def.sizes.map(n=>({v:n,label:sizeLabel(n)})),settings.size,v=>{settings.size=v;buildOptions();saveStore();updateSetupSel();});\n  makeSeg($('lvlSeg'),Object.keys(def.levels).map(k=>({v:k,label:LEVEL_NAMES[k]})),settings.lvl,v=>{settings.lvl=v;buildOptions();saveStore();updateSetupSel();});\n  const d=def.levels[settings.lvl].desc;\n  $('lvlDesc').textContent=typeof d==='function'?d(settings.size):d;\n  $('sizeSeg').style.display=def.sizes.length>1?'':'none';\n  $('sizeLbl').style.display=def.sizes.length>1?'':'none';\n}\n\n\n/* Schritt 1: Rahmenbedingungen wählen – Schritt 2: Rätsel erstellen */\nconst TOOL_IDS=['btnCheck','btnNotes','btnHint','btnReset','btnSolve','btnPrint','btnSubmit'];\nfunction toolsDisabled(on){for(const id of TOOL_IDS){const e=$(id);if(e)e.disabled=on;}if($('autoCheck'))$('autoCheck').disabled=on;}\nfunction showSetup(){\n  ++genToken;stopTimer();puz=null;tips=0;checks=0;solUsed=false;\n  const stage=$('stage');stage.classList.remove('loading','sol');\n  stage.innerHTML=`<div class=\"setup-ph\"><div class=\"big\">${def.icon||'🧩'}<\/div><h3>Neues ${def.name} einrichten<\/h3><p>Wähle Grösse und Niveau und erstelle dann das Rätsel.<\/p><p class=\"chosen\" id=\"setupSel\"><\/p><button class=\"btn primary\" id=\"btnSetupGo\">Rätsel erstellen<\/button><\/div>`;\n  $('btnSetupGo').addEventListener('click',startGame);\n  const pad=$('pad');pad.innerHTML='';pad.removeAttribute('style');\n  toolsDisabled(true);hideMsg();\n  $('stLevel').textContent='–';$('stTime').textContent='00:00';$('stStatus').textContent='noch kein Rätsel';$('stStatus').className='';\n  if($('stTips'))$('stTips').textContent='–';\n  if($('solBanner'))$('solBanner').style.display='none';\n  updateSetupSel();\n}\nfunction updateSetupSel(){const e=$('setupSel');if(e)e.textContent=(def.sizes.length>1?sizeLabel(settings.size)+' · ':'')+LEVEL_NAMES[settings.lvl];}\nfunction startGame(){\n  if(puz&&!puz.done&&!puz.locked&&!solUsed&&!confirm('Das laufende Rätsel wird verworfen. Wirklich ein neues Rätsel erstellen?'))return;\n  newGame();\n}\n\n/* Neues Rätsel */\nfunction newGame(){\n  const token=++genToken, stage=$('stage');\n  stopTimer();\n  stage.classList.add('loading');\n  showMsg(`${def.name} wird erstellt …`,'info');\n  setTimeout(()=>{\n    if(token!==genToken)return;\n    let p=null;\n    try{p=def.create(settings.size,settings.lvl);}catch(err){console.error(err);}\n    stage.classList.remove('loading');\n    if(!p){showMsg('Das Rätsel konnte nicht erstellt werden. Bitte nochmals versuchen.','warn');if(!puz)showSetup();return;}\n    puz=p;tips=0;checks=0;solUsed=false;\n    toolsDisabled(false);\n    puz.mount(ctx,stage,$('pad'));\n    if($('autoCheck').checked)puz.applyAutoCheck(true);\n    $('stLevel').textContent=tagOf(settings.size,settings.lvl);\n    $('phTitle').textContent=`${def.name} · ${tagOf(settings.size,settings.lvl)}`;\n    $('rules').innerHTML=def.rules(settings.size);\n    updateStats();updateStatus();startTimer();hideMsg();\n  },30);\n}\n\n/* Werkzeuge */\nfunction check(){\n  if(!puz||puz.done)return;\n  if(puz.customCheck){checks++;updateStats();const r=puz.customCheck();showMsg(r.text,r.type);return;}\n  checks++;\n  const {wrong,empty,right}=puz.check();\n  updateStats();\n  if(puz.solved()){win();return;}\n  const [one,many]=def.units;\n  if(wrong===0){\n    showMsg(right===0?`Noch nichts eingetragen. ${def.missing(empty)}`\n      :`Super! ${right===1?'Die eingetragene '+one+' ist':'Alle '+right+' eingetragenen '+many+' sind'} richtig. ${def.missing(empty)}`,'good');\n  } else {\n    showMsg(`${wrong} ${wrong===1?one+' ist':many+' sind'} falsch (rot). ${right} richtig. ${def.missing(empty)} Korrigiere die roten Felder.`,'warn');\n  }\n}\nfunction hint(){\n  if(!puz||puz.done)return;\n  const t=puz.hint();\n  if(t===null)return;\n  tips++;updateStats();showMsg(t,'info');\n  ctx.changed();\n}\nfunction resetGame(){\n  if(!puz||!confirm('Alle eigenen Eingaben löschen und neu beginnen?'))return;\n  puz.reset();tips=0;checks=0;startTimer();hideMsg();updateStats();\n}\nfunction showSolution(){\n  if(!puz)return;\n  if(!confirm(`Wirklich die ganze Lösung anzeigen? Das ${def.name}-Rätsel gilt dann als nicht gelöst.`))return;\n  solUsed=true;puz.reveal();stopTimer();updateStatus();\n  showMsg('Lösung angezeigt: grün = du hattest es richtig, rot = war falsch, gelb = war leer.','info');\n}\nfunction win(){\n  puz.finish();stopTimer();\n  $('winText').innerHTML=`${def.name} · Niveau: <b>${tagOf(settings.size,settings.lvl)}<\/b><br>Zeit: <b>${fmt(elapsed())}<\/b><br>${puz.winInfo?puz.winInfo()+'<br>':''}Tipps: <b>${tips}<\/b> · Prüfungen: <b>${checks}<\/b>`;\n  if(solUsed){$('winTitle').textContent='⚠ Gelöst – aber mit Lösung';$('winText').innerHTML+='<br><b style=\"color:var(--bad)\">Die Lösung wurde angezeigt – das zählt nicht als selbst gelöst.<\/b>';}\n  else $('winTitle').textContent='🎉 Geschafft!';\n  updateStatus();\n  $('overlay').classList.add('show');\n  showMsg(solUsed?'Gelöst – aber die Lösung wurde vorher angezeigt.':`Gelöst in ${fmt(elapsed())} mit ${tips} Tipps.`,solUsed?'warn':'good');\n}\nfunction toggleNotes(){\n  if(def.tools.undo){if(puz)puz.undo();return;}\n  if(!def.tools.notes)return;\n  noteMode=!noteMode;\n  $('btnNotes').textContent=(def.tools.notesLabel||'✎ Notizen')+': '+(noteMode?'ein':'aus');\n  $('btnNotes').classList.toggle('on',noteMode);\n}\n\n/* Ereignisse */\n$('btnNew').addEventListener('click',startGame);\n$('btnCheck').addEventListener('click',check);\n$('btnHint').addEventListener('click',hint);\n$('btnReset').addEventListener('click',resetGame);\n$('btnSolve').addEventListener('click',showSolution);\n$('btnPrint').addEventListener('click',()=>{if(puz){puz.clearSelection();}window.print();});\n$('btnNotes').addEventListener('click',toggleNotes);\n$('btnWinNew').addEventListener('click',()=>{$('overlay').classList.remove('show');showSetup();});\n$('btnWinClose').addEventListener('click',()=>$('overlay').classList.remove('show'));\n$('autoCheck').addEventListener('change',()=>{if(puz)puz.applyAutoCheck($('autoCheck').checked);});\n\ndocument.addEventListener('keydown',e=>{\n  if($('overlay').classList.contains('show')||!puz)return;\n  if(e.ctrlKey||e.metaKey||e.altKey)return;\n  const t=e.target;\n  if(e.key===' '&&t&&t.closest&&t.closest('button,input,summary,select,textarea'))return;   // Leertaste bedient dann das Bedienelement\n  if((e.key==='n'||e.key==='N')&&def.tools.notes&&!def.tools.undo){toggleNotes();return;}\n  if((e.key==='z'||e.key==='Z'||e.key==='Backspace')&&def.tools.undo&&puz.undo){puz.undo();e.preventDefault();return;}\n  if(puz.keydown(e))e.preventDefault();\n});\n\n/* Einbettung: Höhe an die Plattform melden */\nfunction setupEmbed(){\n  document.body.classList.add('embed');\n  if(window.parent===window)return;\n  const send=()=>window.parent.postMessage({type:'raetsel-height',id:def.id,h:Math.ceil(document.body.getBoundingClientRect().height)},'*');\n  if(window.ResizeObserver)new ResizeObserver(send).observe(document.body);\n  window.addEventListener('load',send);\n  send();\n}\n\n/* Start */\n(function init(){\n  loadStore();\n  $('gameTitle').textContent=def.title;\n  $('sub').textContent=def.intro;\n  $('newTitle').textContent=def.newLabel||'Neues '+def.name;\n  $('btnNew').textContent=def.newLabel?def.newLabel+' starten':'Neues '+def.name+' erstellen';\n  $('sizeLbl').textContent=def.sizeTitle||'Grösse';\n  if(def.tools.undo)$('btnNotes').textContent='↶ Zug zurück';\n  else if(def.tools.notesLabel)$('btnNotes').textContent=def.tools.notesLabel+': aus';\n  if(def.tools.auto===false)$('autoCheck').parentElement.style.display='none';\n  if(def.tools.legend===false)document.querySelector('.legend').style.display='none';\n  $('rulesTitle').textContent='So geht '+def.name;\n  $('btnNotes').style.display=(def.tools.notes||def.tools.undo)?'':'none';\n  $('btnHint').classList.toggle('full',!(def.tools.notes||def.tools.undo));\n  document.title=def.title+' – Rätsel-Trainer';\n  if(EMBED)setupEmbed();\n  buildOptions();\n  showSetup();\n})();\n\n<\/script>\n<\/body>\n<\/html>\n"
 },
 {
  "id": "knobeleien",
  "name": "Knobeleien",
  "icon": "🧩",
  "intro": "Vier Klassiker zum Tüfteln: Theseus und der Minotaurus, Sixteen-Puzzle, Sechs Hasen, Flussüberquerung.",
  "html": "<!doctype html>\n<html lang=\"de-CH\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Knobeleien – Rätsel-Trainer<\/title>\n<style>\n:root{\n  /* Farben nach flade.ch: Weiss als Grund, Anthrazit für Text, Limettengrün #aecb35 als Akzent */\n  --bg:#ffffff; --card:#f8faf0; --ink:#231f20; --muted:#5f6657;\n  --line:#d3dbbd; --thick:#231f20; --given:#231f20; --user:#46640f;\n  --sel:#dbe9a0; --peer:#f4f8e2; --same:#e7f0bd;\n  --ok:#15803d; --okbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2;\n  --hint:#92400e; --hintbg:#fef3c7;\n  --accent:#aecb35; --accent-bg:#f1f7d9; --accent-dark:#5d7410; --lime:#aecb35;\n  --water:#e6f1f5;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,\"Segoe UI\",Arial,sans-serif;}\n.wrap{max-width:980px;margin:0 auto;padding:16px;}\n\n/* Kopf */\n.top{display:flex;align-items:center;gap:16px;margin:2px 0 14px;padding-bottom:12px;border-bottom:3px solid var(--lime)}\n.logo{height:58px;width:auto;display:block;flex:none}\n.titlebox h1{margin:0;font-size:1.7rem;line-height:1.15}\n.sub{color:var(--muted);margin:2px 0 0}\n/* Layout */\n.layout{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}\n.left{flex:1 1 420px;min-width:280px}\n.right{flex:0 1 300px;min-width:260px;display:flex;flex-direction:column;gap:12px}\n.card{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(35,31,32,.06)}\n.card h2{font-size:1.05rem;margin:0 0 8px}\nlabel.small{font-size:.9rem;color:var(--muted);display:block;margin-bottom:4px}\n.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}\n.seg button{flex:1 1 auto;border:2px solid var(--line);background:#fff;border-radius:8px;padding:7px 8px;font:inherit;cursor:pointer;color:var(--ink)}\n.seg button.on{border-color:var(--accent);background:var(--accent-bg);font-weight:bold}\n.lvldesc{font-size:.9rem;color:var(--muted);min-height:2.4em;margin:0 0 10px}\n.btn{border:none;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer;background:#e5e7eb;color:var(--ink)}\n.btn:hover{filter:brightness(.95)}\n.btn.primary{background:var(--accent);color:var(--ink);font-weight:bold}\n.btn.primary:hover{background:#9db92d}\n.btn.on{background:var(--accent-dark);color:#fff}\n.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.btns .full{grid-column:1/-1}\n.stats{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}\n.stats b{font-variant-numeric:tabular-nums}\nbutton:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}\n\n/* Spielfeld (gemeinsam) */\n.board{\n  width:min(100%,520px); aspect-ratio:1/1; margin:0 auto;\n  display:grid; grid-template-columns:repeat(var(--cols,var(--n)),1fr); grid-template-rows:repeat(var(--cols,var(--n)),1fr);\n  border:3px solid var(--thick); background:#fff; user-select:none; touch-action:manipulation;\n}\n.cell{\n  display:flex;align-items:center;justify-content:center;position:relative;\n  border-right:1px solid var(--line);border-bottom:1px solid var(--line);\n  font-size:calc(min(100vw - 40px,520px) / var(--n) * .55);\n  cursor:pointer;color:var(--user);\n}\n.cell.tr{border-right:3px solid var(--thick)}\n.cell.tb{border-bottom:3px solid var(--thick)}\n.cell.lastc{border-right:none}\n.cell.lastr{border-bottom:none}\n.cell.water{background:var(--water)}\n.cell.peer{background:var(--peer)}\n.cell.same{background:var(--same)}\n.cell.sel{background:var(--sel)}\n.cell.given{color:var(--given);font-weight:bold}\n.cell.hint{color:var(--hint);background:var(--hintbg)}\n.cell.ok{color:var(--ok);background:var(--okbg)}\n.cell.bad{color:var(--bad);background:var(--badbg)}\n.cell.sel.ok,.cell.sel.bad,.cell.sel.hint{outline:3px solid var(--accent);outline-offset:-3px}\n.cell.water.ok,.cell.water.bad,.cell.water.hint{outline:0}\n.notes{position:absolute;inset:2px;display:grid;font-size:calc(min(100vw - 40px,520px) / var(--n) * .22);color:#64748b;line-height:1;font-weight:normal}\n.notes span{display:flex;align-items:center;justify-content:center}\n\n/* Eingabe */\n.pad{display:grid;gap:6px;margin:12px auto 0;width:min(100%,520px)}\n.pad button{font:inherit;font-size:1.4rem;padding:10px 0;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}\n.pad button.del{font-size:1rem}\n.pad button.done{opacity:.35}\n.padhelp{margin:12px auto 0;width:min(100%,520px);font-size:.95rem;color:var(--muted);text-align:center}\n.msg{margin:12px auto 0;width:min(100%,520px);padding:10px 12px;border-radius:8px;display:none;font-size:1rem}\n.msg.show{display:block}\n.msg.info{background:#e0f2fe;color:#075985}\n.msg.good{background:var(--okbg);color:#14532d}\n.msg.warn{background:var(--badbg);color:#7f1d1d}\n.toggle{display:flex;gap:8px;align-items:center;font-size:.95rem;margin-top:6px;cursor:pointer}\ndetails summary{cursor:pointer;font-weight:bold}\ndetails ul{padding-left:18px;margin:8px 0 0}\ndetails li{margin-bottom:4px}\n.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:.85rem;margin-top:8px}\n.legend span{padding:2px 6px;border-radius:5px}\n.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}\n.overlay.show{display:flex}\n.dialog{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%;text-align:center}\n.dialog h3{margin:0 0 8px;font-size:1.5rem}\n.dialog p{margin:6px 0}\n.loading{opacity:.4;pointer-events:none}\n.printhead{display:none}\n\n@media (max-width:520px){\n  .logo{height:46px}\n  .titlebox h1{font-size:1.4rem}\n}\n@media print{\n  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  body{background:#fff}\n  .right,.pad,.padhelp,.msg,.sub,.titlebox,.stats,.overlay{display:none!important}\n  .top{margin:0 0 8px}\n  .logo{height:1.3cm}\n  .printhead{display:block;margin-bottom:12px;font-size:1.2rem}\n  .board{width:16cm}\n  .cell{font-size:calc(16cm / var(--n) * .55)}\n  .cell.peer,.cell.same,.cell.sel{background:#fff}\n}\n\n/* Eingebettet in die Plattform: Kopf wird von der Plattform gezeigt */\nbody.embed .top{display:none}\nbody.embed .wrap{padding-top:0}\n@media print{body.embed .top{display:flex}}\n\n/* Kennzeichnung «Lösung angezeigt» */\n#stStatus.bad{color:var(--bad)}\n#stStatus.good{color:var(--ok)}\n.solbanner{display:none;background:#b91c1c;color:#fff;font-weight:bold;text-align:center;padding:8px 10px;border-radius:8px;margin-bottom:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n#stage{position:relative}\n#stage.sol{outline:4px solid #b91c1c;outline-offset:2px}\n#stage.sol::after{content:\"\";position:absolute;inset:0;pointer-events:none;z-index:5;background:url(\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='170'><text x='130' y='90' text-anchor='middle' font-family='Arial' font-size='22' font-weight='bold' fill='%23b91c1c' fill-opacity='.38' transform='rotate(-25 130 85)'>LÖSUNG ANGEZEIGT<\/text><\/svg>\") repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n\n/* Knobeleien */\n.kn-wrap{width:min(100%,520px);margin:0 auto}\n.kn-info{font-size:.95rem;margin:0 0 6px;color:var(--muted)}\n.kn-info b{color:var(--ink);font-variant-numeric:tabular-nums}\n.kn-svg{display:block;width:100%;height:auto;background:#fff;border:3px solid var(--thick);border-radius:6px;user-select:none;touch-action:manipulation}\n.kn-sx .kn-svg,.kn-hr .kn-svg{border-color:var(--line)}\n.kn-svg g[data-i]{cursor:pointer}\n.kn-svg g.can rect{stroke:var(--accent);stroke-width:2.5}\n.kn-svg g.em{cursor:default}\n.kn-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px auto 0;width:min(100%,360px)}\n.kn-pad button{font:inherit;font-size:1.2rem;padding:10px 0;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}\n.kn-pad button:active{background:var(--accent-bg)}\n.kn-pad .padhelp{margin:4px 0 0;width:auto;font-size:.9rem}\n.kn-pad1{grid-template-columns:1fr;width:min(100%,520px)}\n.kn-pad1 .go{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:bold}\n/* Fluss */\n.rv{display:grid;grid-template-columns:1fr 112px 1fr;gap:0;border:3px solid var(--thick);border-radius:8px;overflow:hidden;background:#fff;min-height:250px}\n.rv .bank{background:#e3f1dc;padding:8px 6px}\n.rv .bank h4{margin:0 0 6px;font-size:.9rem;color:var(--muted);text-align:center}\n.rv .water{background:#cfe6f5;display:flex;align-items:center;padding:6px}\n.rv .raft{width:92px;min-height:110px;background:#c8a46b;border:3px solid #8b6a34;border-radius:8px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:margin .4s;position:relative}\n.rv .raft span{font-size:.75rem;color:#5c4520}\n.rv .raft.atL{margin-right:auto}\n.rv .raft.atR{margin-left:auto}\n.rv .ppl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}\n.rv .raft .ppl{flex-direction:column;flex-wrap:nowrap}\n.chip{display:flex;flex-direction:column;align-items:center;gap:0;font:inherit;border:2px solid var(--line);background:#fff;border-radius:10px;padding:3px 6px;min-width:62px;cursor:pointer;color:var(--ink)}\n.chip .em{font-size:1.6rem;line-height:1.15}\n.chip .nm{font-size:.72rem}\n.chip:hover{border-color:var(--accent)}\n@media (max-width:420px){.rv{grid-template-columns:1fr 84px 1fr}.rv .water{padding:4px}.rv .raft{width:68px}.rv .bank{padding:6px 4px}.rv .ppl{gap:4px}.chip{min-width:48px;padding:3px 2px}.chip .nm{font-size:.62rem}}\n@media print{\n  .kn-wrap{width:16cm}\n  .kn-pad,.kn-info{display:none}\n}\n\n\n.setup-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:260px;padding:28px 18px;text-align:center;border:2px dashed var(--line,#cbd5e1);border-radius:16px;background:#f8fafc;color:#334155}\n.setup-ph .big{font-size:40px;line-height:1}\n.setup-ph h3{margin:0;font-size:1.15rem}\n.setup-ph p{margin:0;max-width:34ch;font-size:.95rem}\n.setup-ph .chosen{font-weight:700;color:#0f172a}\n.setup-ph .btn{margin-top:6px;min-width:220px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <img class=\"logo\" src=\"data:image/png;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==\" alt=\"Logo\">\n    <div class=\"titlebox\">\n      <h1 id=\"gameTitle\">Rätsel-Trainer<\/h1>\n      <p class=\"sub\" id=\"sub\"><\/p>\n    <\/div>\n  <\/header>\n\n    <div class=\"layout\">\n    <div class=\"left\">\n      <div class=\"printhead\"><span id=\"phTitle\"><\/span> &nbsp;&nbsp; Name: ______________________<\/div>\n      <div class=\"stats\">\n        <span>Niveau: <b id=\"stLevel\">–<\/b><\/span>\n        <span>Zeit: <b id=\"stTime\">00:00<\/b><\/span>\n        <span>Tipps: <b id=\"stTips\">0<\/b><\/span>\n        <span>Prüfungen: <b id=\"stChecks\">0<\/b><\/span>\n        <span>Status: <b id=\"stStatus\">in Arbeit<\/b><\/span>\n      <\/div>\n      <div id=\"solBanner\" class=\"solbanner\" role=\"alert\">⚠ LÖSUNG ANGEZEIGT – dieses Rätsel zählt nicht als selbst gelöst<\/div>\n      <div id=\"stage\"><\/div>\n      <div id=\"pad\"><\/div>\n      <div class=\"msg\" id=\"msg\" role=\"status\" aria-live=\"polite\"><\/div>\n    <\/div>\n\n    <div class=\"right\">\n      <div class=\"card\">\n        <h2 id=\"newTitle\">Neues Rätsel<\/h2>\n        <label class=\"small\" id=\"sizeLbl\">Grösse<\/label>\n        <div class=\"seg\" id=\"sizeSeg\"><\/div>\n        <label class=\"small\">Niveau<\/label>\n        <div class=\"seg\" id=\"lvlSeg\"><\/div>\n        <p class=\"lvldesc\" id=\"lvlDesc\"><\/p>\n        <button class=\"btn primary\" style=\"width:100%\" id=\"btnNew\">Neues Rätsel erstellen<\/button>\n      <\/div>\n\n      <div class=\"card\">\n        <h2>Werkzeuge<\/h2>\n        <div class=\"btns\">\n          <button class=\"btn primary full\" id=\"btnCheck\">✔ Überprüfen<\/button>\n          <button class=\"btn\" id=\"btnNotes\">✎ Notizen: aus<\/button>\n          <button class=\"btn\" id=\"btnHint\">💡 Tipp<\/button>\n          <button class=\"btn\" id=\"btnReset\">↺ Neu beginnen<\/button>\n          <button class=\"btn\" id=\"btnSolve\">Lösung zeigen<\/button>\n          <button class=\"btn full\" id=\"btnPrint\">🖨 Drucken<\/button>\n        <\/div>\n        <label class=\"toggle\"><input type=\"checkbox\" id=\"autoCheck\"> Fehler sofort rot anzeigen<\/label>\n        <div class=\"legend\">\n          <span style=\"background:var(--okbg);color:var(--ok)\">richtig<\/span>\n          <span style=\"background:var(--badbg);color:var(--bad)\">falsch<\/span>\n          <span style=\"background:var(--hintbg);color:var(--hint)\">Tipp<\/span>\n          <span style=\"font-weight:bold\">vorgegeben<\/span>\n        <\/div>\n      <\/div>\n\n      <div class=\"card\">\n        <details>\n          <summary id=\"rulesTitle\">So geht's<\/summary>\n          <ul id=\"rules\"><\/ul>\n        <\/details>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <div class=\"dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"winTitle\">\n    <h3 id=\"winTitle\">🎉 Geschafft!<\/h3>\n    <p id=\"winText\"><\/p>\n    <p style=\"font-size:.9rem;color:var(--muted)\">Tipp: Mach einen Screenshot für dein Lernjournal.<\/p>\n    <button class=\"btn primary\" id=\"btnWinNew\" style=\"margin-top:10px\">Nächstes Rätsel<\/button>\n    <button class=\"btn\" id=\"btnWinClose\" style=\"margin-top:10px\">Schliessen<\/button>\n  <\/div>\n<\/div>\n\n<script>\n'use strict';\n/* =====================================================================\n   KERN – gemeinsam für alle Rätsel (wird in jede Rätsel-Datei eingebaut)\n   Enthält: Hilfsfunktionen und die Basisklasse GridPuzzle.\n   Ein Rätsel erbt von GridPuzzle und meldet sich mit  const GAME = {...}  an.\n   ===================================================================== */\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction randOf(a){return a[Math.floor(Math.random()*a.length)];}\nconst LEVEL_NAMES={sl:'Sehr leicht',l:'Leicht',m:'Mittel',s:'Schwer'};\n\nclass GridPuzzle{\n  constructor(def,size,lvlKey,data){\n    this.def=def; this.n=size; this.lvlKey=lvlKey;\n    this.sol=data.sol; this.cur=data.puz.slice();\n    this.given=data.puz.map(v=>v>0);\n    this.hinted=new Array(size*size).fill(false);\n    this.mark=new Array(size*size).fill(0);          // 0 nichts, 1 richtig, 2 falsch\n    this.sel=-1; this.done=false; this.cells=[]; this.ctx=null;\n  }\n\n  /* --- Hooks, die Unterklassen überschreiben --- */\n  baseClass(i){return 'cell';}\n  extraClass(i){return i===this.sel?' sel':'';}\n  paint(i,d){}                                       // Zelleninhalt zeichnen\n  onCell(i){this.sel=i;this.refresh();}\n  handleKey(e){return false;}\n  buildPad(pad){pad.className='padhelp';pad.textContent=this.def.padHelp||'';}\n  afterSet(i,v){}\n  afterReset(){}\n  afterRefresh(){}\n  cellState(i){const v=this.cur[i];if(!v)return 'empty';return v===this.sol[i]?'right':'wrong';}\n  solved(){return this.cur.every((v,k)=>v===this.sol[k]);}\n  pickHint(){\n    const open=[];\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]&&this.cur[i]!==this.sol[i])open.push(i);\n    if(!open.length)return null;\n    const i=(this.sel>=0&&open.includes(this.sel))?this.sel:randOf(open);\n    return {i,text:'Ein Feld wurde mit einem Tipp ausgefüllt (gelb).'};\n  }\n  revealEmpty(i){this.hinted[i]=true;}\n\n  /* --- gemeinsame Abläufe --- */\n  buildBoard(){\n    const b=document.createElement('div');\n    b.className='board g-'+this.def.id;\n    b.style.setProperty('--n',this.n);\n    b.setAttribute('aria-label',this.def.name+'-Feld');\n    this.cells=[];\n    for(let i=0;i<this.n*this.n;i++){\n      const d=document.createElement('div');\n      d.addEventListener('click',()=>this.onCell(i));\n      b.appendChild(d);this.cells.push(d);\n    }\n    return b;\n  }\n  mount(ctx,stage,pad){\n    this.ctx=ctx;\n    stage.innerHTML='';\n    stage.appendChild(this.buildBoard());\n    pad.className='';pad.removeAttribute('style');pad.innerHTML='';\n    this.buildPad(pad);\n    this.refresh();\n  }\n  refresh(){\n    for(let i=0;i<this.cur.length;i++){\n      const d=this.cells[i];\n      let cls=this.baseClass(i);\n      if(this.given[i])cls+=' given';\n      if(this.hinted[i])cls+=' hint';\n      if(this.mark[i]===1)cls+=' ok';\n      if(this.mark[i]===2)cls+=' bad';\n      cls+=this.extraClass(i);\n      d.className=cls;\n      this.paint(i,d);\n    }\n    this.afterRefresh();\n  }\n  commit(){this.ctx.hideMsg();this.refresh();this.ctx.changed();}\n  setCell(i,v){\n    this.cur[i]=v;this.hinted[i]=false;this.mark[i]=0;\n    if(v&&this.ctx.autoCheck()&&v!==this.sol[i])this.mark[i]=2;\n    this.afterSet(i,v);\n  }\n  editable(){return !this.done&&this.sel>=0&&!this.given[this.sel];}\n  keydown(e){\n    if(this.handleKey(e))return true;\n    const k=e.key,N=this.n;\n    if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))return false;\n    if(this.sel<0)this.sel=0;\n    else{\n      const r=Math.floor(this.sel/N),c=this.sel%N;\n      if(k==='ArrowLeft'&&c>0)this.sel--;\n      if(k==='ArrowRight'&&c<N-1)this.sel++;\n      if(k==='ArrowUp'&&r>0)this.sel-=N;\n      if(k==='ArrowDown'&&r<N-1)this.sel+=N;\n    }\n    this.refresh();return true;\n  }\n  check(){\n    let wrong=0,empty=0,right=0;\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i]||this.hinted[i])continue;\n      const s=this.cellState(i);\n      if(s==='empty'){empty++;this.mark[i]=0;}\n      else if(s==='skip')this.mark[i]=0;\n      else if(s==='right'){this.mark[i]=1;right++;}\n      else{this.mark[i]=2;wrong++;}\n    }\n    this.refresh();\n    return {wrong,empty,right};\n  }\n  hint(){\n    const p=this.pickHint();\n    if(!p)return null;\n    this.cur[p.i]=this.sol[p.i];this.hinted[p.i]=true;this.mark[p.i]=0;\n    this.afterSet(p.i,this.sol[p.i]);\n    this.sel=p.i;this.refresh();\n    return p.text;\n  }\n  reset(){\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]){this.cur[i]=0;this.hinted[i]=false;}\n    this.mark.fill(0);this.sel=-1;this.done=false;\n    this.afterReset();this.refresh();\n  }\n  reveal(){\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i])continue;\n      if(this.cur[i]&&this.cur[i]!==this.sol[i])this.mark[i]=2;\n      else if(this.cur[i]===this.sol[i])this.mark[i]=1;\n      else this.revealEmpty(i);\n      this.cur[i]=this.sol[i];\n    }\n    this.afterReset();   // Notizen o. Ä. löschen\n    this.done=true;this.refresh();\n  }\n  finish(){\n    this.done=true;\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]&&!this.hinted[i])this.mark[i]=1;\n    this.refresh();\n  }\n  applyAutoCheck(on){\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i]||this.hinted[i])continue;\n      if(!on&&this.mark[i]===2)this.mark[i]=0;\n      if(on&&this.cur[i]&&this.cur[i]!==this.sol[i])this.mark[i]=2;\n    }\n    this.refresh();\n  }\n  clearSelection(){this.sel=-1;this.refresh();}\n}\n\n\n/* =====================================================================\n   RÄTSEL-MODUL: Knobeleien (Nachbauten der Aufgaben 12, 16, 23 und 26\n   von https://www.mathematik.ch/puzzle/ – eigene Umsetzung, eigener Code)\n     • Theseus und der Minotaurus   (Nr. 12)\n     • Sixteen-Puzzle               (Nr. 16)\n     • Sechs Hasen                  (Nr. 23)\n     • Flussüberquerung in China    (Nr. 26)\n   Alle vier sind «Zustands-Rätsel»: Es gibt keine Felder zum Ausfüllen,\n   sondern Züge. Eine Breitensuche (BFS) liefert Tipps, Prüfung und Lösung.\n   ===================================================================== */\n/* ===== LOGIK-START ===== */\n/* ---------- Breitensuche: kürzester Zugweg bis zum Ziel ---------- */\nfunction knSolve(start,spec,cap){\n  if(spec.isGoal(start))return [];\n  const S=[start],P=[-1],M=[null],seen=new Set([spec.key(start)]);\n  const max=cap||1500000;\n  for(let h=0;h<S.length&&S.length<max;h++){\n    for(const mv of spec.moves(S[h])){\n      if(mv.caught)continue;\n      const k=spec.key(mv.next);\n      if(seen.has(k))continue;\n      seen.add(k);S.push(mv.next);P.push(h);M.push(mv);\n      if(spec.isGoal(mv.next)){\n        const path=[];\n        for(let i=S.length-1;i>0;i=P[i])path.push(M[i]);\n        return path.reverse();\n      }\n    }\n  }\n  return null;\n}\n\n/* ---------- Sixteen-Puzzle (Nr. 16) ----------\n   17 Felder in fünf Zeilen (3, 3, 5, 3, 3). 8 goldene Steine oben, 8 silberne unten, Mitte leer.\n   Zug: ein Stein rutscht auf ein angrenzendes leeres Feld ODER springt geradlinig\n   über einen beliebigen Stein auf das leere Feld. Ziel: Gold und Silber tauschen die Plätze. */\nconst SX_CELLS=[];\n[[1,3],[1,3],[0,4],[1,3],[1,3]].forEach(([a,b],r)=>{for(let c=a;c<=b;c++)SX_CELLS.push([r,c]);});\nconst SX_IDX={};SX_CELLS.forEach(([r,c],i)=>{SX_IDX[r+','+c]=i;});\nconst SX_NB=SX_CELLS.map(([r,c])=>{\n  const l=[];\n  for(const [dr,dc] of [[0,1],[0,-1],[1,0],[-1,0]]){\n    const a=SX_IDX[(r+dr)+','+(c+dc)],b=SX_IDX[(r+2*dr)+','+(c+2*dc)];\n    if(a!==undefined)l.push({from:a,mid:-1});\n    if(a!==undefined&&b!==undefined)l.push({from:b,mid:a});\n  }\n  return l;\n});\nconst SX_START=[...Array(8).fill(1),0,...Array(8).fill(2)];\nconst SX_GOAL=[...Array(8).fill(2),0,...Array(8).fill(1)];\nconst SX_GOALKEY=SX_GOAL.join('');\nfunction sxMoves(s){\n  const e=s.indexOf(0),res=[];\n  for(const {from,mid} of SX_NB[e]){\n    if(!s[from])continue;\n    if(mid>=0&&!s[mid])continue;\n    const next=s.slice();next[e]=s[from];next[from]=0;\n    res.push({from,to:e,jump:mid>=0,next});\n  }\n  return res;\n}\nlet sxDistCache=null;\nfunction sxDist(){            /* Abstand jedes Zustands zum Ziel (Züge sind umkehrbar → Suche vom Ziel aus) */\n  if(sxDistCache)return sxDistCache;\n  const d=new Map([[SX_GOALKEY,0]]),q=[SX_GOAL];\n  for(let h=0;h<q.length;h++){\n    const s=q[h],ds=d.get(s.join(''));\n    for(const m of sxMoves(s)){const k=m.next.join('');if(!d.has(k)){d.set(k,ds+1);q.push(m.next);}}\n  }\n  return sxDistCache=d;\n}\nfunction sxPlan(s){\n  const d=sxDist();let n=d.get(s.join(''));\n  if(n===undefined)return null;\n  const path=[];\n  while(n>0){\n    const m=sxMoves(s).find(x=>d.get(x.next.join(''))===n-1);\n    path.push(m);s=m.next;n--;\n  }\n  return path;\n}\nfunction sxSpec(k){            /* k = so viele Züge sind es (mindestens) bis zum Ziel */\n  const d=sxDist();\n  let s=SX_START,rest=d.get(SX_START.join(''));\n  while(rest>k){\n    const opts=sxMoves(s).filter(x=>d.get(x.next.join(''))===rest-1);\n    s=opts[Math.floor(Math.random()*opts.length)].next;rest--;\n  }\n  return {start:s,isGoal:x=>x.join('')===SX_GOALKEY,moves:sxMoves,key:x=>x.join(''),plan:sxPlan,\n          limit:Math.round(rest*80/31),optimum:rest};\n}\n\n/* ---------- Sechs Hasen (Nr. 23) ----------\n   Gelbe Hasen hüpfen nach rechts, graue nach links: ein Feld vorwärts oder über einen anderen Hasen. */\nfunction hrSpec(n){\n  const start=[...Array(n).fill(1),0,...Array(n).fill(2)],goal=[...Array(n).fill(2),0,...Array(n).fill(1)].join('');\n  return {\n    n,start,optimum:n*n+2*n,\n    isGoal:s=>s.join('')===goal,\n    key:s=>s.join(''),\n    moves(s){\n      const e=s.indexOf(0),res=[];\n      const add=(from,col)=>{\n        if(from<0||from>=s.length||s[from]!==col)return;\n        if(Math.abs(from-e)===2&&!s[(from+e)/2])return;\n        const next=s.slice();next[e]=col;next[from]=0;\n        res.push({from,to:e,jump:Math.abs(from-e)===2,next});\n      };\n      add(e-1,1);add(e-2,1);add(e+1,2);add(e+2,2);\n      return res;\n    }\n  };\n}\n\n/* ---------- Flussüberquerung in China (Nr. 26) ----------\n   Personen: V Vater, M Mutter, T Mädchen, S Knabe, P Polizist, D Dieb.\n   Floss: höchstens 2 Personen, nur V, M oder P können steuern. Die Regeln gelten für jede Gruppe,\n   die zusammen ist: an beiden Ufern und auf dem Floss. */\nconst RV_INFO={V:['Vater','👨'],M:['Mutter','👩'],T:['Mädchen','👧'],S:['Knabe','👦'],P:['Polizist','👮'],D:['Dieb','🦹']};\nfunction rvWhy(names,g){\n  const has=k=>g.some(i=>names[i]===k);\n  if(has('V')&&has('T')&&!has('M'))return 'Der Vater darf nur in Begleitung der Mutter mit den Mädchen zusammen sein.';\n  if(has('M')&&has('S')&&!has('V'))return 'Die Mutter darf nur in Begleitung des Vaters mit den Knaben zusammen sein.';\n  if(has('D')&&(has('V')||has('M')||has('T')||has('S'))&&!has('P'))return 'Der Dieb darf nur in Begleitung des Polizisten mit Familienmitgliedern zusammen sein.';\n  return null;\n}\nfunction rvSpec(names){\n  const n=names.length;\n  const norm=s=>({pos:s.pos.map(p=>p===2?s.raft:p),raft:s.raft});\n  return {\n    names,norm,\n    start:{pos:Array(n).fill(0),raft:0},\n    isGoal:s=>s.pos.every(p=>p===1),\n    key:s=>s.pos.join('')+s.raft,\n    moves(s0){\n      const s=norm(s0),side=s.raft,res=[];\n      const here=[],other=[];\n      for(let i=0;i<n;i++)(s.pos[i]===side?here:other).push(i);\n      const groups=[];\n      for(const a of here){groups.push([a]);for(const b of here)if(b>a)groups.push([a,b]);}\n      for(const pas of groups){\n        if(!pas.some(i=>'VMP'.includes(names[i])))continue;\n        if(rvWhy(names,pas))continue;\n        if(rvWhy(names,here.filter(i=>!pas.includes(i))))continue;\n        if(rvWhy(names,other.concat(pas)))continue;\n        const pos=s.pos.slice();for(const i of pas)pos[i]=1-side;\n        res.push({pas,next:{pos,raft:1-side}});\n      }\n      return res;\n    },\n    plan(s){return knSolve(norm(s),this);},\n    optimum:null\n  };\n}\n\n/* ---------- Theseus und der Minotaurus (Nr. 12) ----------\n   Labyrinth W×H. Wände: wr[r][c] = Wand rechts von (r,c); wd[r][c] = Wand unterhalb von (r,c).\n   Pro Zug von Theseus (1 Feld oder Pause) macht der Minotaurus bis zu 2 Schritte auf Theseus zu:\n   zuerst waagrecht, geht das nicht, senkrecht, geht auch das nicht, bleibt er stehen. */\nfunction mzOpen(mz,i,dr,dc){\n  const W=mz.W,H=mz.H,r=Math.floor(i/W),c=i%W,r2=r+dr,c2=c+dc;\n  if(r2<0||r2>=H||c2<0||c2>=W)return false;\n  if(dc===1)return !mz.wr[r][c];\n  if(dc===-1)return !mz.wr[r][c2];\n  if(dr===1)return !mz.wd[r][c];\n  return !mz.wd[r2][c];\n}\nfunction mzMinoStep(mz,m,t){\n  const W=mz.W,mr=Math.floor(m/W),mc=m%W,tr=Math.floor(t/W),tc=t%W;\n  if(mc!==tc){const dc=tc>mc?1:-1;if(mzOpen(mz,m,0,dc))return m+dc;}\n  if(mr!==tr){const dr=tr>mr?1:-1;if(mzOpen(mz,m,dr,0))return m+dr*W;}\n  return m;\n}\nconst MZ_DIRS=[['hoch',-1,0],['runter',1,0],['links',0,-1],['rechts',0,1]];\nfunction mzSpec(mz,t,m,ex){\n  const W=mz.W;\n  return {\n    mz,ex,start:{t,m},\n    isGoal:s=>s.t===ex,\n    key:s=>s.t*mz.W*mz.H+s.m,\n    moves(s){\n      const res=[];\n      for(const [name,dr,dc] of [...MZ_DIRS,['Pause',0,0]]){\n        if((dr||dc)&&!mzOpen(mz,s.t,dr,dc))continue;\n        const t2=s.t+dr*W+dc;\n        if(t2===ex){res.push({dir:name,next:{t:t2,m:s.m},caught:false});continue;}\n        if(t2===s.m){res.push({dir:name,next:{t:t2,m:s.m},caught:true});continue;}\n        let m2=mzMinoStep(mz,s.m,t2),caught=m2===t2;\n        if(!caught){m2=mzMinoStep(mz,m2,t2);caught=m2===t2;}\n        res.push({dir:name,next:{t:t2,m:m2},caught});\n      }\n      return res;\n    }\n  };\n}\nfunction mzGen(W,H){\n  const wr=Array.from({length:H},()=>Array(W-1).fill(true)),wd=Array.from({length:H-1},()=>Array(W).fill(true));\n  const seen=new Set([0]),stack=[0];\n  while(stack.length){\n    const i=stack[stack.length-1],r=Math.floor(i/W),c=i%W;\n    const opts=shuffle(MZ_DIRS.map(d=>d).filter(([n,dr,dc])=>{\n      const r2=r+dr,c2=c+dc;return r2>=0&&r2<H&&c2>=0&&c2<W&&!seen.has(r2*W+c2);}));\n    if(!opts.length){stack.pop();continue;}\n    const [,dr,dc]=opts[0],j=(r+dr)*W+c+dc;\n    if(dc===1)wr[r][c]=false;else if(dc===-1)wr[r][c-1]=false;else if(dr===1)wd[r][c]=false;else wd[r-1][c]=false;\n    seen.add(j);stack.push(j);\n  }\n  /* zusätzliche Durchgänge: Kreise im Labyrinth, damit der Minotaurus umgangen werden kann */\n  for(let k=0;k<Math.round(W*H/5);k++){\n    if(Math.random()<.5){const r=Math.floor(Math.random()*H),c=Math.floor(Math.random()*(W-1));wr[r][c]=false;}\n    else{const r=Math.floor(Math.random()*(H-1)),c=Math.floor(Math.random()*W);wd[r][c]=false;}\n  }\n  return {W,H,wr,wd};\n}\nfunction mzPlain(mz,a,b){        /* Weglänge ohne Minotaurus */\n  const d=new Map([[a,0]]),q=[a];\n  for(let h=0;h<q.length;h++){\n    const i=q[h];if(i===b)return d.get(i);\n    for(const [,dr,dc] of MZ_DIRS)if(mzOpen(mz,i,dr,dc)){const j=i+dr*mz.W+dc;if(!d.has(j)){d.set(j,d.get(i)+1);q.push(j);}}\n  }\n  return null;\n}\n/* Niveau: [Breite, Höhe, kürzeste Lösung mindestens, Mehraufwand gegenüber dem freien Weg] */\nconst MZ_LEVELS={sl:[5,5,5,0],l:[6,6,9,1],m:[7,7,13,3],s:[8,8,18,5]};\nfunction mzCreate(lvl,tries){\n  const [W,H,minLen,extra]=MZ_LEVELS[lvl];\n  let best=null,bestLen=-1;\n  for(let n=0;n<(tries||400);n++){\n    const mz=mzGen(W,H),N=W*H;\n    const t=Math.floor(Math.random()*N),ex=Math.floor(Math.random()*N),m=Math.floor(Math.random()*N);\n    if(t===ex||t===m||ex===m)continue;\n    const plain=mzPlain(mz,t,ex);\n    if(plain===null||plain<Math.min(W+H-3,minLen-extra-2))continue;\n    if(Math.abs(Math.floor(m/W)-Math.floor(t/W))+Math.abs(m%W-t%W)<3)continue;\n    const spec=mzSpec(mz,t,m,ex),path=knSolve(spec.start,spec,200000);\n    if(!path||path.length<minLen||path.length<plain+extra)continue;\n    if(lvl!=='s'){best={spec,len:path.length};break;}   // Stufen 1–3: erster passender genügt\n    if(path.length>bestLen){bestLen=path.length;best={spec,len:path.length};}\n  }\n  if(best)best.spec.optimum=best.len;\n  return best&&best.spec;\n}\n/* Fluss und Hasen: Niveaus */\nconst RV_LEVELS={sl:'VMTPD',l:'VMTSPD',m:'VMTTSPD',s:'VMTTSSPD'};\nconst HR_LEVELS={sl:2,l:3,m:4,s:5};\nconst SX_LEVELS={sl:6,l:14,m:22,s:31};\n/* ===== LOGIK-ENDE ===== */\n\n/* ---------- gemeinsame Klasse für alle Zustands-Rätsel ---------- */\nclass StatePuzzle{\n  constructor(def,size,lvlKey,spec){\n    this.def=def;this.n=size;this.lvlKey=lvlKey;this.spec=spec;\n    this.state=spec.start;this.stack=[];this.moves=0;this.done=false;this.lost=false;this.ctx=null;\n  }\n  mount(ctx,stage,pad){\n    this.ctx=ctx;this.stage=stage;\n    stage.innerHTML='';pad.className='';pad.removeAttribute('style');pad.innerHTML='';\n    this.spec.build(this,stage,pad);\n    this.refresh();\n  }\n  refresh(){\n    this.spec.draw(this);\n    if(this.info){\n      const lim=this.spec.limit;\n      this.info.innerHTML=`Züge: <b>${this.moves}<\/b>${lim?` &nbsp;(erlaubt: höchstens <b>${lim}<\/b>)`:''}`;\n    }\n  }\n  /* Zug ausführen (count=false: Zwischenschritt wie «aufs Floss steigen», zählt nicht) */\n  step(mv,count=true){\n    if(this.done||this.lost)return false;\n    if(count){\n      const lim=this.spec.limit;\n      if(lim&&this.moves>=lim){\n        this.ctx.msg(`Du hast schon ${lim} Züge gebraucht – das ist die Grenze. Nimm Züge zurück («↶ Zug zurück») oder beginne neu.`,'warn');\n        return false;\n      }\n      this.stack.push(this.state);this.moves++;\n    }\n    this.state=mv.next;this.lost=!!mv.caught;\n    this.ctx.hideMsg();this.refresh();\n    if(this.lost)this.ctx.msg('Der Minotaurus hat Theseus erwischt! Mit «↶ Zug zurück» nimmst du den letzten Zug zurück.','warn');\n    else this.ctx.changed();\n    return true;\n  }\n  undo(){\n    if(this.done)return;\n    if(!this.stack.length){this.ctx.msg('Es gibt keinen Zug zum Zurücknehmen.','info');return;}\n    this.state=this.stack.pop();this.moves--;this.lost=false;\n    this.ctx.hideMsg();this.refresh();\n  }\n  plan(){return this.spec.plan?this.spec.plan(this.state):knSolve(this.state,this.spec,300000);}\n  solved(){return !this.lost&&this.spec.isGoal(this.state);}\n  customCheck(){\n    if(this.lost)return {text:'Theseus wurde vom Minotaurus erwischt. Nimm den letzten Zug zurück.',type:'warn'};\n    const path=this.plan();\n    if(!path)return {text:'Von hier aus ist das Ziel nicht mehr erreichbar. Nimm Züge zurück («↶ Zug zurück») oder beginne neu.',type:'warn'};\n    const rest=this.spec.limit?this.spec.limit-this.moves:Infinity;\n    if(path.length>rest)return {text:`Mit den erlaubten Zügen schaffst du es von hier aus nicht mehr (nötig: mindestens ${path.length}, erlaubt: noch ${rest}). Nimm Züge zurück.`,type:'warn'};\n    return {text:`Gut so – das Ziel ist noch erreichbar (mindestens ${path.length} weitere ${path.length===1?'Zug':'Züge'}).`,type:'good'};\n  }\n  hint(){\n    if(this.done)return null;\n    if(this.lost)return 'Theseus wurde erwischt – nimm zuerst den letzten Zug zurück («↶ Zug zurück»).';\n    const path=this.plan();\n    if(!path)return 'Von hier aus gibt es keinen Weg zum Ziel mehr – nimm Züge zurück («↶ Zug zurück») oder beginne neu.';\n    if(!path.length)return null;\n    if(this.spec.hintApply)return this.spec.hintApply(this,path);\n    const mv=path[0];\n    if(!this.step(mv))return null;\n    return `Tipp: ${this.spec.describe(mv)} – dieser Zug wurde schon ausgeführt. Noch ${path.length-1} ${path.length-1===1?'Zug':'Züge'} bis zum Ziel.`;\n  }\n  reset(){\n    this.state=this.spec.start;this.stack=[];this.moves=0;this.lost=false;this.done=false;\n    this.refresh();\n  }\n  reveal(){\n    if(this.lost&&this.stack.length){this.state=this.stack.pop();this.lost=false;}\n    const path=this.plan()||[];\n    this.done=true;\n    let i=0;\n    const run=()=>{\n      if(i>=path.length||!this.stage.isConnected)return;\n      const mv=path[i++];\n      this.state=this.spec.revealNext?this.spec.revealNext(this,mv):mv.next;\n      this.refresh();setTimeout(run,380);\n    };\n    run();\n  }\n  finish(){this.done=true;this.refresh();}\n  winInfo(){\n    const o=this.spec.optimum;\n    return `Züge: <b>${this.moves}<\/b>${o?` (kürzeste Lösung: ${o})`:''}`;\n  }\n  keydown(e){return this.spec.keydown?this.spec.keydown(this,e):false;}\n  applyAutoCheck(){}\n  clearSelection(){}\n}\n\n/* ---------- Darstellung ---------- */\nconst SVGNS='http://www.w3.org/2000/svg';\nfunction knFrame(p,stage,viewBox,cls){\n  const wrap=document.createElement('div');wrap.className='kn-wrap '+(cls||'');\n  p.info=document.createElement('div');p.info.className='kn-info';\n  wrap.appendChild(p.info);\n  const body=document.createElement('div');body.className='kn-body';\n  wrap.appendChild(body);\n  stage.appendChild(wrap);\n  let svg=null;\n  if(viewBox){\n    svg=document.createElementNS(SVGNS,'svg');\n    svg.setAttribute('viewBox',viewBox);svg.setAttribute('class','kn-svg');\n    svg.setAttribute('role','img');\n    body.appendChild(svg);\n  }\n  return {wrap,body,svg};\n}\nconst PAD_HELP=t=>pad=>{pad.className='padhelp';pad.textContent=t;};\n\n/* Theseus */\nfunction uiTheseus(spec){\n  const mz=spec.mz,W=mz.W,H=mz.H,S=40;\n  spec.describe=mv=>mv.dir==='Pause'?'Theseus bleibt stehen (Pause)':`Theseus geht ${mv.dir}`;\n  spec.build=(p,stage,pad)=>{\n    const f=knFrame(p,stage,`0 0 ${W*S} ${H*S}`,'kn-mz');p.svg=f.svg;\n    f.svg.setAttribute('aria-label','Labyrinth mit Theseus (rot), Minotaurus (schwarz) und Ausgang (grün)');\n    const go=(name)=>{const mv=spec.moves(p.state).find(m=>m.dir===name);if(mv)p.step(mv);else p.ctx.msg('Dort ist eine Wand.','info');};\n    f.svg.addEventListener('click',e=>{\n      const rc=f.svg.getBoundingClientRect(),x=(e.clientX-rc.left)/rc.width*W,y=(e.clientY-rc.top)/rc.height*H;\n      const c=Math.floor(x),r=Math.floor(y),t=p.state.t,tr=Math.floor(t/W),tc=t%W;\n      if(r===tr&&c===tc)return go('Pause');\n      if(r===tr&&c===tc+1)return go('rechts');\n      if(r===tr&&c===tc-1)return go('links');\n      if(c===tc&&r===tr+1)return go('runter');\n      if(c===tc&&r===tr-1)return go('hoch');\n      p.ctx.msg('Klicke auf ein Nachbarfeld von Theseus (oder auf Theseus selbst für eine Pause).','info');\n    });\n    pad.className='kn-pad';\n    const mk=(txt,name,label,col)=>{const b=document.createElement('button');b.textContent=txt;b.setAttribute('aria-label',label);b.style.gridColumn=col;b.addEventListener('click',()=>go(name));pad.appendChild(b);};\n    mk('▲','hoch','Hoch','2');mk('◀','links','Links','1');mk('Pause (d)','Pause','Pause','2');mk('▶','rechts','Rechts','3');mk('▼','runter','Runter','2');\n    const help=document.createElement('p');help.className='padhelp';help.style.gridColumn='1 / 4';\n    help.textContent='Pfeiltasten oder Knöpfe: Theseus bewegen · D: Pause · Z: Zug zurück';\n    pad.appendChild(help);\n  };\n  spec.draw=p=>{\n    const s=p.state,ex=spec.ex;let h='';\n    const cx=i=>(i%W)*S+S/2,cy=i=>Math.floor(i/W)*S+S/2;\n    h+=`<rect x=\"0\" y=\"0\" width=\"${W*S}\" height=\"${H*S}\" fill=\"#fff\"/>`;\n    h+=`<rect x=\"${(ex%W)*S+3}\" y=\"${Math.floor(ex/W)*S+3}\" width=\"${S-6}\" height=\"${S-6}\" rx=\"5\" fill=\"#d1f0dc\" stroke=\"#15803d\" stroke-width=\"2\"/>`;\n    h+=`<text x=\"${cx(ex)}\" y=\"${cy(ex)+5}\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#15803d\">A<\/text>`;\n    let w='';\n    for(let r=0;r<H;r++)for(let c=0;c<W;c++){\n      if(c<W-1&&mz.wr[r][c])w+=`M${(c+1)*S} ${r*S}V${(r+1)*S}`;\n      if(r<H-1&&mz.wd[r][c])w+=`M${c*S} ${(r+1)*S}H${(c+1)*S}`;\n    }\n    h+=`<path d=\"${w}\" stroke=\"#334155\" stroke-width=\"4\" stroke-linecap=\"round\" fill=\"none\"/>`;\n    h+=`<rect x=\"1.5\" y=\"1.5\" width=\"${W*S-3}\" height=\"${H*S-3}\" fill=\"none\" stroke=\"#334155\" stroke-width=\"4\"/>`;\n    const m=s.m,mx=cx(m),my=cy(m);\n    h+=`<polygon points=\"${mx-9},${my-6} ${mx-13},${my-16} ${mx-4},${my-10}\" fill=\"#111\"/><polygon points=\"${mx+9},${my-6} ${mx+13},${my-16} ${mx+4},${my-10}\" fill=\"#111\"/>`;\n    h+=`<circle cx=\"${mx}\" cy=\"${my}\" r=\"${S*.32}\" fill=\"#111\"/>`;\n    h+=`<circle cx=\"${cx(s.t)+(s.t===m?5:0)}\" cy=\"${cy(s.t)}\" r=\"${S*.27}\" fill=\"${p.lost?'#b91c1c':'#ef4444'}\" stroke=\"#7f1d1d\" stroke-width=\"2\"/>`;\n    p.svg.innerHTML=h;\n  };\n  spec.keydown=(p,e)=>{\n    const map={ArrowUp:'hoch',ArrowDown:'runter',ArrowLeft:'links',ArrowRight:'rechts',d:'Pause',D:'Pause'};\n    const name=map[e.key];if(!name)return false;\n    if(p.done)return true;\n    const mv=spec.moves(p.state).find(m=>m.dir===name);\n    if(mv)p.step(mv);\n    return true;\n  };\n  return spec;\n}\n\n/* Sixteen */\nfunction uiSixteen(spec){\n  const S=64;\n  spec.describe=mv=>`ein Stein ${mv.jump?'springt':'rutscht'} auf das leere Feld`;\n  spec.build=(p,stage,pad)=>{\n    const f=knFrame(p,stage,`0 0 ${5*S} ${5*S}`,'kn-sx');p.svg=f.svg;\n    f.svg.setAttribute('aria-label','Sixteen-Puzzle: 8 goldene und 8 silberne Steine');\n    f.svg.addEventListener('click',e=>{\n      const g=e.target.closest('[data-i]');if(!g||p.done)return;\n      const i=+g.dataset.i,mv=sxMoves(p.state).find(m=>m.from===i);\n      if(!mv){p.ctx.msg(p.state[i]?'Dieser Stein kann nicht ziehen: Er muss neben dem leeren Feld stehen oder geradlinig über einen Stein hinein springen.':'Klicke auf den Stein, der ziehen soll.','info');return;}\n      p.step(mv);\n    });\n    PAD_HELP('Stein anklicken: er rutscht oder springt auf das leere Feld. Ziel: Gold und Silber tauschen die Plätze.')(pad);\n  };\n  spec.draw=p=>{\n    const s=p.state;let h='';\n    SX_CELLS.forEach(([r,c],i)=>{\n      const x=c*S+S/2,y=r*S+S/2,v=s[i];\n      const can=!p.done&&!p.lost&&v&&sxMoves(s).some(m=>m.from===i);\n      h+=`<g data-i=\"${i}\" class=\"${v?'st':'em'}${can?' can':''}\"><rect x=\"${c*S+2}\" y=\"${r*S+2}\" width=\"${S-4}\" height=\"${S-4}\" rx=\"10\" fill=\"#f4f8e2\" stroke=\"#d3dbbd\"/>`;\n      if(v)h+=`<circle cx=\"${x}\" cy=\"${y}\" r=\"${S*.36}\" fill=\"${v===1?'#e0a800':'#b9c3cc'}\" stroke=\"${v===1?'#8a6500':'#64707c'}\" stroke-width=\"3\"/><circle cx=\"${x-8}\" cy=\"${y-9}\" r=\"6\" fill=\"#fff\" opacity=\".45\"/>`;\n      h+=`<\/g>`;\n    });\n    p.svg.innerHTML=h;\n  };\n  return spec;\n}\n\n/* Sechs Hasen */\nfunction uiHares(spec){\n  const n=spec.n,S=56,N=2*n+1;\n  spec.describe=mv=>`ein Hase ${mv.jump?'springt':'hüpft'} von Platz ${mv.from+1} auf Platz ${mv.to+1}`;\n  const rabbit=(x,col)=>`<g transform=\"translate(${x},0)\"><ellipse cx=\"-7\" cy=\"26\" rx=\"5\" ry=\"14\" fill=\"${col}\" stroke=\"#333\" stroke-width=\"1.5\"/><ellipse cx=\"7\" cy=\"26\" rx=\"5\" ry=\"14\" fill=\"${col}\" stroke=\"#333\" stroke-width=\"1.5\"/><ellipse cx=\"0\" cy=\"72\" rx=\"19\" ry=\"15\" fill=\"${col}\" stroke=\"#333\" stroke-width=\"1.5\"/><circle cx=\"0\" cy=\"52\" r=\"13\" fill=\"${col}\" stroke=\"#333\" stroke-width=\"1.5\"/><circle cx=\"-4.5\" cy=\"49\" r=\"1.9\" fill=\"#222\"/><circle cx=\"4.5\" cy=\"49\" r=\"1.9\" fill=\"#222\"/><circle cx=\"0\" cy=\"55\" r=\"2\" fill=\"#c0392b\"/><\/g>`;\n  spec.build=(p,stage,pad)=>{\n    const f=knFrame(p,stage,`0 0 ${N*S} 120`,'kn-hr');p.svg=f.svg;\n    f.svg.setAttribute('aria-label','Hasen in einer Reihe: gelbe links, graue rechts, eine Lücke');\n    f.svg.addEventListener('click',e=>{\n      const g=e.target.closest('[data-i]');if(!g||p.done)return;\n      const i=+g.dataset.i,mv=spec.moves(p.state).find(m=>m.from===i);\n      if(!mv){p.ctx.msg(p.state[i]?'Dieser Hase kann nicht ziehen: Gelbe hüpfen nur nach rechts, graue nur nach links – ein Feld oder über einen Hasen in die Lücke.':'Klicke auf den Hasen, der hüpfen soll.','info');return;}\n      p.step(mv);\n    });\n    PAD_HELP('Hasen anklicken: Gelbe hüpfen nach rechts, graue nach links – in die Lücke, auch über einen anderen Hasen. Ziel: Farben tauschen.')(pad);\n  };\n  spec.draw=p=>{\n    const s=p.state;let h='';\n    for(let i=0;i<N;i++){\n      const v=s[i],can=!p.done&&!p.lost&&v&&spec.moves(s).some(m=>m.from===i);\n      h+=`<g data-i=\"${i}\" class=\"${v?'st':'em'}${can?' can':''}\"><rect x=\"${i*S+3}\" y=\"6\" width=\"${S-6}\" height=\"108\" rx=\"10\" fill=\"#f4f8e2\" stroke=\"#d3dbbd\"/>`;\n      if(v)h+=rabbit(i*S+S/2,v===1?'#f2c230':'#a4acb5');\n      h+=`<text x=\"${i*S+S/2}\" y=\"112\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5f6b76\">${i+1}<\/text><\/g>`;\n    }\n    p.svg.innerHTML=h;\n  };\n  return spec;\n}\n\n/* Flussüberquerung */\nfunction uiRiver(spec){\n  const names=spec.names,n=names.length;\n  spec.describe=mv=>`fahre mit ${mv.pas.map(i=>RV_INFO[names[i]][0]).join(' und ')}`;\n  const label=i=>{\n    const k=names[i];let c=0;for(let j=0;j<=i;j++)if(names[j]===k)c++;\n    const tot=names.filter(x=>x===k).length;\n    return RV_INFO[k][0]+(tot>1?' '+c:'');\n  };\n  spec.build=(p,stage,pad)=>{\n    const f=knFrame(p,stage,null,'kn-rv');\n    f.body.innerHTML=`<div class=\"rv\"><div class=\"bank\" id=\"rvL\"><h4>Linkes Ufer<\/h4><div class=\"ppl\"><\/div><\/div><div class=\"water\"><div class=\"raft\" id=\"rvR\"><div class=\"ppl\"><\/div><span>Floss<\/span><\/div><\/div><div class=\"bank\" id=\"rvRt\"><h4>Rechtes Ufer<\/h4><div class=\"ppl\"><\/div><\/div><\/div>`;\n    p.rv={L:f.body.querySelector('#rvL .ppl'),R:f.body.querySelector('#rvRt .ppl'),raft:f.body.querySelector('#rvR'),rppl:f.body.querySelector('#rvR .ppl')};\n    pad.className='kn-pad kn-pad1';\n    const b=document.createElement('button');b.className='go';b.textContent='⛵ Floss fahren';\n    b.addEventListener('click',()=>cross(p));\n    pad.appendChild(b);\n    const help=document.createElement('p');help.className='padhelp';\n    help.textContent='Person anklicken: aufs Floss steigen oder wieder aussteigen. Dann «Floss fahren». Höchstens 2 Personen; steuern können nur Vater, Mutter und Polizist.';\n    pad.appendChild(help);\n  };\n  function chip(p,i,where){\n    const b=document.createElement('button');\n    b.className='chip';b.innerHTML=`<span class=\"em\">${RV_INFO[names[i]][1]}<\/span><span class=\"nm\">${label(i)}<\/span>`;\n    b.setAttribute('aria-label',label(i)+(where==='raft'?' (auf dem Floss)':''));\n    b.addEventListener('click',()=>clickPerson(p,i));\n    return b;\n  }\n  function clickPerson(p,i){\n    if(p.done)return;\n    const s=p.state,pos=s.pos.slice();\n    if(pos[i]===2){pos[i]=s.raft;p.ctx.hideMsg();p.state={pos,raft:s.raft};p.refresh();return;}\n    if(pos[i]!==s.raft){p.ctx.msg('Das Floss liegt am anderen Ufer.','info');return;}\n    if(pos.filter(x=>x===2).length>=2){p.ctx.msg('Auf dem Floss ist nur Platz für zwei Personen.','warn');return;}\n    pos[i]=2;p.ctx.hideMsg();p.state={pos,raft:s.raft};p.refresh();\n  }\n  function cross(p){\n    if(p.done)return;\n    const s=p.state,pas=[];s.pos.forEach((x,i)=>{if(x===2)pas.push(i);});\n    if(!pas.length){p.ctx.msg('Auf dem Floss ist niemand.','info');return;}\n    if(!pas.some(i=>'VMP'.includes(names[i]))){p.ctx.msg('Das Floss kann nur vom Vater, von der Mutter oder vom Polizisten gesteuert werden.','warn');return;}\n    const side=s.raft,here=[],other=[];\n    s.pos.forEach((x,i)=>{if(x===2)return;if(x===side)here.push(i);else other.push(i);});\n    const why=rvWhy(names,pas)||rvWhy(names,here)||rvWhy(names,other.concat(pas));\n    if(why){p.ctx.msg('Das geht nicht: '+why,'warn');return;}\n    const pos=s.pos.slice();for(const i of pas)pos[i]=1-side;\n    p.step({pas,next:{pos,raft:1-side}});\n  }\n  spec.draw=p=>{\n    const s=p.state,r=p.rv;\n    r.L.innerHTML='';r.R.innerHTML='';r.rppl.innerHTML='';\n    for(let i=0;i<n;i++){\n      if(s.pos[i]===2)r.rppl.appendChild(chip(p,i,'raft'));\n      else (s.pos[i]===0?r.L:r.R).appendChild(chip(p,i,'bank'));\n    }\n    r.raft.className='raft '+(s.raft===0?'atL':'atR');\n  };\n  spec.hintApply=(p,path)=>{\n    const mv=path[0],pos=p.state.pos.map(x=>x===2?p.state.raft:x);\n    for(const i of mv.pas)pos[i]=2;\n    p.state={pos,raft:p.state.raft};p.refresh();\n    return `Tipp: ${spec.describe(mv)} – diese Personen sind schon aufs Floss gestiegen. Jetzt «Floss fahren». Noch ${path.length} ${path.length===1?'Überfahrt':'Überfahrten'} bis zum Ziel.`;\n  };\n  return spec;\n}\n\n/* ----- Anmeldung beim Kern ----- */\nconst KN_TITLES={theseus:'Theseus und der Minotaurus',sixteen:'Sixteen-Puzzle',hasen:'Sechs Hasen',fluss:'Flussüberquerung in China'};\nconst KN_NAMES={theseus:'Theseus',sixteen:'Sixteen',hasen:'Sechs Hasen',fluss:'Fluss'};\nconst GAME={\n  title:'Knobeleien-Trainer',\n  id:'knobeleien', name:'Knobelei', icon:'🧩', units:['Zug','Züge'],\n  intro:'Vier Klassiker zum Tüfteln: Theseus und der Minotaurus, Sixteen-Puzzle, Sechs Hasen, Flussüberquerung.',\n  sizes:['theseus','sixteen','hasen','fluss'], size:'theseus', lvl:'sl',\n  sizeTitle:'Knobelei', newLabel:'Neue Knobelei',\n  sizeLabel:v=>KN_NAMES[v],\n  tag:(s,l)=>`${KN_NAMES[s]} · ${LEVEL_NAMES[l]}`,\n  tools:{notes:false,undo:true,auto:false,legend:false},\n  padHelp:'', missing:()=>'',\n  levels:{\n    sl:{desc:s=>({theseus:'Kleines Labyrinth (5×5), kurzer Weg.',sixteen:'Der Start liegt nur etwa 6 Züge vom Ziel entfernt.',hasen:'Je 2 Hasen pro Farbe (8 Züge).',fluss:'Nur Vater, Mutter, 1 Mädchen, Polizist und Dieb (7 Überfahrten).'})[s]},\n    l: {desc:s=>({theseus:'Labyrinth 6×6, der Minotaurus ist schon lästiger.',sixteen:'Start etwa 14 Züge vom Ziel entfernt.',hasen:'Je 3 Hasen pro Farbe – die Aufgabe der Vorlage (15 Züge).',fluss:'Dazu kommt ein Knabe (9 Überfahrten).'})[s]},\n    m: {desc:s=>({theseus:'Labyrinth 7×7. Oft musst du den Minotaurus erst in die falsche Richtung locken.',sixteen:'Start etwa 22 Züge vom Ziel entfernt.',hasen:'Je 4 Hasen pro Farbe (24 Züge).',fluss:'2 Mädchen und 1 Knabe (13 Überfahrten).'})[s]},\n    s: {desc:s=>({theseus:'Labyrinth 8×8 mit langer, trickreicher Lösung.',sixteen:'Die volle Aufgabe: Gold und Silber tauschen, höchstens 80 Züge (kürzeste Lösung: 31).',hasen:'Je 5 Hasen pro Farbe (35 Züge).',fluss:'Die volle Aufgabe: Vater, Mutter, 2 Mädchen, 2 Knaben, Polizist und Dieb (17 Überfahrten).'})[s]}\n  },\n  create(size,lvl){\n    let spec=null;\n    if(size==='theseus'){spec=mzCreate(lvl);if(spec)uiTheseus(spec);}\n    else if(size==='sixteen')spec=uiSixteen(sxSpec(SX_LEVELS[lvl]));\n    else if(size==='hasen')spec=uiHares(hrSpec(HR_LEVELS[lvl]));\n    else if(size==='fluss'){spec=uiRiver(rvSpec([...RV_LEVELS[lvl]]));spec.optimum=knSolve(spec.start,spec).length;}\n    if(!spec)return null;\n    if(size==='fluss')spec.optimum=spec.optimum||null;\n    return new StatePuzzle(this,size,lvl,spec);\n  },\n  rules(size){\n    const common='<li><b>Hilfen:<\/b> «↶ Zug zurück» (oder Taste Z) nimmt den letzten Zug zurück. «Tipp» führt den nächsten besten Zug aus. «Überprüfen» sagt dir, ob das Ziel noch erreichbar ist. «Lösung zeigen» spielt die kürzeste Lösung vor.<\/li>';\n    return ({\n      theseus:`\n        <li>Bringe <b>Theseus<\/b> (rote Kugel) zum <b>Ausgang A<\/b> (grünes Feld), ohne vom <b>Minotaurus<\/b> (schwarze Kugel) erwischt zu werden.<\/li>\n        <li>Theseus geht pro Zug <b>ein Feld<\/b> (nicht durch Wände) – oder macht eine <b>Pause<\/b>.<\/li>\n        <li>Danach geht der Minotaurus <b>zwei Felder<\/b> auf Theseus zu: Er versucht zuerst <b>waagrecht<\/b> näher zu kommen, geht das nicht, <b>senkrecht<\/b>, geht auch das nicht, bleibt er stehen.<\/li>\n        <li>Steht der Minotaurus auf Theseus’ Feld, ist das Spiel verloren (Zug zurück!).<\/li>\n        <li><b>Bedienung:<\/b> Pfeiltasten oder Pfeilknöpfe, Taste D = Pause, oder auf ein Nachbarfeld klicken.<\/li>\n        <li><i>Hinweis:<\/i> Die Labyrinthe sind eigene Aufgaben; das Programm erstellt sie zufällig und prüft, dass sie lösbar sind.<\/li>`+common,\n      sixteen:`\n        <li>Das Brett hat 17 Felder. Oben liegen 8 <b>goldene<\/b>, unten 8 <b>silberne<\/b> Steine, das mittlere Feld ist leer.<\/li>\n        <li>Ein Stein darf auf das <b>leere Feld rutschen<\/b> (ein Feld waagrecht oder senkrecht) oder <b>geradlinig über einen anderen Stein<\/b> (egal welche Farbe) in das leere Feld <b>springen<\/b>.<\/li>\n        <li><b>Ziel:<\/b> Gold und Silber haben die Plätze getauscht. Auf dem vollen Niveau sind höchstens <b>80 Züge<\/b> erlaubt.<\/li>\n        <li><i>Hinweis:<\/i> Mit diesen Regeln (nur waagrecht/senkrecht) liegt die kürzeste Lösung bei 31 Zügen; die berühmten 46 Züge von Dudeney gehören zur Originalvariante der Vorlage.<\/li>`+common,\n      hasen:`\n        <li>Sieben Plätze in einer Reihe, dazwischen eine <b>Lücke<\/b>. Links sitzen gelbe, rechts graue Hasen.<\/li>\n        <li>Gelbe Hasen hüpfen nach <b>rechts<\/b>, graue nach <b>links<\/b> – immer in die Lücke: um <b>ein Feld<\/b> oder <b>über einen Hasen<\/b> (egal welcher Farbe).<\/li>\n        <li><b>Ziel:<\/b> Die gelben Hasen sitzen rechts, die grauen links.<\/li>\n        <li><b>Tipp:<\/b> Mit weniger Hasen pro Farbe das Muster erkennen – dann wird es einfacher.<\/li>`+common,\n      fluss:`\n        <li>Alle Personen müssen mit dem <b>Floss<\/b> vom linken ans rechte Ufer.<\/li>\n        <li>Das Floss trägt <b>höchstens 2 Personen<\/b>. Steuern können nur <b>Vater, Mutter und Polizist<\/b>.<\/li>\n        <li>Der Vater darf nur <b>in Begleitung der Mutter<\/b> mit den <b>Mädchen<\/b> zusammen sein.<\/li>\n        <li>Die Mutter darf nur <b>in Begleitung des Vaters<\/b> mit den <b>Knaben<\/b> zusammen sein.<\/li>\n        <li>Der Dieb darf nur <b>in Begleitung des Polizisten<\/b> mit <b>Familienmitgliedern<\/b> zusammen sein.<\/li>\n        <li>Die Regeln gelten an beiden Ufern <b>und<\/b> auf dem Floss.<\/li>\n        <li><i>Annahme:<\/i> In der Vorlage ist die Zahl der Kinder nicht genannt; hier gibt es – wie in der bekannten Fassung – 2 Mädchen und 2 Knaben.<\/li>`+common\n    })[size];\n  }\n};\n\n/* =====================================================================\n   KERN – Oberfläche (gilt für jedes Rätsel)\n   Erwartet eine globale Konstante GAME (vom Rätsel-Modul definiert).\n   Kümmert sich um: Auswahl Grösse/Niveau, Zeit, Statistik, Prüfen, Tipp,\n   Neu beginnen, Lösung zeigen, Drucken, Gewonnen-Dialog, Tastatur,\n   Einbettung in die Plattform (?embed=1).\n   ===================================================================== */\nconst $=id=>document.getElementById(id);\nconst def=GAME;\nconst EMBED=/[?&]embed=1/.test(location.search)||window.name==='raetsel-embed';\nconst STORE_KEY='raetsel-trainer-v1-'+def.id;\nconst settings={size:def.size,lvl:def.lvl};\nlet solUsed=false,puz=null,noteMode=false,tips=0,checks=0,startT=0,timerId=null,genToken=0;\n\nfunction loadStore(){\n  try{\n    const o=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');\n    if(def.sizes.includes(o.size))settings.size=o.size;\n    if(def.levels[o.lvl])settings.lvl=o.lvl;\n  }catch(e){}\n}\nfunction saveStore(){try{localStorage.setItem(STORE_KEY,JSON.stringify(settings));}catch(e){}}\n\n/* Meldungen, Zeit, Statistik */\nfunction showMsg(t,type){const m=$('msg');m.textContent=t;m.className='msg show '+type;}\nfunction hideMsg(){$('msg').className='msg';}\nfunction elapsed(){return Math.floor((Date.now()-startT)/1000);}\nfunction fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}\nfunction startTimer(){stopTimer();startT=Date.now();$('stTime').textContent='00:00';timerId=setInterval(()=>$('stTime').textContent=fmt(elapsed()),1000);}\nfunction stopTimer(){if(timerId)clearInterval(timerId);timerId=null;}\n/* Deutlich sichtbare Kennzeichnung: Wurde die Lösung angezeigt, bleibt das für dieses Rätsel sichtbar\n   (auch nach «Neu beginnen» und nach dem Lösen) – ein Screenshot kann also nicht als eigene Lösung gelten. */\nfunction updateStatus(){\n  const st=$('stStatus'),won=puz&&puz.done&&!solUsed&&puz.solved();\n  st.className=solUsed?'bad':won?'good':'';\n  st.textContent=solUsed?'⚠ Lösung angezeigt':won?'✔ selbst gelöst':'in Arbeit';\n  $('solBanner').style.display=solUsed?'block':'none';\n  $('stage').classList.toggle('sol',solUsed);\n}\nfunction updateStats(){$('stTips').textContent=tips;$('stChecks').textContent=checks;}\n\nconst ctx={\n  autoCheck:()=>$('autoCheck').checked,\n  noteMode:()=>noteMode,\n  hideMsg,\n  changed:()=>{if(puz&&!puz.done&&puz.solved())win();},\n  msg:showMsg\n};\n/* Beschriftungen – Rätsel dürfen sie überschreiben (def.sizeLabel, def.tag, def.newLabel …) */\nconst sizeLabel=v=>def.sizeLabel?def.sizeLabel(v):`${v} × ${v}`;\nconst tagOf=(s,l)=>def.tag?def.tag(s,l):`${LEVEL_NAMES[l]} (${s}×${s})`;\n\n/* Auswahl-Leisten */\nfunction makeSeg(el,items,current,onPick){\n  el.innerHTML='';\n  for(const it of items){\n    const b=document.createElement('button');\n    b.textContent=it.label;b.dataset.v=it.v;\n    b.classList.toggle('on',String(it.v)===String(current));\n    b.addEventListener('click',()=>onPick(it.v));\n    el.appendChild(b);\n  }\n}\nfunction buildOptions(){\n  makeSeg($('sizeSeg'),def.sizes.map(n=>({v:n,label:sizeLabel(n)})),settings.size,v=>{settings.size=v;buildOptions();saveStore();updateSetupSel();});\n  makeSeg($('lvlSeg'),Object.keys(def.levels).map(k=>({v:k,label:LEVEL_NAMES[k]})),settings.lvl,v=>{settings.lvl=v;buildOptions();saveStore();updateSetupSel();});\n  const d=def.levels[settings.lvl].desc;\n  $('lvlDesc').textContent=typeof d==='function'?d(settings.size):d;\n  $('sizeSeg').style.display=def.sizes.length>1?'':'none';\n  $('sizeLbl').style.display=def.sizes.length>1?'':'none';\n}\n\n\n/* Schritt 1: Rahmenbedingungen wählen – Schritt 2: Rätsel erstellen */\nconst TOOL_IDS=['btnCheck','btnNotes','btnHint','btnReset','btnSolve','btnPrint','btnSubmit'];\nfunction toolsDisabled(on){for(const id of TOOL_IDS){const e=$(id);if(e)e.disabled=on;}if($('autoCheck'))$('autoCheck').disabled=on;}\nfunction showSetup(){\n  ++genToken;stopTimer();puz=null;tips=0;checks=0;solUsed=false;\n  const stage=$('stage');stage.classList.remove('loading','sol');\n  stage.innerHTML=`<div class=\"setup-ph\"><div class=\"big\">${def.icon||'🧩'}<\/div><h3>Neues ${def.name} einrichten<\/h3><p>Wähle Grösse und Niveau und erstelle dann das Rätsel.<\/p><p class=\"chosen\" id=\"setupSel\"><\/p><button class=\"btn primary\" id=\"btnSetupGo\">Rätsel erstellen<\/button><\/div>`;\n  $('btnSetupGo').addEventListener('click',startGame);\n  const pad=$('pad');pad.innerHTML='';pad.removeAttribute('style');\n  toolsDisabled(true);hideMsg();\n  $('stLevel').textContent='–';$('stTime').textContent='00:00';$('stStatus').textContent='noch kein Rätsel';$('stStatus').className='';\n  if($('stTips'))$('stTips').textContent='–';\n  if($('solBanner'))$('solBanner').style.display='none';\n  updateSetupSel();\n}\nfunction updateSetupSel(){const e=$('setupSel');if(e)e.textContent=(def.sizes.length>1?sizeLabel(settings.size)+' · ':'')+LEVEL_NAMES[settings.lvl];}\nfunction startGame(){\n  if(puz&&!puz.done&&!puz.locked&&!solUsed&&!confirm('Das laufende Rätsel wird verworfen. Wirklich ein neues Rätsel erstellen?'))return;\n  newGame();\n}\n\n/* Neues Rätsel */\nfunction newGame(){\n  const token=++genToken, stage=$('stage');\n  stopTimer();\n  stage.classList.add('loading');\n  showMsg(`${def.name} wird erstellt …`,'info');\n  setTimeout(()=>{\n    if(token!==genToken)return;\n    let p=null;\n    try{p=def.create(settings.size,settings.lvl);}catch(err){console.error(err);}\n    stage.classList.remove('loading');\n    if(!p){showMsg('Das Rätsel konnte nicht erstellt werden. Bitte nochmals versuchen.','warn');if(!puz)showSetup();return;}\n    puz=p;tips=0;checks=0;solUsed=false;\n    toolsDisabled(false);\n    puz.mount(ctx,stage,$('pad'));\n    if($('autoCheck').checked)puz.applyAutoCheck(true);\n    $('stLevel').textContent=tagOf(settings.size,settings.lvl);\n    $('phTitle').textContent=`${def.name} · ${tagOf(settings.size,settings.lvl)}`;\n    $('rules').innerHTML=def.rules(settings.size);\n    updateStats();updateStatus();startTimer();hideMsg();\n  },30);\n}\n\n/* Werkzeuge */\nfunction check(){\n  if(!puz||puz.done)return;\n  if(puz.customCheck){checks++;updateStats();const r=puz.customCheck();showMsg(r.text,r.type);return;}\n  checks++;\n  const {wrong,empty,right}=puz.check();\n  updateStats();\n  if(puz.solved()){win();return;}\n  const [one,many]=def.units;\n  if(wrong===0){\n    showMsg(right===0?`Noch nichts eingetragen. ${def.missing(empty)}`\n      :`Super! ${right===1?'Die eingetragene '+one+' ist':'Alle '+right+' eingetragenen '+many+' sind'} richtig. ${def.missing(empty)}`,'good');\n  } else {\n    showMsg(`${wrong} ${wrong===1?one+' ist':many+' sind'} falsch (rot). ${right} richtig. ${def.missing(empty)} Korrigiere die roten Felder.`,'warn');\n  }\n}\nfunction hint(){\n  if(!puz||puz.done)return;\n  const t=puz.hint();\n  if(t===null)return;\n  tips++;updateStats();showMsg(t,'info');\n  ctx.changed();\n}\nfunction resetGame(){\n  if(!puz||!confirm('Alle eigenen Eingaben löschen und neu beginnen?'))return;\n  puz.reset();tips=0;checks=0;startTimer();hideMsg();updateStats();\n}\nfunction showSolution(){\n  if(!puz)return;\n  if(!confirm(`Wirklich die ganze Lösung anzeigen? Das ${def.name}-Rätsel gilt dann als nicht gelöst.`))return;\n  solUsed=true;puz.reveal();stopTimer();updateStatus();\n  showMsg('Lösung angezeigt: grün = du hattest es richtig, rot = war falsch, gelb = war leer.','info');\n}\nfunction win(){\n  puz.finish();stopTimer();\n  $('winText').innerHTML=`${def.name} · Niveau: <b>${tagOf(settings.size,settings.lvl)}<\/b><br>Zeit: <b>${fmt(elapsed())}<\/b><br>${puz.winInfo?puz.winInfo()+'<br>':''}Tipps: <b>${tips}<\/b> · Prüfungen: <b>${checks}<\/b>`;\n  if(solUsed){$('winTitle').textContent='⚠ Gelöst – aber mit Lösung';$('winText').innerHTML+='<br><b style=\"color:var(--bad)\">Die Lösung wurde angezeigt – das zählt nicht als selbst gelöst.<\/b>';}\n  else $('winTitle').textContent='🎉 Geschafft!';\n  updateStatus();\n  $('overlay').classList.add('show');\n  showMsg(solUsed?'Gelöst – aber die Lösung wurde vorher angezeigt.':`Gelöst in ${fmt(elapsed())} mit ${tips} Tipps.`,solUsed?'warn':'good');\n}\nfunction toggleNotes(){\n  if(def.tools.undo){if(puz)puz.undo();return;}\n  if(!def.tools.notes)return;\n  noteMode=!noteMode;\n  $('btnNotes').textContent=(def.tools.notesLabel||'✎ Notizen')+': '+(noteMode?'ein':'aus');\n  $('btnNotes').classList.toggle('on',noteMode);\n}\n\n/* Ereignisse */\n$('btnNew').addEventListener('click',startGame);\n$('btnCheck').addEventListener('click',check);\n$('btnHint').addEventListener('click',hint);\n$('btnReset').addEventListener('click',resetGame);\n$('btnSolve').addEventListener('click',showSolution);\n$('btnPrint').addEventListener('click',()=>{if(puz){puz.clearSelection();}window.print();});\n$('btnNotes').addEventListener('click',toggleNotes);\n$('btnWinNew').addEventListener('click',()=>{$('overlay').classList.remove('show');showSetup();});\n$('btnWinClose').addEventListener('click',()=>$('overlay').classList.remove('show'));\n$('autoCheck').addEventListener('change',()=>{if(puz)puz.applyAutoCheck($('autoCheck').checked);});\n\ndocument.addEventListener('keydown',e=>{\n  if($('overlay').classList.contains('show')||!puz)return;\n  if(e.ctrlKey||e.metaKey||e.altKey)return;\n  const t=e.target;\n  if(e.key===' '&&t&&t.closest&&t.closest('button,input,summary,select,textarea'))return;   // Leertaste bedient dann das Bedienelement\n  if((e.key==='n'||e.key==='N')&&def.tools.notes&&!def.tools.undo){toggleNotes();return;}\n  if((e.key==='z'||e.key==='Z'||e.key==='Backspace')&&def.tools.undo&&puz.undo){puz.undo();e.preventDefault();return;}\n  if(puz.keydown(e))e.preventDefault();\n});\n\n/* Einbettung: Höhe an die Plattform melden */\nfunction setupEmbed(){\n  document.body.classList.add('embed');\n  if(window.parent===window)return;\n  const send=()=>window.parent.postMessage({type:'raetsel-height',id:def.id,h:Math.ceil(document.body.getBoundingClientRect().height)},'*');\n  if(window.ResizeObserver)new ResizeObserver(send).observe(document.body);\n  window.addEventListener('load',send);\n  send();\n}\n\n/* Start */\n(function init(){\n  loadStore();\n  $('gameTitle').textContent=def.title;\n  $('sub').textContent=def.intro;\n  $('newTitle').textContent=def.newLabel||'Neues '+def.name;\n  $('btnNew').textContent=def.newLabel?def.newLabel+' starten':'Neues '+def.name+' erstellen';\n  $('sizeLbl').textContent=def.sizeTitle||'Grösse';\n  if(def.tools.undo)$('btnNotes').textContent='↶ Zug zurück';\n  else if(def.tools.notesLabel)$('btnNotes').textContent=def.tools.notesLabel+': aus';\n  if(def.tools.auto===false)$('autoCheck').parentElement.style.display='none';\n  if(def.tools.legend===false)document.querySelector('.legend').style.display='none';\n  $('rulesTitle').textContent='So geht '+def.name;\n  $('btnNotes').style.display=(def.tools.notes||def.tools.undo)?'':'none';\n  $('btnHint').classList.toggle('full',!(def.tools.notes||def.tools.undo));\n  document.title=def.title+' – Rätsel-Trainer';\n  if(EMBED)setupEmbed();\n  buildOptions();\n  showSetup();\n})();\n\n<\/script>\n<\/body>\n<\/html>\n"
 }
];

const $=id=>document.getElementById(id);
const frame=$('frame');
let current=null;

function buildTabs(){
  const nav=$('tabs');nav.innerHTML='';
  for(const g of GAMES){
    const b=document.createElement('button');
    b.setAttribute('role','tab');b.dataset.id=g.id;
    b.innerHTML=`<span class="ic" aria-hidden="true">${g.icon}</span><span>${g.name}</span>`;
    b.addEventListener('click',()=>select(g.id));
    nav.appendChild(b);
  }
}
function select(id){
  const g=GAMES.find(x=>x.id===id)||GAMES[0];
  if(current===g.id)return;
  current=g.id;
  document.querySelectorAll('#tabs button').forEach(b=>{const on=b.dataset.id===g.id;b.classList.toggle('on',on);b.setAttribute('aria-selected',on);});
  $('sub').textContent=g.intro;
  document.title=g.name+' – Rätsel-Trainer';
  frame.title=g.name;
  frame.srcdoc=g.html;
  try{history.replaceState(null,'','#'+g.id);}catch(e){}
}
/* Das Logo ist nur einmal in der Plattform gespeichert und wird in die eingebettete Seite kopiert (für den Druck). */
frame.addEventListener('load',()=>{
  try{const l=frame.contentDocument.querySelector('.logo');if(l)l.src=document.querySelector('.logo').src;}catch(e){}
});
/* Die eingebettete Seite meldet ihre Höhe, damit kein innerer Scrollbalken entsteht. */
window.addEventListener('message',e=>{
  if(e.source!==frame.contentWindow||!e.data||e.data.type!=='raetsel-height')return;
  frame.style.height=Math.max(300,e.data.h)+'px';
});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(GAMES.some(g=>g.id===id))select(id);});

buildTabs();
const start=location.hash.slice(1);
select(GAMES.some(g=>g.id===start)?start:GAMES[0].id);
</script>
</body>
</html>
