ight:2.4em;margin:0 0 10px}\n.btn{border:none;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer;background:#e5e7eb;color:var(--ink)}\n.btn:hover{filter:brightness(.95)}\n.btn.primary{background:var(--accent);color:var(--ink);font-weight:bold}\n.btn.primary:hover{background:#9db92d}\n.btn.on{background:var(--accent-dark);color:#fff}\n.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.btns .full{grid-column:1/-1}\n.stats{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}\n.stats b{font-variant-numeric:tabular-nums}\nbutton:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}\n\n/* Spielfeld (gemeinsam) */\n.board{\n  width:min(100%,520px); aspect-ratio:1/1; margin:0 auto;\n  display:grid; grid-template-columns:repeat(var(--cols,var(--n)),1fr); grid-template-rows:repeat(var(--cols,var(--n)),1fr);\n  border:3px solid var(--thick); background:#fff; user-select:none; touch-action:manipulation;\n}\n.cell{\n  display:flex;align-items:center;justify-content:center;position:relative;\n  border-right:1px solid var(--line);border-bottom:1px solid var(--line);\n  font-size:calc(min(100vw - 40px,520px) / var(--n) * .55);\n  cursor:pointer;color:var(--user);\n}\n.cell.tr{border-right:3px solid var(--thick)}\n.cell.tb{border-bottom:3px solid var(--thick)}\n.cell.lastc{border-right:none}\n.cell.lastr{border-bottom:none}\n.cell.water{background:var(--water)}\n.cell.peer{background:var(--peer)}\n.cell.same{background:var(--same)}\n.cell.sel{background:var(--sel)}\n.cell.given{color:var(--given);font-weight:bold}\n.cell.hint{color:var(--hint);background:var(--hintbg)}\n.cell.ok{color:var(--ok);background:var(--okbg)}\n.cell.bad{color:var(--bad);background:var(--badbg)}\n.cell.sel.ok,.cell.sel.bad,.cell.sel.hint{outline:3px solid var(--accent);outline-offset:-3px}\n.cell.water.ok,.cell.water.bad,.cell.water.hint{outline:0}\n.notes{position:absolute;inset:2px;display:grid;font-size:calc(min(100vw - 40px,520px) / var(--n) * .22);color:#64748b;line-height:1;font-weight:normal}\n.notes span{display:flex;align-items:center;justify-content:center}\n\n/* Eingabe */\n.pad{display:grid;gap:6px;margin:12px auto 0;width:min(100%,520px)}\n.pad button{font:inherit;font-size:1.4rem;padding:10px 0;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}\n.pad button.del{font-size:1rem}\n.pad button.done{opacity:.35}\n.padhelp{margin:12px auto 0;width:min(100%,520px);font-size:.95rem;color:var(--muted);text-align:center}\n.msg{margin:12px auto 0;width:min(100%,520px);padding:10px 12px;border-radius:8px;display:none;font-size:1rem}\n.msg.show{display:block}\n.msg.info{background:#e0f2fe;color:#075985}\n.msg.good{background:var(--okbg);color:#14532d}\n.msg.warn{background:var(--badbg);color:#7f1d1d}\n.toggle{display:flex;gap:8px;align-items:center;font-size:.95rem;margin-top:6px;cursor:pointer}\ndetails summary{cursor:pointer;font-weight:bold}\ndetails ul{padding-left:18px;margin:8px 0 0}\ndetails li{margin-bottom:4px}\n.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:.85rem;margin-top:8px}\n.legend span{padding:2px 6px;border-radius:5px}\n.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}\n.overlay.show{display:flex}\n.dialog{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%;text-align:center}\n.dialog h3{margin:0 0 8px;font-size:1.5rem}\n.dialog p{margin:6px 0}\n.loading{opacity:.4;pointer-events:none}\n.printhead{display:none}\n.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}\n.pad button:disabled{opacity:.35;cursor:not-allowed}\n.toggle.off{opacity:.5;cursor:not-allowed}\n\n@media (max-width:520px){\n  .logo{height:46px}\n  .titlebox h1{font-size:1.4rem}\n}\n@media print{\n  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  body{background:#fff}\n  .right,.pad,.padhelp,.msg,.sub,.titlebox,.stats,.overlay{display:none!important}\n  .top{margin:0 0 8px}\n  .logo{height:1.3cm}\n  .printhead{display:block;margin-bottom:12px;font-size:1.2rem}\n  .board{width:16cm}\n  .cell{font-size:calc(16cm / var(--n) * .55)}\n  .cell.peer,.cell.same,.cell.sel{background:#fff}\n}\n\n/* Eingebettet in die Plattform: Kopf wird von der Plattform gezeigt */\nbody.embed .top{display:none}\nbody.embed .wrap{padding-top:0}\n@media print{body.embed .top{display:flex}}\n\n/* Kennzeichnung «Lösung angezeigt» */\n#stStatus.bad{color:var(--bad)}\n#stStatus.good{color:var(--ok)}\n.solbanner{display:none;background:#b91c1c;color:#fff;font-weight:bold;text-align:center;padding:8px 10px;border-radius:8px;margin-bottom:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n#stage{position:relative}\n#stage.sol{outline:4px solid #b91c1c;outline-offset:2px}\n#stage.sol::after{content:\"\";position:absolute;inset:0;pointer-events:none;z-index:5;background:url(\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='170'><text x='130' y='90' text-anchor='middle' font-family='Arial' font-size='22' font-weight='bold' fill='%23b91c1c' fill-opacity='.38' transform='rotate(-25 130 85)'>LÖSUNG ANGEZEIGT<\/text><\/svg>\") repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n\n/* Nonogramm */\n#stage{overflow-x:auto}\n.ng{width:min(100%,560px);min-width:calc(var(--N)*17px + 80px);margin:0 auto;display:grid;grid-template-columns:max-content 1fr;--fs:max(9px,calc(min(100vw - 90px,540px) / var(--N) * .5))}\n.ng .board{width:100%}\n.ngcols{display:grid;grid-template-columns:repeat(var(--N),1fr)}\n.ngcols div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:var(--fs);line-height:1.2;padding-bottom:3px;font-variant-numeric:tabular-nums}\n.ngrows{display:grid;grid-template-rows:repeat(var(--N),1fr)}\n.ngrows div{display:flex;align-items:center;justify-content:flex-end;gap:.35em;padding-right:6px;font-size:var(--fs);font-variant-numeric:tabular-nums}\n.ngcols div.done,.ngrows div.done{color:#b7c2c7}\n.ngcols span,.ngrows span{font-weight:bold}\n.g-nonogramm .cell{cursor:pointer;touch-action:none}\n.g-nonogramm .cell.f{background:#8aa51f}\n.g-nonogramm .cell.f.given{background:#231f20}\n.g-nonogramm .cell.f.ok{background:#16a34a}\n.g-nonogramm .cell.f.bad{background:#dc2626}\n.g-nonogramm .cell.f.hint{background:#f59e0b}\n.g-nonogramm .cell.f.sel{outline:3px solid #f59e0b;outline-offset:-3px}\n.g-nonogramm .cell.x::after{content:\"✕\";color:#94a3b8;font-size:.62em}\n.g-nonogramm .cell.x.given::after{color:#231f20;font-weight:bold}\n.g-nonogramm .cell.x.bad{background:var(--badbg)}\n.g-nonogramm .cell.x.bad::after{color:var(--bad)}\n.g-nonogramm .cell.x.hint{background:var(--hintbg)}\n@media print{.ng{width:16cm;min-width:0}.ngcols div,.ngrows div{font-size:calc(16cm / var(--N) * .5)}}\n.g-nonogramm.solved .cell{border-color:transparent}\n.g-nonogramm.solved .cell.f{background:#2f3a0a}\n.g-nonogramm.solved .cell.x::after{display:none}\n.g-nonogramm.solved{border-color:#2f3a0a}\n\n\n.setup-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:260px;padding:28px 18px;text-align:center;border:2px dashed var(--line,#cbd5e1);border-radius:16px;background:#f8fafc;color:#334155}\n.setup-ph .big{font-size:40px;line-height:1}\n.setup-ph h3{margin:0;font-size:1.15rem}\n.setup-ph p{margin:0;max-width:34ch;font-size:.95rem}\n.setup-ph .chosen{font-weight:700;color:#0f172a}\n.setup-ph .btn{margin-top:6px;min-width:220px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <img class=\"logo\" src=\"data:image/png;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==\" alt=\"Logo\">\n    <div class=\"titlebox\">\n      <h1 id=\"gameTitle\">Rätsel-Trainer<\/h1>\n      <p class=\"sub\" id=\"sub\"><\/p>\n    <\/div>\n  <\/header>\n\n    <div class=\"layout\">\n    <div class=\"left\">\n      <div class=\"printhead\"><span id=\"phTitle\"><\/span> &nbsp;&nbsp; Name: ______________________<\/div>\n      <div class=\"stats\">\n        <span>Niveau: <b id=\"stLevel\">–<\/b><\/span>\n        <span>Zeit: <b id=\"stTime\">00:00<\/b><\/span>\n        <span>Tipps: <b id=\"stTips\">0<\/b><\/span>\n        <span style=\"display:none\">Prüfungen: <b id=\"stChecks\">0<\/b><\/span>\n        <span>Status: <b id=\"stStatus\">in Arbeit<\/b><\/span>\n      <\/div>\n      <div id=\"solBanner\" class=\"solbanner\" role=\"alert\">⚠ LÖSUNG ANGEZEIGT – dieses Rätsel zählt nicht als selbst gelöst<\/div>\n      <div id=\"stage\"><\/div>\n      <div id=\"pad\"><\/div>\n      <div class=\"msg\" id=\"msg\" role=\"status\" aria-live=\"polite\"><\/div>\n    <\/div>\n\n    <div class=\"right\">\n      <div class=\"card\">\n        <h2 id=\"newTitle\">Neues Rätsel<\/h2>\n        <label class=\"small\" id=\"sizeLbl\">Grösse<\/label>\n        <div class=\"seg\" id=\"sizeSeg\"><\/div>\n        <label class=\"small\">Niveau<\/label>\n        <div class=\"seg\" id=\"lvlSeg\"><\/div>\n        <p class=\"lvldesc\" id=\"lvlDesc\"><\/p>\n        <button class=\"btn primary\" style=\"width:100%\" id=\"btnNew\">Neues Rätsel erstellen<\/button>\n      <\/div>\n\n      <div class=\"card\">\n        <h2>Werkzeuge<\/h2>\n        <div class=\"btns\">\n          <button class=\"btn primary full\" id=\"btnSubmit\" disabled title=\"Erst alle Felder ausfüllen\">📥 Abgeben<\/button>\n          <button class=\"btn full\" id=\"btnCheck\" style=\"display:none\">✔ Überprüfen<\/button>\n          <button class=\"btn\" id=\"btnNotes\">✎ Notizen: aus<\/button>\n          <button class=\"btn\" id=\"btnHint\">💡 Tipp<\/button>\n          <button class=\"btn\" id=\"btnReset\">↺ Neu beginnen<\/button>\n          <button class=\"btn\" id=\"btnSolve\">Lösung zeigen<\/button>\n          <button class=\"btn full\" id=\"btnPrint\">🖨 Drucken<\/button>\n        <\/div>\n        <label class=\"toggle\" style=\"display:none\"><input type=\"checkbox\" id=\"autoCheck\"> Fehler sofort rot anzeigen<\/label>\n        <div class=\"legend\">\n          <span style=\"background:var(--okbg);color:var(--ok)\">richtig<\/span>\n          <span style=\"background:var(--badbg);color:var(--bad)\">falsch<\/span>\n          <span style=\"background:var(--hintbg);color:var(--hint)\">Tipp<\/span>\n          <span style=\"font-weight:bold\">vorgegeben<\/span>\n        <\/div>\n      <\/div>\n\n      <div class=\"card\">\n        <details>\n          <summary id=\"rulesTitle\">So geht's<\/summary>\n          <ul id=\"rules\"><\/ul>\n        <\/details>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <div class=\"dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"winTitle\">\n    <h3 id=\"winTitle\">🎉 Geschafft!<\/h3>\n    <p id=\"winText\"><\/p>\n    <p id=\"winTip\" style=\"font-size:.9rem;color:var(--muted)\">Tipp: Mach einen Screenshot für dein Lernjournal.<\/p>\n    <button class=\"btn primary\" id=\"btnWinNew\" style=\"margin-top:10px\">Nächstes Rätsel<\/button>\n    <button class=\"btn\" id=\"btnWinClose\" style=\"margin-top:10px\">Schliessen<\/button>\n  <\/div>\n<\/div>\n\n<script>\n'use strict';\n/* =====================================================================\n   KERN – gemeinsam für alle Rätsel (wird in jede Rätsel-Datei eingebaut)\n   Enthält: Hilfsfunktionen und die Basisklasse GridPuzzle.\n   Ein Rätsel erbt von GridPuzzle und meldet sich mit  const GAME = {...}  an.\n   ===================================================================== */\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction randOf(a){return a[Math.floor(Math.random()*a.length)];}\nconst LEVEL_NAMES={sl:'Sehr leicht',l:'Leicht',m:'Mittel',s:'Schwer',ss:'Sehr schwer',us:'Ultraschwer'};\n\nclass GridPuzzle{\n  constructor(def,size,lvlKey,data){\n    this.def=def; this.n=size; this.lvlKey=lvlKey;\n    this.sol=data.sol; this.cur=data.puz.slice();\n    this.given=data.puz.map(v=>v>0);\n    this.hinted=new Array(size*size).fill(false);\n    this.mark=new Array(size*size).fill(0);          // 0 nichts, 1 richtig, 2 falsch\n    this.sel=-1; this.done=false; this.locked=false; this.cells=[]; this.ctx=null;\n  }\n\n  /* --- Hooks, die Unterklassen überschreiben --- */\n  baseClass(i){return 'cell';}\n  extraClass(i){return i===this.sel?' sel':'';}\n  paint(i,d){}                                       // Zelleninhalt zeichnen\n  onCell(i){this.sel=i;this.refresh();}\n  handleKey(e){return false;}\n  buildPad(pad){pad.className='padhelp';pad.textContent=this.def.padHelp||'';}\n  afterSet(i,v){}\n  afterReset(){}\n  afterRefresh(){}\n  cellState(i){const v=this.cur[i];if(!v)return 'empty';return v===this.sol[i]?'right':'wrong';}\n  solved(){return this.cur.every((v,k)=>v===this.sol[k]);}\n  pickHint(){\n    const open=[];\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]&&this.cur[i]!==this.sol[i])open.push(i);\n    if(!open.length)return null;\n    const i=(this.sel>=0&&open.includes(this.sel))?this.sel:randOf(open);\n    return {i,text:'Ein Feld wurde mit einem Tipp ausgefüllt (gelb).'};\n  }\n  revealEmpty(i){this.hinted[i]=true;}\n\n  /* --- gemeinsame Abläufe --- */\n  buildBoard(){\n    const b=document.createElement('div');\n    b.className='board g-'+this.def.id;\n    b.style.setProperty('--n',this.n);\n    b.setAttribute('aria-label',this.def.name+'-Feld');\n    this.cells=[];\n    for(let i=0;i<this.n*this.n;i++){\n      const d=document.createElement('div');\n      d.addEventListener('click',()=>this.onCell(i));\n      b.appendChild(d);this.cells.push(d);\n    }\n    return b;\n  }\n  mount(ctx,stage,pad){\n    this.ctx=ctx;\n    stage.innerHTML='';\n    stage.appendChild(this.buildBoard());\n    pad.className='';pad.removeAttribute('style');pad.innerHTML='';\n    this.buildPad(pad);\n    this.refresh();\n  }\n  refresh(){\n    for(let i=0;i<this.cur.length;i++){\n      const d=this.cells[i];\n      let cls=this.baseClass(i);\n      if(this.given[i])cls+=' given';\n      if(this.hinted[i])cls+=' hint';\n      if(this.mark[i]===1)cls+=' ok';\n      if(this.mark[i]===2)cls+=' bad';\n      cls+=this.extraClass(i);\n      d.className=cls;\n      this.paint(i,d);\n    }\n    this.afterRefresh();\n  }\n  commit(){this.ctx.hideMsg();this.refresh();this.ctx.changed();}\n  setCell(i,v){\n    this.cur[i]=v;this.hinted[i]=false;this.mark[i]=0;\n    if(v&&this.ctx.autoCheck()&&v!==this.sol[i])this.mark[i]=2;\n    this.afterSet(i,v);\n  }\n  editable(){return !this.done&&!this.locked&&this.sel>=0&&!this.given[this.sel];}\n  keydown(e){\n    if(this.handleKey(e))return true;\n    const k=e.key,N=this.n;\n    if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))return false;\n    if(this.sel<0)this.sel=0;\n    else{\n      const r=Math.floor(this.sel/N),c=this.sel%N;\n      if(k==='ArrowLeft'&&c>0)this.sel--;\n      if(k==='ArrowRight'&&c<N-1)this.sel++;\n      if(k==='ArrowUp'&&r>0)this.sel-=N;\n      if(k==='ArrowDown'&&r<N-1)this.sel+=N;\n    }\n    this.refresh();return true;\n  }\n  check(){\n    let wrong=0,empty=0,right=0;\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i]||this.hinted[i])continue;\n      const s=this.cellState(i);\n      if(s==='empty'){empty++;this.mark[i]=0;}\n      else if(s==='skip')this.mark[i]=0;\n      else if(s==='right'){this.mark[i]=1;right++;}\n      else{this.mark[i]=2;wrong++;}\n    }\n    this.refresh();\n    return {wrong,empty,right};\n  }\n  hint(){\n    const p=this.pickHint();\n    if(!p)return null;\n    this.cur[p.i]=this.sol[p.i];this.hinted[p.i]=true;this.mark[p.i]=0;\n    this.afterSet(p.i,this.sol[p.i]);\n    this.sel=p.i;this.refresh();\n    return p.text;\n  }\n  reset(){\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]){this.cur[i]=0;this.hinted[i]=false;}\n    this.mark.fill(0);this.sel=-1;this.done=false;\n    this.afterReset();this.refresh();\n  }\n  reveal(){\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i])continue;\n      if(this.cur[i]&&this.cur[i]!==this.sol[i])this.mark[i]=2;\n      else if(this.cur[i]===this.sol[i])this.mark[i]=1;\n      else this.revealEmpty(i);\n      this.cur[i]=this.sol[i];\n    }\n    this.afterReset();   // Notizen o. Ä. löschen\n    this.done=true;this.refresh();\n  }\n  finish(){\n    this.done=true;\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]&&!this.hinted[i])this.mark[i]=1;\n    this.refresh();\n  }\n  applyAutoCheck(on){\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i]||this.hinted[i])continue;\n      if(!on&&this.mark[i]===2)this.mark[i]=0;\n      if(on&&this.cur[i]&&this.cur[i]!==this.sol[i])this.mark[i]=2;\n    }\n    this.refresh();\n  }\n  clearSelection(){this.sel=-1;this.refresh();}\n  /* Alle Felder ausgefüllt? (Rätsel mit Wasser/Kreuzen überschreiben das.) */\n  complete(){return this.cur.every(v=>v>0);}\n  /* Vollständig, aber falsch: Fehler rot zeigen und das Rätsel sperren – es gibt kein Korrigieren mehr. */\n  lock(){\n    this.locked=true;this.drag=null;\n    this.check();                                         // markiert die falschen Felder rot\n    for(let i=0;i<this.mark.length;i++)if(this.mark[i]===1)this.mark[i]=0;\n    this.sel=-1;this.refresh();\n  }\n}\n\n\n/* =====================================================================\n   RÄTSEL-MODUL: Nonogramm (Bilderrätsel / Griddler)\n   0 = leer, 1 = gefüllt, 2 = Kreuz (sicher leer)\n   Die Zahlen am Rand geben die Längen der zusammenhängenden schwarzen Blöcke an.\n   Jedes Rätsel ist ohne Raten lösbar: Ein Zeilen-Löser (dynamische Programmierung) prüft das,\n   und nötigenfalls werden einzelne Felder vorgegeben.\n   ===================================================================== */\n/* ===== LOGIK-START ===== */\nconst NG_FILL=1, NG_CROSS=2;\nfunction ngClue(line){\n  const c=[];let n=0;\n  for(const v of line){if(v===NG_FILL)n++;else if(n){c.push(n);n=0;}}\n  if(n)c.push(n);\n  return c.length?c:[0];\n}\n/* Eine Zeile lösen: gibt die Zeile mit allen sicheren Folgerungen zurück, null bei Widerspruch. */\nfunction ngLine(clue,line){\n  const N=line.length,blocks=(clue.length===1&&clue[0]===0)?[]:clue,k=blocks.length;\n  const L=line.concat([NG_CROSS]);                 // virtuelles leeres Feld am Ende\n  const f=Array.from({length:N+2},()=>new Uint8Array(k+1)),g=Array.from({length:N+2},()=>new Uint8Array(k+1));\n  const fits=(i,len)=>{\n    if(i+len>N||L[i+len]===NG_FILL)return false;\n    for(let t=i;t<i+len;t++)if(L[t]===NG_CROSS)return false;\n    return true;\n  };\n  f[0][0]=1;\n  for(let i=0;i<=N;i++)for(let j=0;j<=k;j++){\n    if(!f[i][j])continue;\n    if(L[i]!==NG_FILL)f[i+1][j]=1;\n    if(j<k&&fits(i,blocks[j]))f[i+blocks[j]+1][j+1]=1;\n  }\n  if(!f[N+1][k])return null;\n  g[N+1][k]=1;\n  for(let i=N;i>=0;i--)for(let j=0;j<=k;j++){\n    let ok=L[i]!==NG_FILL&&g[i+1][j];\n    if(!ok&&j<k&&fits(i,blocks[j])&&g[i+blocks[j]+1][j+1])ok=1;\n    g[i][j]=ok?1:0;\n  }\n  const canF=new Uint8Array(N),canE=new Uint8Array(N);\n  for(let i=0;i<=N;i++)for(let j=0;j<=k;j++){\n    if(!f[i][j])continue;\n    if(i<N&&L[i]!==NG_FILL&&g[i+1][j])canE[i]=1;\n    if(j<k&&fits(i,blocks[j])&&g[i+blocks[j]+1][j+1]){\n      for(let t=i;t<i+blocks[j];t++)canF[t]=1;\n      if(i+blocks[j]<N)canE[i+blocks[j]]=1;\n    }\n  }\n  const out=line.slice();\n  for(let c=0;c<N;c++){\n    if(!canF[c]&&!canE[c])return null;\n    if(canF[c]&&!canE[c])out[c]=NG_FILL;\n    else if(canE[c]&&!canF[c])out[c]=NG_CROSS;\n  }\n  return out;\n}\n/* Ganzes Rätsel mit Zeilen-/Spaltenlogik lösen. g wird verändert. true = Widerspruchsfrei. */\nfunction ngSolve(N,rc,cc,g){\n  let changed=true,passes=0;\n  while(changed){\n    changed=false;passes++;\n    for(let a=0;a<2*N;a++){\n      const row=a<N,x=row?a:a-N,idx=[];\n      for(let b=0;b<N;b++)idx.push(row?x*N+b:b*N+x);\n      const line=idx.map(i=>g[i]),res=ngLine(row?rc[x]:cc[x],line);\n      if(!res)return false;\n      for(let b=0;b<N;b++)if(res[b]!==line[b]){g[idx[b]]=res[b];changed=true;}\n    }\n  }\n  return passes;        // Anzahl Durchgänge (Mass für die Schwierigkeit)\n}\nfunction ngClues(N,sol){\n  const rc=[],cc=[];\n  for(let r=0;r<N;r++)rc.push(ngClue(sol.slice(r*N,r*N+N)));\n  for(let c=0;c<N;c++){const col=[];for(let r=0;r<N;r++)col.push(sol[r*N+c]);cc.push(ngClue(col));}\n  return {rc,cc};\n}\n/* Fehlende Eindeutigkeit durch einzelne vorgegebene Felder beheben. */\nfunction ngRepair(N,sol,rc,cc){\n  const g=new Array(N*N).fill(0),givens=[];\n  for(;;){\n    const passes=ngSolve(N,rc,cc,g);\n    const open=[];for(let i=0;i<N*N;i++)if(!g[i])open.push(i);\n    if(!open.length){givens.passes=passes;return givens;}\n    const i=randOf(open);g[i]=sol[i];givens.push(i);\n  }\n}\n/* ---------- Bildmotive ----------\n   5×5 und einige 10×10 sind von Hand gezeichnet, grössere Bilder entstehen aus Vektorformen\n   (Kreise, Rechtecke, Polygone) im Einheitsquadrat und werden auf die Rastergrösse gerastert. */\nconst NG_HAND5=[\n  ['Herz',['.#.#.','#####','#####','.###.','..#..']],\n  ['Haus',['..#..','.###.','#####','##.##','##.##']],\n  ['Baum',['.###.','#####','.###.','..#..','..#..']],\n  ['Pfeil',['..#..','.###.','#.#.#','..#..','..#..']],\n  ['Stern',['..#..','#####','.###.','.#.#.','#...#']],\n  ['Pilz',['.###.','#####','.###.','..#..','..#..']],\n  ['Raute',['..#..','.###.','#####','.###.','..#..']],\n  ['Kreuz',['..#..','..#..','#####','..#..','..#..']]\n];\nconst NG_HAND10=[\n  ['Herz',['..........','.###..###.','##########','##########','##########','.########.','..######..','...####...','....##....','..........']],\n  ['Haus',['....##....','...####...','..######..','.########.','##########','.########.','.########.','.###..###.','.###..###.','.###..###.']],\n  ['Tannenbaum',['....##....','...####...','..######..','...####...','..######..','.########.','##########','....##....','....##....','....##....']]\n];\nconst ngS={\n  circle:(cx,cy,r)=>(x,y)=>(x-cx)**2+(y-cy)**2<=r*r,\n  ell:(cx,cy,rx,ry)=>(x,y)=>((x-cx)/rx)**2+((y-cy)/ry)**2<=1,\n  rect:(x0,y0,x1,y1)=>(x,y)=>x>=x0&&x<=x1&&y>=y0&&y<=y1,\n  poly:pts=>(x,y)=>{let ins=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)ins=!ins;}return ins;},\n  line:(x0,y0,x1,y1,w)=>(x,y)=>{const dx=x1-x0,dy=y1-y0,t=Math.max(0,Math.min(1,((x-x0)*dx+(y-y0)*dy)/(dx*dx+dy*dy)));return Math.hypot(x-(x0+t*dx),y-(y0+t*dy))<=w/2;},\n  or:(...f)=>(x,y)=>f.some(g=>g(x,y)),\n  sub:(a,...b)=>(x,y)=>a(x,y)&&!b.some(g=>g(x,y)),\n  star:(cx,cy,R,r)=>{const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)]);}return ngS.poly(p);}\n};\nconst NG_VEC=(()=>{\n  const {circle,ell,rect,poly,line,or,sub,star}=ngS;\n  return [\n    ['Herz',10,or(circle(.3,.36,.21),circle(.7,.36,.21),poly([[.11,.45],[.89,.45],[.5,.9]]))],\n    ['Haus',10,sub(or(poly([[.06,.5],[.5,.08],[.94,.5]]),rect(.16,.5,.84,.92)),rect(.42,.66,.58,.92),rect(.24,.58,.34,.7),rect(.66,.58,.76,.7))],\n    ['Tannenbaum',10,or(poly([[.5,.05],[.72,.35],[.28,.35]]),poly([[.5,.25],[.8,.62],[.2,.62]]),poly([[.5,.45],[.92,.85],[.08,.85]]),rect(.43,.85,.57,.97))],\n    ['Stern',15,star(.5,.54,.46,.2)],\n    ['Fisch',15,sub(or(ell(.42,.5,.34,.24),poly([[.7,.5],[.96,.25],[.96,.75]])),circle(.26,.44,.045))],\n    ['Pilz',10,sub(or(sub(ell(.5,.5,.46,.42),rect(0,.5,1,1)),rect(.38,.5,.62,.93),rect(.3,.5,.7,.56)),circle(.3,.35,.07),circle(.62,.28,.07),circle(.78,.42,.05))],\n    ['Sonne',20,or(circle(.5,.5,.22),...[0,1,2,3,4,5,6,7].map(i=>{const a=i*Math.PI/4;return line(.5+.32*Math.cos(a),.5+.32*Math.sin(a),.5+.46*Math.cos(a),.5+.46*Math.sin(a),.09);}))],\n    ['Segelboot',10,or(poly([[.46,.08],[.46,.66],[.14,.66]]),poly([[.54,.2],[.54,.66],[.86,.66]]),poly([[.1,.72],[.9,.72],[.76,.92],[.24,.92]]))],\n    ['Tasse',10,or(sub(rect(.12,.3,.66,.88),rect(.2,.37,.58,.74)),sub(circle(.7,.52,.19),circle(.7,.52,.09),rect(0,0,.66,1)),rect(.05,.88,.75,.94))],\n    ['Schmetterling',10,or(ell(.27,.35,.23,.25),ell(.73,.35,.23,.25),ell(.3,.7,.17,.19),ell(.7,.7,.17,.19),rect(.46,.2,.54,.88))],\n    ['Katze',10,sub(or(circle(.5,.6,.32),poly([[.2,.45],[.22,.08],[.45,.3]]),poly([[.8,.45],[.78,.08],[.55,.3]])),circle(.38,.55,.055),circle(.62,.55,.055))],\n    ['Rakete',10,or(poly([[.5,.03],[.68,.3],[.68,.72],[.32,.72],[.32,.3]]),poly([[.32,.55],[.12,.82],[.32,.78]]),poly([[.68,.55],[.88,.82],[.68,.78]]),poly([[.4,.76],[.6,.76],[.5,.97]]))],\n    ['Blume',15,or(circle(.5,.3,.12),...[0,1,2,3,4].map(i=>{const a=-Math.PI/2+i*2*Math.PI/5;return circle(.5+.2*Math.cos(a),.3+.2*Math.sin(a),.12);}),rect(.46,.45,.54,.96),poly([[.5,.75],[.82,.62],[.7,.84]]))]\n  ];\n})();\nfunction ngRaster(N,f){\n  const sol=[];\n  for(let r=0;r<N;r++)for(let c=0;c<N;c++)sol.push(f((c+.5)/N,(r+.5)/N)?NG_FILL:NG_CROSS);\n  return sol;\n}\nfunction ngCandidates(N){\n  const out=[],fromRows=(name,rows)=>{const sol=[];for(const s of rows)for(const ch of s)sol.push(ch==='#'?NG_FILL:NG_CROSS);out.push({name,sol});};\n  if(N===5)NG_HAND5.forEach(([n,r])=>fromRows(n,r));\n  else{\n    if(N===10)NG_HAND10.forEach(([n,r])=>fromRows(n,r));\n    for(const [n,min,f] of NG_VEC)if(min<=N&&!(N===10&&NG_HAND10.some(h=>h[0]===n)))out.push({name:n,sol:ngRaster(N,f)});\n  }\n  return out;\n}\n/* Löser mit Statistik: Durchgänge, Schritte (Zeilen, die etwas Neues liefern) und Felder im ersten Durchgang. */\nfunction ngSolveStat(N,rc,cc,g){\n  let changed=true,passes=0,steps=0,first=0;\n  while(changed){\n    changed=false;passes++;\n    for(let a=0;a<2*N;a++){\n      const row=a<N,x=row?a:a-N,idx=[];\n      for(let b=0;b<N;b++)idx.push(row?x*N+b:b*N+x);\n      const line=idx.map(i=>g[i]),res=ngLine(row?rc[x]:cc[x],line);\n      if(!res)return null;\n      let n=0;\n      for(let b=0;b<N;b++)if(res[b]!==line[b]){g[idx[b]]=res[b];n++;}\n      if(n){changed=true;steps++;if(passes===1)first+=n;}\n    }\n  }\n  return {passes:passes-1,steps,first};\n}\n/* Bild ohne Vorgaben eindeutig und rein durch Zeilenlogik lösbar machen: Mehrdeutige Felder werden umgedreht.\n   Gibt {sol,rc,cc,stat} zurück oder null. */\nfunction ngMakeSolvable(N,sol,maxIter){\n  sol=sol.slice();\n  for(let it=0;it<maxIter;it++){\n    const {rc,cc}=ngClues(N,sol),g=new Array(N*N).fill(0);\n    const st=ngSolveStat(N,rc,cc,g);\n    if(!st)return null;\n    const open=[];for(let i=0;i<N*N;i++)if(!g[i])open.push(i);\n    if(!open.length)return {sol,rc,cc,stat:st};\n    // ein offenes Feld umdrehen (Füllen bevorzugt Nachbarn von gefüllten, damit das Bild zusammenhängend bleibt)\n    const i=randOf(open);\n    sol[i]=sol[i]===NG_FILL?NG_CROSS:NG_FILL;\n  }\n  return null;\n}\n\n/* zufällig spiegeln/drehen (8 Möglichkeiten) */\nfunction ngSym(N,sol){\n  const k=Math.floor(Math.random()*8),out=new Array(N*N);\n  for(let r=0;r<N;r++)for(let c=0;c<N;c++){\n    let rr=r,cc=c;\n    if(k&1)cc=N-1-cc;\n    if(k&2)rr=N-1-rr;\n    if(k&4){const t=rr;rr=cc;cc=t;}\n    out[r*N+c]=sol[rr*N+cc];\n  }\n  return out;\n}\nfunction ngNoise(N,sol,q){\n  return sol.map(v=>Math.random()<q?(v===NG_FILL?NG_CROSS:NG_FILL):v);\n}\n/* Sehr schwer / Ultraschwer: Ein bekanntes Bild wird «verfremdet» (einzelne Felder umgedreht) und so repariert,\n   dass es ohne Vorgaben und ohne Raten allein mit Zeilen-/Spaltenlogik lösbar ist. Von mehreren Kandidaten\n   gewinnt der mit den meisten nötigen Schritten und den wenigsten Einstiegsfeldern. */\nfunction ngGenerateHard(N,lvl){\n  const t0=Date.now();let pool=ngCandidates(N).filter(c=>c.name!==ngLast[N]);\n  if(!pool.length)pool=ngCandidates(N);\n  let best=null;\n  for(let k=0;k<(lvl.tries||4)&&(k<2||Date.now()-t0<7000);k++){\n    const c=randOf(pool),r=ngMakeSolvable(N,ngNoise(N,ngSym(N,c.sol),lvl.noise),2500);\n    if(!r)continue;\n    const score=r.stat.steps+5*r.stat.passes-.3*r.stat.first;\n    if(!best||score>best.score)best={r,score,name:c.name};\n  }\n  if(!best)return null;\n  ngLast[N]=best.name;\n  return {sol:best.r.sol,puz:new Array(N*N).fill(0),rc:best.r.rc,cc:best.r.cc,forced:0,passes:best.r.stat.passes,name:best.name+' (verfremdet)'};\n}\nconst ngLast={};\n/* lvl: {extra = zusätzlich vorgegebene Felder (Anteil), pick = 'm' (ohne Vorgaben bevorzugt) | 's' (verschachteltstes Bild)} */\nfunction ngGenerate(N,lvl){\n  if(lvl.noise)return ngGenerateHard(N,lvl);\n  const cands=ngCandidates(N).map(c=>{\n    if(Math.random()<.5){const f=[];for(let r=0;r<N;r++)for(let k=N-1;k>=0;k--)f.push(c.sol[r*N+k]);c.sol=f;}   // spiegeln\n    const {rc,cc}=ngClues(N,c.sol),giv=ngRepair(N,c.sol,rc,cc);\n    return {name:c.name,sol:c.sol,rc,cc,giv};\n  });\n  let pool=cands.filter(c=>c.name!==ngLast[N]);\n  if(!pool.length)pool=cands;\n  if(lvl.pick==='m'){const z=pool.filter(c=>!c.giv.length);if(z.length)pool=z;}\n  else if(lvl.pick==='s'){\n    pool=pool.slice().sort((a,b)=>a.giv.length-b.giv.length||b.giv.passes-a.giv.passes).slice(0,3);\n  }\n  const best=randOf(pool);\n  ngLast[N]=best.name;\n  const puz=new Array(N*N).fill(0),set=new Set(best.giv);\n  let extra=Math.round(N*N*lvl.extra);\n  for(const i of shuffle([...Array(N*N).keys()])){if(extra<=0)break;if(!set.has(i)&&best.sol[i]===NG_FILL){set.add(i);extra--;}}\n  for(const i of set)puz[i]=best.sol[i];\n  return {sol:best.sol,puz,rc:best.rc,cc:best.cc,forced:best.giv.length,passes:best.giv.passes,name:best.name};\n}\n/* ===== LOGIK-ENDE ===== */\n\nclass NonogrammPuzzle extends GridPuzzle{\n  constructor(def,size,lvlKey,data){\n    super(def,size,lvlKey,data);\n    this.rc=data.rc;this.cc=data.cc;this.name=data.name;this.rowEl=[];this.colEl=[];this.drag=null;\n  }\n  baseClass(i){\n    const N=this.n,r=Math.floor(i/N),c=i%N;let cls='cell';\n    if(c===N-1)cls+=' lastc';else if((c+1)%5===0)cls+=' tr';\n    if(r===N-1)cls+=' lastr';else if((r+1)%5===0)cls+=' tb';\n    return cls;\n  }\n  buildBoard(){\n    const N=this.n;\n    const outer=document.createElement('div');outer.className='ng';\n    outer.style.setProperty('--N',N);\n    outer.appendChild(document.createElement('div'));\n    const cl=document.createElement('div');cl.className='ngcols';\n    const rl=document.createElement('div');rl.className='ngrows';\n    this.colEl=[];this.rowEl=[];\n    for(let c=0;c<N;c++){const d=document.createElement('div');d.innerHTML=this.cc[c].map(n=>`<span>${n}<\/span>`).join('');cl.appendChild(d);this.colEl.push(d);}\n    for(let r=0;r<N;r++){const d=document.createElement('div');d.innerHTML=this.rc[r].map(n=>`<span>${n}<\/span>`).join('');rl.appendChild(d);this.rowEl.push(d);}\n    outer.appendChild(cl);outer.appendChild(rl);\n    const b=document.createElement('div');\n    b.className='board g-nonogramm';\n    b.style.setProperty('--n',N);b.style.setProperty('--cols',N);\n    b.setAttribute('aria-label','Nonogramm-Feld');\n    this.cells=[];\n    for(let i=0;i<N*N;i++){const d=document.createElement('div');b.appendChild(d);this.cells.push(d);}\n    const cellAt=e=>{\n      const r0=this.cells[0].getBoundingClientRect(),w=r0.width;\n      const c=Math.floor((e.clientX-r0.left)/w),r=Math.floor((e.clientY-r0.top)/w);\n      return (r>=0&&c>=0&&r<N&&c<N)?r*N+c:-1;\n    };\n    b.addEventListener('contextmenu',e=>e.preventDefault());\n    b.addEventListener('pointerdown',e=>{\n      const i=cellAt(e);if(i<0||this.done||this.locked)return;\n      e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}\n      this.sel=i;\n      if(this.given[i]){this.commit();return;}\n      const mode=(e.button===2||this.ctx.noteMode())?NG_CROSS:NG_FILL;\n      this.drag={mode,val:this.cur[i]===mode?0:mode,last:i};\n      this.paintDrag(i,true);\n    });\n    b.addEventListener('pointermove',e=>{\n      if(!this.drag)return;\n      const i=cellAt(e);\n      if(i>=0&&i!==this.drag.last){this.drag.last=i;this.paintDrag(i,false);}\n    });\n    const end=()=>{this.drag=null;};\n    b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);\n    outer.appendChild(b);\n    return outer;\n  }\n  paintDrag(i,first){\n    if(this.given[i]||this.done||this.locked)return;\n    const d=this.drag,v=this.cur[i];\n    if(first||(d.val===0?v===d.mode:v===0)){this.setCell(i,d.val);this.commit();}\n  }\n  cellState(i){\n    const v=this.cur[i];\n    if(!v)return this.sol[i]===NG_FILL?'empty':'skip';\n    return v===this.sol[i]?'right':'wrong';\n  }\n  solved(){\n    for(let i=0;i<this.cur.length;i++)if((this.cur[i]===NG_FILL)!==(this.sol[i]===NG_FILL))return false;\n    return true;\n  }\n  revealEmpty(i){if(this.sol[i]===NG_FILL)this.hinted[i]=true;}\n  /* «Vollständig» = so viele schwarze Felder gesetzt, wie das Bild hat (oder mehr) */\n  complete(){\n    let a=0,b=0;\n    for(let i=0;i<this.cur.length;i++){if(this.cur[i]===NG_FILL)a++;if(this.sol[i]===NG_FILL)b++;}\n    return a>=b;\n  }\n  finish(){\n    this.done=true;\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i]||this.hinted[i])continue;\n      if(!this.cur[i])this.cur[i]=NG_CROSS;else this.mark[i]=1;\n    }\n    this.cells[0].parentNode.classList.add('solved');   // Bild ohne Gitter und Kreuze zeigen\n    this.refresh();\n  }\n  winInfo(){return `Das Bild zeigt: <b>${this.name}<\/b>`;}\n  afterReset(){if(this.cells[0])this.cells[0].parentNode.classList.remove('solved');}\n  paint(i,d){\n    const v=this.cur[i];\n    if(v===NG_FILL)d.classList.add('f');else if(v===NG_CROSS)d.classList.add('x');\n    d.textContent='';\n  }\n  afterRefresh(){\n    const N=this.n;\n    for(let a=0;a<2*N;a++){\n      const row=a<N,x=row?a:a-N,line=[];\n      for(let b=0;b<N;b++)line.push(this.cur[row?x*N+b:b*N+x]);\n      const ok=ngClue(line).join()===(row?this.rc[x]:this.cc[x]).join();\n      (row?this.rowEl[x]:this.colEl[x]).classList.toggle('done',ok);\n    }\n  }\n  setSym(v){\n    if(!this.editable())return;\n    this.setCell(this.sel,this.cur[this.sel]===v?0:v);this.commit();\n  }\n  handleKey(e){\n    const k=e.key;\n    if(k===' '||k==='Enter'||k==='1'||k==='f'||k==='F'){this.setSym(NG_FILL);return true;}\n    if(k==='x'||k==='X'||k==='2'){this.setSym(NG_CROSS);return true;}\n    if(k==='Backspace'||k==='Delete'||k==='0'){if(this.editable()){this.setCell(this.sel,0);this.commit();}return true;}\n    return false;\n  }\n  /* Tipp: eine Zeile/Spalte suchen, in der aus dem bisher Richtigen ein weiteres Feld folgt */\n  pickHint(){\n    const N=this.n,g=this.cur.map((v,i)=>(this.given[i]||this.hinted[i]||v===this.sol[i])?v:0);\n    const cands=[];\n    for(let a=0;a<2*N;a++){\n      const row=a<N,x=row?a:a-N,idx=[];\n      for(let b=0;b<N;b++)idx.push(row?x*N+b:b*N+x);\n      const line=idx.map(i=>g[i]),res=ngLine(row?this.rc[x]:this.cc[x],line);\n      if(!res)continue;\n      for(let b=0;b<N;b++){\n        if(!line[b]&&res[b]&&!this.given[idx[b]]&&this.cur[idx[b]]!==this.sol[idx[b]])\n          cands.push({i:idx[b],row,x,v:res[b]});\n      }\n    }\n    if(cands.length){\n      const sel=cands.filter(c=>c.i===this.sel),c=randOf(sel.length?sel:cands);\n      const clue=(c.row?this.rc[c.x]:this.cc[c.x]).join(' ');\n      const nm=(c.row?'Zeile ':'Spalte ')+(c.x+1);\n      const why=c.v===NG_FILL\n        ?'Hier bleibt gar kein anderer Platz: Dieses Feld muss schwarz sein (Überlappung der möglichen Lagen der Blöcke).'\n        :'Hier kann kein Block mehr liegen: Dieses Feld ist leer (Kreuz).';\n      return {i:c.i,text:`Tipp (gelb): ${nm} mit den Zahlen «${clue}» – ${why}`};\n    }\n    const open=[];\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]&&this.cur[i]!==this.sol[i]&&this.sol[i]===NG_FILL)open.push(i);\n    if(!open.length)return null;\n    return {i:randOf(open),text:'Tipp (gelb): Dieses Feld ist schwarz. (Es ist aus deinen bisherigen Feldern nicht direkt herleitbar – prüfe, ob einzelne Felder falsch sind.)'};\n  }\n}\n\nconst GAME={\n  title:'Nonogramm-Trainer',\n  id:'nonogramm', name:'Nonogramm', icon:'🖼️', units:['Feld','Felder'],\n  intro:'Die Zahlen am Rand verraten, wo die schwarzen Blöcke liegen – am Ende entsteht ein Bild.',\n  sizes:[5,10,15,20,25], size:5, lvl:'sl', tools:{notes:true,notesLabel:'✕ Kreuz-Modus'},\n  padHelp:'Feld antippen oder darüberziehen: schwarz. Mit «Kreuz-Modus» (oder Rechtsklick) setzt du Kreuze für sicher leere Felder.',\n  missing:n=>`Es fehlen noch ${n} schwarze Felder.`,\n  levels:{\n    sl:{extra:.12,sizes:[5,10,15,20],desc:'Ein Bild entsteht. Einige schwarze Felder sind schon vorgegeben.'},\n    l: {extra:.05,sizes:[5,10,15,20],desc:'Weniger Vorgaben. Zeilen- und Spaltenlogik genügt.'},\n    m: {extra:0,pick:'m',sizes:[5,10,15,20],desc:'Keine zusätzlichen Vorgaben. Du musst oft zwischen Zeilen und Spalten wechseln.'},\n    s: {extra:0,pick:'s',sizes:[5,10,15,20],desc:'Das trickreichste Bild der Auswahl, ohne zusätzliche Vorgaben.'},\n    ss:{extra:0,noise:.10,tries:4,sizes:[15,20],desc:'Ein verfremdetes Bild ohne jede Vorgabe, mit vielen kleinen Blöcken. Du musst viele Male zwischen Zeilen und Spalten wechseln – Einstiegsfelder gibt es kaum. Ab 15×15.'},\n    us:{extra:0,noise:.20,tries:6,sizes:[20,25],desc:'Das Härteste: ein stark verfremdetes Bild, keine Vorgaben, sehr wenige Einstiegsfelder und ein langer Weg bis zum Bild. Alles ist durch Zeilen- und Spaltenlogik herleitbar, Raten ist nie nötig. Nur 20×20 und 25×25.'}\n  },\n  create(size,lvl){\n    for(let t=0;t<5;t++){const d=ngGenerate(size,this.levels[lvl]);if(d)return new NonogrammPuzzle(this,size,lvl,d);}\n    return null;\n  },\n  rules(n){\n    return `\n      <li>Jede Zahl am Rand ist die Länge eines <b>Blocks<\/b> aus zusammenhängenden schwarzen Feldern in dieser Zeile bzw. Spalte.<\/li>\n      <li>«3 1» heisst: erst ein Block aus 3, dann <b>mindestens eine Lücke<\/b>, dann ein Block aus 1 (in dieser Reihenfolge). «0» heisst: ganze Zeile leer.<\/li>\n      <li>Fülle alle Felder richtig – am Ende ergibt sich ein <b>Bild<\/b> (Herz, Haus, Katze …). Raten ist nie nötig.<\/li>\n      <li><b>Strategie:<\/b> Bei grossen Zahlen überlappen die möglichen Lagen: Ist ein Block 8 lang in 10 Feldern, sind die mittleren 6 sicher schwarz. Passt eine Zeile fertig, setze Kreuze in die übrigen Felder.<\/li>\n      <li>Fertig erfüllte Zahlen werden grau.<\/li>\n      <li><b>Für Fortgeschrittene:<\/b> Gehe jede Zeile und Spalte der Reihe nach durch, auch mehrmals: Jede neue Information (schwarz oder Kreuz) bringt in der Gegenrichtung neue Schlüsse. Rechne mit der <b>frühesten und der spätesten Lage<\/b> jedes Blocks; Felder, die in beiden schwarz sind, sind sicher schwarz.<\/li>\n      <li><b>Abgeben:<\/b> Fülle das ganze Rätsel aus und drücke dann «Abgeben». Erst jetzt wird korrigiert: Stimmt etwas nicht, werden die falschen Felder rot und du musst ein neues Rätsel beginnen. Prüfe deshalb vor dem Abgeben alles nochmals in Ruhe.<\/li>\n      <li><b>Grosse Bilder auf dem Handy:<\/b> Ab 20×20 ist das Feld breiter als der Bildschirm. Zum Verschieben am Rand (bei den Zahlen) seitlich wischen oder das Gerät quer halten.<\/li>\n      <li><b>Bedienung:<\/b> Feld antippen oder mit gedrückter Maus/Finger darüberziehen: schwarz. «Kreuz-Modus» (Taste N) oder Rechtsklick: Kreuz für leer. Tastatur: Pfeiltasten, Leertaste = schwarz, X = Kreuz, Entf.<\/li>\n      <li><b>Tipp:<\/b> erklärt, in welcher Zeile oder Spalte sich ein weiteres Feld sicher herleiten lässt.<\/li>`;\n  }\n};\n\n/* =====================================================================\n   KERN – Oberfläche (gilt für jedes Rätsel)\n   Erwartet eine globale Konstante GAME (vom Rätsel-Modul definiert).\n   Kümmert sich um: Auswahl Grösse/Niveau, Zeit, Statistik, Prüfen, Tipp,\n   Neu beginnen, Lösung zeigen, Drucken, Gewonnen-Dialog, Tastatur,\n   Einbettung in die Plattform (?embed=1).\n   ===================================================================== */\nconst $=id=>document.getElementById(id);\nconst def=GAME;\nconst EMBED=/[?&]embed=1/.test(location.search)||window.name==='raetsel-embed';\nconst STORE_KEY='raetsel-trainer-v1-'+def.id;\nconst settings={size:def.size,lvl:def.lvl};\nlet solUsed=false,puz=null,noteMode=false,tips=0,checks=0,startT=0,timerId=null,genToken=0;\n\n$('autoCheck').checked=false;\nfunction loadStore(){\n  try{\n    const o=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');\n    if(def.sizes.includes(o.size))settings.size=o.size;\n    if(def.levels[o.lvl])settings.lvl=o.lvl;\n  }catch(e){}\n}\nfunction saveStore(){try{localStorage.setItem(STORE_KEY,JSON.stringify(settings));}catch(e){}}\n\n/* Meldungen, Zeit, Statistik */\nfunction showMsg(t,type){const m=$('msg');m.textContent=t;m.className='msg show '+type;}\nfunction hideMsg(){$('msg').className='msg';}\nfunction elapsed(){return Math.floor((Date.now()-startT)/1000);}\nfunction fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}\nfunction startTimer(){stopTimer();startT=Date.now();$('stTime').textContent='00:00';timerId=setInterval(()=>$('stTime').textContent=fmt(elapsed()),1000);}\nfunction stopTimer(){if(timerId)clearInterval(timerId);timerId=null;}\n/* Deutlich sichtbare Kennzeichnung: Wurde die Lösung angezeigt, bleibt das für dieses Rätsel sichtbar\n   (auch nach «Neu beginnen» und nach dem Lösen) – ein Screenshot kann also nicht als eigene Lösung gelten. */\nfunction updateStatus(){\n  const st=$('stStatus'),won=puz&&puz.done&&!solUsed&&puz.solved(),lk=puz&&puz.locked&&!solUsed,rdy=puz&&!puz.done&&!puz.locked&&puz.complete();\n  st.className=(solUsed||lk)?'bad':won?'good':'';\n  st.textContent=solUsed?'⚠ Lösung angezeigt':lk?'✖ nicht richtig gelöst':won?'✔ selbst gelöst':rdy?'bereit zum Abgeben':'in Arbeit';\n  $('solBanner').style.display=solUsed?'block':'none';\n  $('stage').classList.toggle('sol',solUsed);\n}\n/* Tipps je Niveau: einfache Stufen keine, Mittel 1, Schwer 2, Sehr schwer/Ultraschwer 3 */\nconst TIP_LIMIT={sl:0,l:0,m:1,s:2,ss:3,us:3};\nfunction tipLimit(){return TIP_LIMIT[puz?puz.lvlKey:settings.lvl]||0;}\nfunction tipText(l){const n=TIP_LIMIT[l]||0;return n===0?'Keine Tipps möglich.':n===1?'Maximal 1 Tipp.':`Maximal ${n} Tipps.`;}\nfunction updateStats(){$('stTips').textContent=tips+'/'+tipLimit();$('stChecks').textContent=checks;}\n\nconst ctx={\n  autoCheck:()=>$('autoCheck').checked,\n  noteMode:()=>noteMode,\n  hideMsg,\n  changed:()=>{refreshTools();},\n\n  msg:showMsg\n};\n/* Beschriftungen – Rätsel dürfen sie überschreiben (def.sizeLabel, def.tag, def.newLabel …) */\nconst sizeLabel=v=>def.sizeLabel?def.sizeLabel(v):`${v} × ${v}`;\nconst tagOf=(s,l)=>def.tag?def.tag(s,l):`${LEVEL_NAMES[l]} (${s}×${s})`;\n\n/* Auswahl-Leisten */\nfunction makeSeg(el,items,current,onPick){\n  el.innerHTML='';\n  for(const it of items){\n    const b=document.createElement('button');\n    b.textContent=it.label;b.dataset.v=it.v;\n    b.classList.toggle('on',String(it.v)===String(current));\n    b.addEventListener('click',()=>onPick(it.v));\n    el.appendChild(b);\n  }\n}\n/* Manche Niveaus gibt es nur ab einer bestimmten Grösse (levels.xx.sizes) */\nfunction sizesFor(){return def.levels[settings.lvl].sizes||def.sizes;}\nfunction buildOptions(){\n  const allowed=sizesFor();\n  if(!allowed.includes(settings.size))settings.size=allowed.find(n=>n>=settings.size)||allowed[allowed.length-1];\n  makeSeg($('sizeSeg'),allowed.map(n=>({v:n,label:sizeLabel(n)})),settings.size,v=>{settings.size=v;buildOptions();saveStore();updateSetupSel();});\n  makeSeg($('lvlSeg'),Object.keys(def.levels).map(k=>({v:k,label:LEVEL_NAMES[k]})),settings.lvl,v=>{settings.lvl=v;buildOptions();saveStore();updateSetupSel();});\n  const d=def.levels[settings.lvl].desc;\n  $('lvlDesc').textContent=(typeof d==='function'?d(settings.size):d)+' '+tipText(settings.lvl);\n  $('sizeSeg').style.display=def.sizes.length>1?'':'none';\n  $('sizeLbl').style.display=def.sizes.length>1?'':'none';\n}\n\n\n/* Schritt 1: Rahmenbedingungen wählen – Schritt 2: Rätsel erstellen */\nconst TOOL_IDS=['btnCheck','btnNotes','btnHint','btnReset','btnSolve','btnPrint','btnSubmit'];\nfunction toolsDisabled(on){for(const id of TOOL_IDS){const e=$(id);if(e)e.disabled=on;}if($('autoCheck'))$('autoCheck').disabled=on;}\nfunction showSetup(){\n  ++genToken;stopTimer();puz=null;tips=0;checks=0;solUsed=false;\n  const stage=$('stage');stage.classList.remove('loading','sol');\n  stage.innerHTML=`<div class=\"setup-ph\"><div class=\"big\">${def.icon||'🧩'}<\/div><h3>Neues ${def.name} einrichten<\/h3><p>Wähle Grösse und Niveau und erstelle dann das Rätsel.<\/p><p class=\"chosen\" id=\"setupSel\"><\/p><button class=\"btn primary\" id=\"btnSetupGo\">Rätsel erstellen<\/button><\/div>`;\n  $('btnSetupGo').addEventListener('click',startGame);\n  const pad=$('pad');pad.innerHTML='';pad.removeAttribute('style');\n  toolsDisabled(true);hideMsg();\n  $('stLevel').textContent='–';$('stTime').textContent='00:00';$('stStatus').textContent='noch kein Rätsel';$('stStatus').className='';\n  if($('stTips'))$('stTips').textContent='–';\n  if($('solBanner'))$('solBanner').style.display='none';\n  updateSetupSel();\n}\nfunction updateSetupSel(){const e=$('setupSel');if(e)e.textContent=(def.sizes.length>1?sizeLabel(settings.size)+' · ':'')+LEVEL_NAMES[settings.lvl];}\nfunction startGame(){\n  if(puz&&!puz.done&&!puz.locked&&!solUsed&&!confirm('Das laufende Rätsel wird verworfen. Wirklich ein neues Rätsel erstellen?'))return;\n  newGame();\n}\n\n/* Neues Rätsel */\nfunction newGame(){\n  const token=++genToken, stage=$('stage');\n  stopTimer();\n  stage.classList.add('loading');\n  showMsg(`${def.name} wird erstellt …`,'info');\n  setTimeout(()=>{\n    if(token!==genToken)return;\n    let p=null;\n    try{p=def.create(settings.size,settings.lvl);}catch(err){console.error(err);}\n    stage.classList.remove('loading');\n    if(!p){showMsg('Das Rätsel konnte nicht erstellt werden. Bitte nochmals versuchen.','warn');if(!puz)showSetup();return;}\n    puz=p;tips=0;checks=0;solUsed=false;\n    toolsDisabled(false);\n    puz.mount(ctx,stage,$('pad'));setLocked(false);\n    if($('autoCheck').checked)puz.applyAutoCheck(true);\n    $('stLevel').textContent=tagOf(settings.size,settings.lvl);\n    $('phTitle').textContent=`${def.name} · ${tagOf(settings.size,settings.lvl)}`;\n    $('rules').innerHTML=def.rules(settings.size);\n    updateStats();updateStatus();startTimer();hideMsg();\n  },30);\n}\n\n/* Werkzeuge */\nfunction check(){\n  if(!puz||puz.done||puz.locked)return;\n  if(puz.customCheck){checks++;updateStats();const r=puz.customCheck();showMsg(r.text,r.type);return;}\n  checks++;\n  const {wrong,empty,right}=puz.check();\n  updateStats();\n  if(puz.solved()){win();return;}\n  const [one,many]=def.units;\n  if(wrong===0){\n    showMsg(right===0?`Noch nichts eingetragen. ${def.missing(empty)}`\n      :`Super! ${right===1?'Die eingetragene '+one+' ist':'Alle '+right+' eingetragenen '+many+' sind'} richtig. ${def.missing(empty)}`,'good');\n  } else {\n    showMsg(`${wrong} ${wrong===1?one+' ist':many+' sind'} falsch (rot). ${right} richtig. ${def.missing(empty)} Korrigiere die roten Felder.`,'warn');\n  }\n}\nfunction hint(){\n  if(!puz||puz.done||puz.locked||tips>=tipLimit())return;\n  const t=puz.hint();\n  if(t===null)return;\n  tips++;updateStats();showMsg(t,'info');\n  ctx.changed();\n}\nfunction resetGame(){\n  if(!puz||puz.locked||!confirm('Alle eigenen Eingaben löschen und neu beginnen? Bereits benutzte Tipps bleiben verbraucht.'))return;\n  puz.reset();startTimer();hideMsg();updateStats();refreshTools();\n}\nfunction showSolution(){\n  if(!puz)return;\n  if(!confirm(`Wirklich die ganze Lösung anzeigen? Das ${def.name}-Rätsel gilt dann als nicht gelöst.`))return;\n  solUsed=true;puz.reveal();stopTimer();refreshTools();\n  showMsg('Lösung angezeigt: grün = du hattest es richtig, rot = war falsch, gelb = war leer.','info');\n}\n/* Werkzeuge sperren/freigeben (nach einem vollständig falsch gelösten Rätsel bleibt nur «Lösung zeigen» / «Neues Rätsel») */\nfunction setLocked(on){\n  for(const id of ['btnCheck','btnHint','btnReset','btnNotes','autoCheck'])$(id).disabled=on;\n  $('autoCheck').parentElement.classList.toggle('off',on);\n  document.querySelectorAll('#pad button').forEach(b=>b.disabled=on);\n  refreshTools();\n}\n/* «Abgeben» ist erst möglich, wenn alles ausgefüllt ist. Dann sind Überprüfen und Tipp gesperrt – sonst könnte man vor dem Abgeben noch Fehler suchen. */\nfunction refreshTools(){\n  if(!puz)return;\n  const over=puz.done||puz.locked,comp=!over&&puz.complete();\n  $('btnSubmit').disabled=!comp;\n  $('btnSubmit').title=comp?'':'Erst alle Felder ausfüllen';\n  const lim=tipLimit(),left=lim-tips;\n  $('btnHint').textContent=lim?`💡 Tipp (${left} übrig)`:'💡 Keine Tipps';\n  if(!puz.locked){$('btnCheck').disabled=true;$('btnHint').disabled=over||comp||left<=0;}\n  updateStatus();\n  if(comp&&!$('msg').classList.contains('show'))showMsg('Alles ausgefüllt. Prüfe nochmals in Ruhe – mit «Abgeben» gibst du das Rätsel ab. Erst dann wird korrigiert.','info');\n}\n/* Abgeben: erst jetzt wird ausgewertet */\nfunction submitPuz(){\n  if(!puz||puz.done||puz.locked||!puz.complete())return;\n  if(puz.solved())win();else fail();\n}\n/* Rätsel ist vollständig ausgefüllt, aber nicht richtig: Fehler rot, keine Korrektur mehr möglich */\nfunction fail(){\n  puz.lock();stopTimer();setLocked(true);\n  const bad=puz.mark.filter(m=>m===2).length;\n  $('winTitle').textContent='✖ Leider nicht richtig';\n  $('winText').innerHTML=`${def.name} · Niveau: <b>${tagOf(settings.size,settings.lvl)}<\/b><br>Zeit: <b>${fmt(elapsed())}<\/b> · Tipps: <b>${tips} von ${tipLimit()}<\/b><br>Du hast das Rätsel abgegeben, aber <b>${bad===1?'ein Feld ist':bad+' Felder sind'} falsch<\/b> (rot markiert).<br>Abgegebene Rätsel können nicht mehr korrigiert werden – starte ein <b>neues Rätsel<\/b> und versuche es nochmals.`;\n  $('winTip').style.display='none';\n  $('btnWinNew').textContent='Neues Rätsel';$('btnWinClose').textContent='Fehler ansehen';\n  $('overlay').classList.add('show');\n  showMsg('Abgegeben – nicht richtig gelöst: Die roten Felder sind falsch. Korrigieren ist nicht mehr möglich – starte ein neues Rätsel.','warn');\n}\nfunction win(){\n  $('winTip').style.display='';$('btnWinNew').textContent='Nächstes Rätsel';$('btnWinClose').textContent='Schliessen';\n  puz.finish();stopTimer();\n  $('winText').innerHTML=`${def.name} · Niveau: <b>${tagOf(settings.size,settings.lvl)}<\/b><br>Zeit: <b>${fmt(elapsed())}<\/b><br>${puz.winInfo?puz.winInfo()+'<br>':''}Tipps: <b>${tips} von ${tipLimit()}<\/b>`;\n  if(solUsed){$('winTitle').textContent='⚠ Gelöst – aber mit Lösung';$('winText').innerHTML+='<br><b style=\"color:var(--bad)\">Die Lösung wurde angezeigt – das zählt nicht als selbst gelöst.<\/b>';}\n  else $('winTitle').textContent='🎉 Geschafft!';\n  refreshTools();\n  $('overlay').classList.add('show');\n  showMsg(solUsed?'Gelöst – aber die Lösung wurde vorher angezeigt.':`Gelöst in ${fmt(elapsed())} mit ${tips} Tipps.`,solUsed?'warn':'good');\n}\nfunction toggleNotes(){\n  if(def.tools.undo){if(puz)puz.undo();return;}\n  if(!def.tools.notes)return;\n  noteMode=!noteMode;\n  $('btnNotes').textContent=(def.tools.notesLabel||'✎ Notizen')+': '+(noteMode?'ein':'aus');\n  $('btnNotes').classList.toggle('on',noteMode);\n}\n\n/* Ereignisse */\n$('btnNew').addEventListener('click',startGame);\n$('btnCheck').addEventListener('click',check);\n$('btnSubmit').addEventListener('click',submitPuz);\n$('btnHint').addEventListener('click',hint);\n$('btnReset').addEventListener('click',resetGame);\n$('btnSolve').addEventListener('click',showSolution);\n$('btnPrint').addEventListener('click',()=>{if(puz){puz.clearSelection();}window.print();});\n$('btnNotes').addEventListener('click',toggleNotes);\n$('btnWinNew').addEventListener('click',()=>{$('overlay').classList.remove('show');showSetup();});\n$('btnWinClose').addEventListener('click',()=>$('overlay').classList.remove('show'));\n$('autoCheck').addEventListener('change',()=>{if(puz)puz.applyAutoCheck($('autoCheck').checked);});\n\ndocument.addEventListener('keydown',e=>{\n  if($('overlay').classList.contains('show')||!puz)return;\n  if(e.ctrlKey||e.metaKey||e.altKey)return;\n  const t=e.target;\n  if(e.key===' '&&t&&t.closest&&t.closest('button,input,summary,select,textarea'))return;   // Leertaste bedient dann das Bedienelement\n  if((e.key==='n'||e.key==='N')&&def.tools.notes&&!def.tools.undo){toggleNotes();return;}\n  if((e.key==='z'||e.key==='Z'||e.key==='Backspace')&&def.tools.undo&&puz.undo){puz.undo();e.preventDefault();return;}\n  if(puz.keydown(e))e.preventDefault();\n});\n\n/* Einbettung: Höhe an die Plattform melden */\nfunction setupEmbed(){\n  document.body.classList.add('embed');\n  if(window.parent===window)return;\n  const send=()=>window.parent.postMessage({type:'raetsel-height',id:def.id,h:Math.ceil(document.body.getBoundingClientRect().height)},'*');\n  if(window.ResizeObserver)new ResizeObserver(send).observe(document.body);\n  window.addEventListener('load',send);\n  send();\n}\n\n/* Start */\n(function init(){\n  loadStore();\n  $('gameTitle').textContent=def.title;\n  $('sub').textContent=def.intro;\n  $('newTitle').textContent=def.newLabel||'Neues '+def.name;\n  $('btnNew').textContent=def.newLabel?def.newLabel+' starten':'Neues '+def.name+' erstellen';\n  $('sizeLbl').textContent=def.sizeTitle||'Grösse';\n  if(def.tools.undo)$('btnNotes').textContent='↶ Zug zurück';\n  else if(def.tools.notesLabel)$('btnNotes').textContent=def.tools.notesLabel+': aus';\n  if(def.tools.auto===false)$('autoCheck').parentElement.style.display='none';\n  if(def.tools.legend===false)document.querySelector('.legend').style.display='none';\n  $('rulesTitle').textContent='So geht '+def.name;\n  $('btnNotes').style.display=(def.tools.notes||def.tools.undo)?'':'none';\n  $('btnHint').classList.toggle('full',!(def.tools.notes||def.tools.undo));\n  document.title=def.title+' – Rätsel-Trainer';\n  if(EMBED)setupEmbed();\n  buildOptions();\n  showSetup();\n})();\n\n<\/script>\n<\/body>\n<\/html>\n"
 },
 {
  "id": "hanoi",
  "name": "Turm von Hanoi",
  "icon": "🗼",
  "intro": "Versetze den Turm Scheibe für Scheibe – nie eine grössere auf eine kleinere.",
  "html": "<!doctype html>\n<html lang=\"de-CH\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Turm von Hanoi – Rätsel-Trainer<\/title>\n<style>\n:root{\n  /* Farben nach flade.ch: Weiss als Grund, Anthrazit für Text, Limettengrün #aecb35 als Akzent */\n  --bg:#ffffff; --card:#f8faf0; --ink:#231f20; --muted:#5f6657;\n  --line:#d3dbbd; --thick:#231f20; --given:#231f20; --user:#46640f;\n  --sel:#dbe9a0; --peer:#f4f8e2; --same:#e7f0bd;\n  --ok:#15803d; --okbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2;\n  --hint:#92400e; --hintbg:#fef3c7;\n  --accent:#aecb35; --accent-bg:#f1f7d9; --accent-dark:#5d7410; --lime:#aecb35;\n  --water:#e6f1f5;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,\"Segoe UI\",Arial,sans-serif;}\n.wrap{max-width:980px;margin:0 auto;padding:16px;}\n\n/* Kopf */\n.top{display:flex;align-items:center;gap:16px;margin:2px 0 14px;padding-bottom:12px;border-bottom:3px solid var(--lime)}\n.logo{height:58px;width:auto;display:block;flex:none}\n.titlebox h1{margin:0;font-size:1.7rem;line-height:1.15}\n.sub{color:var(--muted);margin:2px 0 0}\n/* Layout */\n.layout{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}\n.left{flex:1 1 420px;min-width:280px}\n.right{flex:0 1 300px;min-width:260px;display:flex;flex-direction:column;gap:12px}\n.card{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(35,31,32,.06)}\n.card h2{font-size:1.05rem;margin:0 0 8px}\nlabel.small{font-size:.9rem;color:var(--muted);display:block;margin-bottom:4px}\n.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}\n.seg button{flex:1 1 auto;border:2px solid var(--line);background:#fff;border-radius:8px;padding:7px 8px;font:inherit;cursor:pointer;color:var(--ink)}\n.seg button.on{border-color:var(--accent);background:var(--accent-bg);font-weight:bold}\n.lvldesc{font-size:.9rem;color:var(--muted);min-height:2.4em;margin:0 0 10px}\n.btn{border:none;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer;background:#e5e7eb;color:var(--ink)}\n.btn:hover{filter:brightness(.95)}\n.btn.primary{background:var(--accent);color:var(--ink);font-weight:bold}\n.btn.primary:hover{background:#9db92d}\n.btn.on{background:var(--accent-dark);color:#fff}\n.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.btns .full{grid-column:1/-1}\n.stats{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}\n.stats b{font-variant-numeric:tabular-nums}\nbutton:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}\n\n/* Spielfeld (gemeinsam) */\n.board{\n  width:min(100%,520px); aspect-ratio:1/1; margin:0 auto;\n  display:grid; grid-template-columns:repeat(var(--cols,var(--n)),1fr); grid-template-rows:repeat(var(--cols,var(--n)),1fr);\n  border:3px solid var(--thick); background:#fff; user-select:none; touch-action:manipulation;\n}\n.cell{\n  display:flex;align-items:center;justify-content:center;position:relative;\n  border-right:1px solid var(--line);border-bottom:1px solid var(--line);\n  font-size:calc(min(100vw - 40px,520px) / var(--n) * .55);\n  cursor:pointer;color:var(--user);\n}\n.cell.tr{border-right:3px solid var(--thick)}\n.cell.tb{border-bottom:3px solid var(--thick)}\n.cell.lastc{border-right:none}\n.cell.lastr{border-bottom:none}\n.cell.water{background:var(--water)}\n.cell.peer{background:var(--peer)}\n.cell.same{background:var(--same)}\n.cell.sel{background:var(--sel)}\n.cell.given{color:var(--given);font-weight:bold}\n.cell.hint{color:var(--hint);background:var(--hintbg)}\n.cell.ok{color:var(--ok);background:var(--okbg)}\n.cell.bad{color:var(--bad);background:var(--badbg)}\n.cell.sel.ok,.cell.sel.bad,.cell.sel.hint{outline:3px solid var(--accent);outline-offset:-3px}\n.cell.water.ok,.cell.water.bad,.cell.water.hint{outline:0}\n.notes{position:absolute;inset:2px;display:grid;font-size:calc(min(100vw - 40px,520px) / var(--n) * .22);color:#64748b;line-height:1;font-weight:normal}\n.notes span{display:flex;align-items:center;justify-content:center}\n\n/* Eingabe */\n.pad{display:grid;gap:6px;margin:12px auto 0;width:min(100%,520px)}\n.pad button{font:inherit;font-size:1.4rem;padding:10px 0;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}\n.pad button.del{font-size:1rem}\n.pad button.done{opacity:.35}\n.padhelp{margin:12px auto 0;width:min(100%,520px);font-size:.95rem;color:var(--muted);text-align:center}\n.msg{margin:12px auto 0;width:min(100%,520px);padding:10px 12px;border-radius:8px;display:none;font-size:1rem}\n.msg.show{display:block}\n.msg.info{background:#e0f2fe;color:#075985}\n.msg.good{background:var(--okbg);color:#14532d}\n.msg.warn{background:var(--badbg);color:#7f1d1d}\n.toggle{display:flex;gap:8px;align-items:center;font-size:.95rem;margin-top:6px;cursor:pointer}\ndetails summary{cursor:pointer;font-weight:bold}\ndetails ul{padding-left:18px;margin:8px 0 0}\ndetails li{margin-bottom:4px}\n.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:.85rem;margin-top:8px}\n.legend span{padding:2px 6px;border-radius:5px}\n.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}\n.overlay.show{display:flex}\n.dialog{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%;text-align:center}\n.dialog h3{margin:0 0 8px;font-size:1.5rem}\n.dialog p{margin:6px 0}\n.loading{opacity:.4;pointer-events:none}\n.printhead{display:none}\n\n@media (max-width:520px){\n  .logo{height:46px}\n  .titlebox h1{font-size:1.4rem}\n}\n@media print{\n  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  body{background:#fff}\n  .right,.pad,.padhelp,.msg,.sub,.titlebox,.stats,.overlay{display:none!important}\n  .top{margin:0 0 8px}\n  .logo{height:1.3cm}\n  .printhead{display:block;margin-bottom:12px;font-size:1.2rem}\n  .board{width:16cm}\n  .cell{font-size:calc(16cm / var(--n) * .55)}\n  .cell.peer,.cell.same,.cell.sel{background:#fff}\n}\n\n/* Eingebettet in die Plattform: Kopf wird von der Plattform gezeigt */\nbody.embed .top{display:none}\nbody.embed .wrap{padding-top:0}\n@media print{body.embed .top{display:flex}}\n\n/* Kennzeichnung «Lösung angezeigt» */\n#stStatus.bad{color:var(--bad)}\n#stStatus.good{color:var(--ok)}\n.solbanner{display:none;background:#b91c1c;color:#fff;font-weight:bold;text-align:center;padding:8px 10px;border-radius:8px;margin-bottom:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n#stage{position:relative}\n#stage.sol{outline:4px solid #b91c1c;outline-offset:2px}\n#stage.sol::after{content:\"\";position:absolute;inset:0;pointer-events:none;z-index:5;background:url(\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='170'><text x='130' y='90' text-anchor='middle' font-family='Arial' font-size='22' font-weight='bold' fill='%23b91c1c' fill-opacity='.38' transform='rotate(-25 130 85)'>LÖSUNG ANGEZEIGT<\/text><\/svg>\") repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n\n/* Turm von Hanoi (nutzt die .kn-*-Formate nicht mit – hier vollständig eigen) */\n.kn-wrap{width:min(100%,520px);margin:0 auto}\n.kn-info{font-size:.95rem;margin:0 0 6px;color:var(--muted)}\n.kn-info b{color:var(--ink);font-variant-numeric:tabular-nums}\n.kn-svg{display:block;width:100%;height:auto;background:#fff;border:3px solid var(--line);border-radius:8px;user-select:none;touch-action:manipulation}\n.kn-svg .peg{cursor:pointer}\n.kn-svg.small{border-width:1px;width:55%;pointer-events:none}\n.hn-goal{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--muted);font-size:.95rem}\n@media print{.kn-wrap{width:16cm}.kn-info{display:none}}\n\n\n.setup-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:260px;padding:28px 18px;text-align:center;border:2px dashed var(--line,#cbd5e1);border-radius:16px;background:#f8fafc;color:#334155}\n.setup-ph .big{font-size:40px;line-height:1}\n.setup-ph h3{margin:0;font-size:1.15rem}\n.setup-ph p{margin:0;max-width:34ch;font-size:.95rem}\n.setup-ph .chosen{font-weight:700;color:#0f172a}\n.setup-ph .btn{margin-top:6px;min-width:220px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <img class=\"logo\" src=\"data:image/png;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==\" alt=\"Logo\">\n    <div class=\"titlebox\">\n      <h1 id=\"gameTitle\">Rätsel-Trainer<\/h1>\n      <p class=\"sub\" id=\"sub\"><\/p>\n    <\/div>\n  <\/header>\n\n    <div class=\"layout\">\n    <div class=\"left\">\n      <div class=\"printhead\"><span id=\"phTitle\"><\/span> &nbsp;&nbsp; Name: ______________________<\/div>\n      <div class=\"stats\">\n        <span>Niveau: <b id=\"stLevel\">–<\/b><\/span>\n        <span>Zeit: <b id=\"stTime\">00:00<\/b><\/span>\n        <span>Tipps: <b id=\"stTips\">0<\/b><\/span>\n        <span>Prüfungen: <b id=\"stChecks\">0<\/b><\/span>\n        <span>Status: <b id=\"stStatus\">in Arbeit<\/b><\/span>\n      <\/div>\n      <div id=\"solBanner\" class=\"solbanner\" role=\"alert\">⚠ LÖSUNG ANGEZEIGT – dieses Rätsel zählt nicht als selbst gelöst<\/div>\n      <div id=\"stage\"><\/div>\n      <div id=\"pad\"><\/div>\n      <div class=\"msg\" id=\"msg\" role=\"status\" aria-live=\"polite\"><\/div>\n    <\/div>\n\n    <div class=\"right\">\n      <div class=\"card\">\n        <h2 id=\"newTitle\">Neues Rätsel<\/h2>\n        <label class=\"small\" id=\"sizeLbl\">Grösse<\/label>\n        <div class=\"seg\" id=\"sizeSeg\"><\/div>\n        <label class=\"small\">Niveau<\/label>\n        <div class=\"seg\" id=\"lvlSeg\"><\/div>\n        <p class=\"lvldesc\" id=\"lvlDesc\"><\/p>\n        <button class=\"btn primary\" style=\"width:100%\" id=\"btnNew\">Neues Rätsel erstellen<\/button>\n      <\/div>\n\n      <div class=\"card\">\n        <h2>Werkzeuge<\/h2>\n        <div class=\"btns\">\n          <button class=\"btn primary full\" id=\"btnCheck\">✔ Überprüfen<\/button>\n          <button class=\"btn\" id=\"btnNotes\">✎ Notizen: aus<\/button>\n          <button class=\"btn\" id=\"btnHint\">💡 Tipp<\/button>\n          <button class=\"btn\" id=\"btnReset\">↺ Neu beginnen<\/button>\n          <button class=\"btn\" id=\"btnSolve\">Lösung zeigen<\/button>\n          <button class=\"btn full\" id=\"btnPrint\">🖨 Drucken<\/button>\n        <\/div>\n        <label class=\"toggle\"><input type=\"checkbox\" id=\"autoCheck\"> Fehler sofort rot anzeigen<\/label>\n        <div class=\"legend\">\n          <span style=\"background:var(--okbg);color:var(--ok)\">richtig<\/span>\n          <span style=\"background:var(--badbg);color:var(--bad)\">falsch<\/span>\n          <span style=\"background:var(--hintbg);color:var(--hint)\">Tipp<\/span>\n          <span style=\"font-weight:bold\">vorgegeben<\/span>\n        <\/div>\n      <\/div>\n\n      <div class=\"card\">\n        <details>\n          <summary id=\"rulesTitle\">So geht's<\/summary>\n          <ul id=\"rules\"><\/ul>\n        <\/details>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <div class=\"dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"winTitle\">\n    <h3 id=\"winTitle\">🎉 Geschafft!<\/h3>\n    <p id=\"winText\"><\/p>\n    <p style=\"font-size:.9rem;color:var(--muted)\">Tipp: Mach einen Screenshot für dein Lernjournal.<\/p>\n    <button class=\"btn primary\" id=\"btnWinNew\" style=\"margin-top:10px\">Nächstes Rätsel<\/button>\n    <button class=\"btn\" id=\"btnWinClose\" style=\"margin-top:10px\">Schliessen<\/button>\n  <\/div>\n<\/div>\n\n<script>\n'use strict';\n/* =====================================================================\n   KERN – gemeinsam für alle Rätsel (wird in jede Rätsel-Datei eingebaut)\n   Enthält: Hilfsfunktionen und die Basisklasse GridPuzzle.\n   Ein Rätsel erbt von GridPuzzle und meldet sich mit  const GAME = {...}  an.\n   ===================================================================== */\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction randOf(a){return a[Math.floor(Math.random()*a.length)];}\nconst LEVEL_NAMES={sl:'Sehr leicht',l:'Leicht',m:'Mittel',s:'Schwer'};\n\nclass GridPuzzle{\n  constructor(def,size,lvlKey,data){\n    this.def=def; this.n=size; this.lvlKey=lvlKey;\n    this.sol=data.sol; this.cur=data.puz.slice();\n    this.given=data.puz.map(v=>v>0);\n    this.hinted=new Array(size*size).fill(false);\n    this.mark=new Array(size*size).fill(0);          // 0 nichts, 1 richtig, 2 falsch\n    this.sel=-1; this.done=false; this.cells=[]; this.ctx=null;\n  }\n\n  /* --- Hooks, die Unterklassen überschreiben --- */\n  baseClass(i){return 'cell';}\n  extraClass(i){return i===this.sel?' sel':'';}\n  paint(i,d){}                                       // Zelleninhalt zeichnen\n  onCell(i){this.sel=i;this.refresh();}\n  handleKey(e){return false;}\n  buildPad(pad){pad.className='padhelp';pad.textContent=this.def.padHelp||'';}\n  afterSet(i,v){}\n  afterReset(){}\n  afterRefresh(){}\n  cellState(i){const v=this.cur[i];if(!v)return 'empty';return v===this.sol[i]?'right':'wrong';}\n  solved(){return this.cur.every((v,k)=>v===this.sol[k]);}\n  pickHint(){\n    const open=[];\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]&&this.cur[i]!==this.sol[i])open.push(i);\n    if(!open.length)return null;\n    const i=(this.sel>=0&&open.includes(this.sel))?this.sel:randOf(open);\n    return {i,text:'Ein Feld wurde mit einem Tipp ausgefüllt (gelb).'};\n  }\n  revealEmpty(i){this.hinted[i]=true;}\n\n  /* --- gemeinsame Abläufe --- */\n  buildBoard(){\n    const b=document.createElement('div');\n    b.className='board g-'+this.def.id;\n    b.style.setProperty('--n',this.n);\n    b.setAttribute('aria-label',this.def.name+'-Feld');\n    this.cells=[];\n    for(let i=0;i<this.n*this.n;i++){\n      const d=document.createElement('div');\n      d.addEventListener('click',()=>this.onCell(i));\n      b.appendChild(d);this.cells.push(d);\n    }\n    return b;\n  }\n  mount(ctx,stage,pad){\n    this.ctx=ctx;\n    stage.innerHTML='';\n    stage.appendChild(this.buildBoard());\n    pad.className='';pad.removeAttribute('style');pad.innerHTML='';\n    this.buildPad(pad);\n    this.refresh();\n  }\n  refresh(){\n    for(let i=0;i<this.cur.length;i++){\n      const d=this.cells[i];\n      let cls=this.baseClass(i);\n      if(this.given[i])cls+=' given';\n      if(this.hinted[i])cls+=' hint';\n      if(this.mark[i]===1)cls+=' ok';\n      if(this.mark[i]===2)cls+=' bad';\n      cls+=this.extraClass(i);\n      d.className=cls;\n      this.paint(i,d);\n    }\n    this.afterRefresh();\n  }\n  commit(){this.ctx.hideMsg();this.refresh();this.ctx.changed();}\n  setCell(i,v){\n    this.cur[i]=v;this.hinted[i]=false;this.mark[i]=0;\n    if(v&&this.ctx.autoCheck()&&v!==this.sol[i])this.mark[i]=2;\n    this.afterSet(i,v);\n  }\n  editable(){return !this.done&&this.sel>=0&&!this.given[this.sel];}\n  keydown(e){\n    if(this.handleKey(e))return true;\n    const k=e.key,N=this.n;\n    if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))return false;\n    if(this.sel<0)this.sel=0;\n    else{\n      const r=Math.floor(this.sel/N),c=this.sel%N;\n      if(k==='ArrowLeft'&&c>0)this.sel--;\n      if(k==='ArrowRight'&&c<N-1)this.sel++;\n      if(k==='ArrowUp'&&r>0)this.sel-=N;\n      if(k==='ArrowDown'&&r<N-1)this.sel+=N;\n    }\n    this.refresh();return true;\n  }\n  check(){\n    let wrong=0,empty=0,right=0;\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i]||this.hinted[i])continue;\n      const s=this.cellState(i);\n      if(s==='empty'){empty++;this.mark[i]=0;}\n      else if(s==='skip')this.mark[i]=0;\n      else if(s==='right'){this.mark[i]=1;right++;}\n      else{this.mark[i]=2;wrong++;}\n    }\n    this.refresh();\n    return {wrong,empty,right};\n  }\n  hint(){\n    const p=this.pickHint();\n    if(!p)return null;\n    this.cur[p.i]=this.sol[p.i];this.hinted[p.i]=true;this.mark[p.i]=0;\n    this.afterSet(p.i,this.sol[p.i]);\n    this.sel=p.i;this.refresh();\n    return p.text;\n  }\n  reset(){\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]){this.cur[i]=0;this.hinted[i]=false;}\n    this.mark.fill(0);this.sel=-1;this.done=false;\n    this.afterReset();this.refresh();\n  }\n  reveal(){\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i])continue;\n      if(this.cur[i]&&this.cur[i]!==this.sol[i])this.mark[i]=2;\n      else if(this.cur[i]===this.sol[i])this.mark[i]=1;\n      else this.revealEmpty(i);\n      this.cur[i]=this.sol[i];\n    }\n    this.afterReset();   // Notizen o. Ä. löschen\n    this.done=true;this.refresh();\n  }\n  finish(){\n    this.done=true;\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]&&!this.hinted[i])this.mark[i]=1;\n    this.refresh();\n  }\n  applyAutoCheck(on){\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i]||this.hinted[i])continue;\n      if(!on&&this.mark[i]===2)this.mark[i]=0;\n      if(on&&this.cur[i]&&this.cur[i]!==this.sol[i])this.mark[i]=2;\n    }\n    this.refresh();\n  }\n  clearSelection(){this.sel=-1;this.refresh();}\n}\n\n\n/* =====================================================================\n   RÄTSEL-MODUL: Turm von Hanoi\n   Zustand = Stab jeder Scheibe (Index 0 = kleinste Scheibe). Eine Breitensuche vom Ziel aus\n   liefert für jeden Zustand die genaue Zahl der noch nötigen Züge (Tipp, Prüfung, Lösung).\n   ===================================================================== */\n/* ===== LOGIK-START ===== */\nfunction hnTops(s,P){const t=new Array(P).fill(-1);for(let d=s.length-1;d>=0;d--)t[s[d]]=d;return t;}   // oberste (kleinste) Scheibe je Stab\nfunction hnMoves(s,P){\n  const t=hnTops(s,P),res=[];\n  for(let a=0;a<P;a++){\n    const d=t[a];if(d<0)continue;\n    for(let b=0;b<P;b++){\n      if(a===b)continue;\n      if(t[b]>=0&&t[b]<d)continue;          // nur auf eine grössere Scheibe oder einen leeren Stab\n      const next=s.slice();next[d]=b;\n      res.push({disc:d,from:a,to:b,next});\n    }\n  }\n  return res;\n}\nfunction hnDist(goal,P){\n  const d=new Map([[goal.join(''),0]]),q=[goal];\n  for(let h=0;h<q.length;h++){\n    const s=q[h],ds=d.get(s.join(''));\n    for(const m of hnMoves(s,P)){const k=m.next.join('');if(!d.has(k)){d.set(k,ds+1);q.push(m.next);}}\n  }\n  return d;\n}\nfunction hnPlan(s,P,dist){\n  let n=dist.get(s.join(''));if(n===undefined)return null;\n  const path=[];\n  while(n>0){const m=hnMoves(s,P).find(x=>dist.get(x.next.join(''))===n-1);path.push(m);s=m.next;n--;}\n  return path;\n}\n/* Niveaus: sl = klassisch A→C, l = zufälliger Start → C, m = zufälliger Start und Ziel, s = 4 Stäbe */\nfunction hnCreate(n,lvl){\n  const P=lvl==='s'?4:3,all=(k)=>Array(n).fill(k);\n  const rnd=()=>Array.from({length:n},()=>Math.floor(Math.random()*P));\n  let start,goal;\n  if(lvl==='sl'||lvl==='s'){start=all(0);goal=all(P-1);}\n  else if(lvl==='l'){goal=all(P-1);}\n  else goal=rnd();\n  const dist=hnDist(goal,P);\n  if(lvl==='l'||lvl==='m'){\n    const need=Math.round((2**n-1)*(lvl==='l'?.4:.55));\n    let best=null;\n    for(let t=0;t<400;t++){const c=rnd(),dc=dist.get(c.join(''));if(dc>=need){best=c;break;}if(!best||dc>dist.get(best.join('')))best=c;}\n    start=best;\n  }\n  return {P,n,start,goal,dist,optimum:dist.get(start.join(''))};\n}\n/* ===== LOGIK-ENDE ===== */\n\nconst HN_PEG='ABCD';\nclass HanoiPuzzle{\n  constructor(def,size,lvl,spec){\n    this.def=def;this.n=size;this.lvlKey=lvl;this.spec=spec;\n    this.state=spec.start;this.stack=[];this.moves=0;this.done=false;this.sel=-1;\n  }\n  mount(ctx,stage,pad){\n    this.ctx=ctx;this.stage=stage;\n    stage.innerHTML='';pad.className='';pad.removeAttribute('style');pad.innerHTML='';\n    const wrap=document.createElement('div');wrap.className='kn-wrap hn';\n    this.info=document.createElement('div');this.info.className='kn-info';wrap.appendChild(this.info);\n    this.svg=document.createElementNS(SVGNS_H,'svg');this.svg.setAttribute('class','kn-svg');\n    this.svg.setAttribute('aria-label','Turm von Hanoi: '+this.spec.P+' Stäbe, '+this.n+' Scheiben');\n    this.svg.addEventListener('click',e=>{const g=e.target.closest('[data-p]');if(g)this.pegClick(+g.dataset.p);});\n    wrap.appendChild(this.svg);\n    const gl=document.createElement('div');gl.className='hn-goal';gl.innerHTML='<span>Ziel:<\/span>';\n    this.gsvg=document.createElementNS(SVGNS_H,'svg');this.gsvg.setAttribute('class','kn-svg small');\n    gl.appendChild(this.gsvg);wrap.appendChild(gl);\n    stage.appendChild(wrap);\n    pad.className='padhelp';\n    pad.textContent='Stab anklicken (oder Tasten 1–'+this.spec.P+'): erst den Stab, von dem du die oberste Scheibe nimmst, dann den Zielstab. Nie eine grössere auf eine kleinere Scheibe.';\n    this.refresh();\n  }\n  draw(svg,s,sel){\n    const P=this.spec.P,n=this.n,W=130,H=40+(n+1)*22+30,dh=20;\n    svg.setAttribute('viewBox',`0 0 ${P*W} ${H}`);\n    const t=hnTops(s,P);let h='';\n    for(let p=0;p<P;p++){\n      const cx=p*W+W/2,base=H-26;\n      h+=`<g ${svg.classList.contains('small')?'':`data-p=\"${p}\"`} class=\"peg${sel===p?' sel':''}\"><rect x=\"${p*W+4}\" y=\"4\" width=\"${W-8}\" height=\"${H-8}\" rx=\"10\" fill=\"${sel===p?'#f1f7d9':'#fafcf2'}\" stroke=\"${sel===p?'#8aa51f':'#d3dbbd'}\" stroke-width=\"${sel===p?3:1.5}\"/>`;\n      h+=`<rect x=\"${cx-4}\" y=\"${base-(n+1)*22}\" width=\"8\" height=\"${(n+1)*22}\" rx=\"3\" fill=\"#8b6a34\"/><rect x=\"${cx-52}\" y=\"${base}\" width=\"104\" height=\"8\" rx=\"4\" fill=\"#8b6a34\"/>`;\n      h+=`<text x=\"${cx}\" y=\"${H-6}\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\" fill=\"#5f6b76\">${HN_PEG[p]}<\/text>`;\n      let level=0;\n      for(let d=n-1;d>=0;d--){\n        if(s[d]!==p)continue;\n        const w=30+d*(60/Math.max(1,n-1)),y=base-(level+1)*(dh+2)+2,lift=(sel===p&&t[p]===d);\n        h+=`<rect x=\"${cx-w/2}\" y=\"${y-(lift?16:0)}\" width=\"${w}\" height=\"${dh}\" rx=\"6\" fill=\"hsl(${70+d*(170/Math.max(1,n))},55%,${52}%)\" stroke=\"${lift?'#231f20':'#4b5563'}\" stroke-width=\"${lift?3:1.5}\"/>`;\n        h+=`<text x=\"${cx}\" y=\"${y+14-(lift?16:0)}\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"#0b1f2a\">${d+1}<\/text>`;\n        level++;\n      }\n      h+='<\/g>';\n    }\n    svg.innerHTML=h;\n  }\n  refresh(){\n    this.draw(this.svg,this.state,this.sel);this.draw(this.gsvg,this.spec.goal,-1);\n    this.info.innerHTML=`Züge: <b>${this.moves}<\/b>`;\n  }\n  pegClick(p){\n    if(this.done)return;\n    const s=this.state;\n    if(this.sel<0){\n      if(!s.includes(p)){this.ctx.msg('Auf diesem Stab liegt keine Scheibe.','info');return;}\n      this.sel=p;this.ctx.hideMsg();this.refresh();return;\n    }\n    if(this.sel===p){this.sel=-1;this.refresh();return;}\n    const mv=hnMoves(s,this.spec.P).find(m=>m.from===this.sel&&m.to===p);\n    if(!mv){\n      const t=hnTops(s,this.spec.P);\n      this.ctx.msg(`Das geht nicht: Scheibe ${t[this.sel]+1} darf nicht auf die kleinere Scheibe ${t[p]+1} gelegt werden.`,'warn');\n      this.sel=-1;this.refresh();return;\n    }\n    this.sel=-1;this.step(mv);\n  }\n  step(mv){\n    this.stack.push(this.state);this.moves++;this.state=mv.next;\n    this.ctx.hideMsg();this.refresh();this.ctx.changed();\n  }\n  undo(){\n    if(this.done)return;\n    if(!this.stack.length){this.ctx.msg('Es gibt keinen Zug zum Zurücknehmen.','info');return;}\n    this.state=this.stack.pop();this.moves--;this.sel=-1;this.ctx.hideMsg();this.refresh();\n  }\n  plan(){return hnPlan(this.state,this.spec.P,this.spec.dist);}\n  solved(){return this.state.join('')===this.spec.goal.join('');}\n  customCheck(){\n    const r=this.plan().length;\n    return {text:r===1?'Gut so – nur noch 1 Zug bis zum Ziel.':`Gut so – von hier sind es mindestens noch
