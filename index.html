): Probiere hier ${v===1?'X':'O'} aus – nach ein paar Folgerungen entsteht ein Widerspruch. Also gehört ${this.sol[i]===1?'X':'O'} hierhin.`};\n    }\n    const open=[];\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]&&this.cur[i]!==this.sol[i])open.push(i);\n    if(!open.length)return null;\n    return {i:randOf(open),text:'Dieses Feld findet man nur mit längerem Überlegen – hier ein Feld als Tipp (gelb).'};\n  }\n}\n\n/* ----- Anmeldung beim Kern ----- */\nconst GAME={\n    title:'Binoxxo-Trainer',\n    id:'binoxxo', name:'Binoxxo', icon:'✕○', units:['Zeichen','Zeichen'],\n    intro:'Fülle das Feld mit X und O – nach festen Regeln, ganz ohne Raten.',\n    sizes:[6,8,10], size:6, lvl:'sl', tools:{notes:false},\n    padHelp:'Feld antippen: leer → X → O → leer',\n    missing:n=>`Noch ${n} Felder leer.`,\n    levels:{\n      sl:{ratio:.55,logic:1,desc:'Viele Zeichen vorgegeben. «Nie drei gleiche in Folge» und «gleich viele X und O» genügen.'},\n      l: {ratio:.38,logic:1,desc:'Deutlich weniger Zeichen. Es genügen weiterhin die einfachen Regeln – aber du musst Zeilen und Spalten kombinieren.'},\n      m: {ratio:.20,logic:2,min:1,desc:'Wenige Zeichen. Mit den einfachen Regeln allein kommst du nicht ans Ziel: Du brauchst «keine zwei Zeilen (oder Spalten) sind gleich».'},\n      s: {ratio:.10,logic:3,min:2,desc:'Sehr wenige Zeichen. Auch die Regel «keine gleichen Zeilen» reicht nicht: Probiere ein Zeichen aus und prüfe, ob es zum Widerspruch führt.'},\n      ss:{ratio:0,tier:4,desc:'Kaum Zeichen. Du musst eine Annahme machen («Wenn hier X steht, dann …») und einen Widerspruch finden. Zeilen und Spalten gleichzeitig im Blick behalten!'},\n      us:{ratio:0,tier:5,probes:3,sizes:[8,10],desc:'Das Härteste: Selbst nach einer Annahme brauchst du die ganze Zeilenanalyse («Welche Zeilen sind überhaupt noch möglich?»), und das mehrmals. Nur ab 8×8. Gutes Durchhaltevermögen nötig – aber alles ist logisch herleitbar.'}\n    },\n    create(size,lvl){\n      const t0=Date.now();\n      for(let t=0;t<600&&(t<20||Date.now()-t0<12000);t++){const d=bxGenerate(size,this.levels[lvl]);if(d)return new BinoxxoPuzzle(this,size,lvl,d);}\n      return null;\n    },\n    rules(n){\n      return `\n        <li>Fülle alle leeren Felder mit <b>X<\/b> oder <b>O<\/b>.<\/li>\n        <li>Jede Zeile und jede Spalte enthält <b>gleich viele X und O<\/b> (je ${n/2}).<\/li>\n        <li>Nie mehr als <b>zwei gleiche Zeichen<\/b> direkt nebeneinander – waagrecht und senkrecht.<\/li>\n        <li>Keine zwei <b>Zeilen<\/b> und keine zwei <b>Spalten<\/b> sind identisch.<\/li>\n        <li><b>Strategie:<\/b> Zwei gleiche Zeichen nebeneinander → daneben das andere. X_X → dazwischen O. Sind alle X einer Zeile gesetzt, ist der Rest O.<\/li>\n        <li><b>Für Fortgeschrittene:<\/b> Schreibe auf, welche Zeilen (oder Spalten) überhaupt noch möglich sind – ein Feld, das in allen Möglichkeiten gleich ist, steht fest. Bei «Sehr schwer» und «Ultraschwer» hilft zusätzlich: Nimm an, ein Feld sei X (oder O), und prüfe, ob ein Widerspruch entsteht.<\/li>\n        <li><b>Abgeben:<\/b> Fülle das ganze Rätsel aus und drücke dann «Abgeben». Erst jetzt wird korrigiert: Stimmt etwas nicht, werden die falschen Felder rot und du musst ein neues Rätsel beginnen. Prüfe deshalb vor dem Abgeben alles nochmals in Ruhe.<\/li>\n        <li><b>Bedienung:<\/b> Feld antippen: X → O → leer. Tastatur: X, O, Entf, Leertaste, Pfeiltasten.<\/li>`;\n    }\n  };\n\n/* =====================================================================\n   KERN – Oberfläche (gilt für jedes Rätsel)\n   Erwartet eine globale Konstante GAME (vom Rätsel-Modul definiert).\n   Kümmert sich um: Auswahl Grösse/Niveau, Zeit, Statistik, Prüfen, Tipp,\n   Neu beginnen, Lösung zeigen, Drucken, Gewonnen-Dialog, Tastatur,\n   Einbettung in die Plattform (?embed=1).\n   ===================================================================== */\nconst $=id=>document.getElementById(id);\nconst def=GAME;\nconst EMBED=/[?&]embed=1/.test(location.search)||window.name==='raetsel-embed';\nconst STORE_KEY='raetsel-trainer-v1-'+def.id;\nconst settings={size:def.size,lvl:def.lvl};\nlet solUsed=false,puz=null,noteMode=false,tips=0,checks=0,startT=0,timerId=null,genToken=0;\n\n$('autoCheck').checked=false;\nfunction loadStore(){\n  try{\n    const o=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');\n    if(def.sizes.includes(o.size))settings.size=o.size;\n    if(def.levels[o.lvl])settings.lvl=o.lvl;\n  }catch(e){}\n}\nfunction saveStore(){try{localStorage.setItem(STORE_KEY,JSON.stringify(settings));}catch(e){}}\n\n/* Meldungen, Zeit, Statistik */\nfunction showMsg(t,type){const m=$('msg');m.textContent=t;m.className='msg show '+type;}\nfunction hideMsg(){$('msg').className='msg';}\nfunction elapsed(){return Math.floor((Date.now()-startT)/1000);}\nfunction fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}\nfunction startTimer(){stopTimer();startT=Date.now();$('stTime').textContent='00:00';timerId=setInterval(()=>$('stTime').textContent=fmt(elapsed()),1000);}\nfunction stopTimer(){if(timerId)clearInterval(timerId);timerId=null;}\n/* Deutlich sichtbare Kennzeichnung: Wurde die Lösung angezeigt, bleibt das für dieses Rätsel sichtbar\n   (auch nach «Neu beginnen» und nach dem Lösen) – ein Screenshot kann also nicht als eigene Lösung gelten. */\nfunction updateStatus(){\n  const st=$('stStatus'),won=puz&&puz.done&&!solUsed&&puz.solved(),lk=puz&&puz.locked&&!solUsed,rdy=puz&&!puz.done&&!puz.locked&&puz.complete();\n  st.className=(solUsed||lk)?'bad':won?'good':'';\n  st.textContent=solUsed?'⚠ Lösung angezeigt':lk?'✖ nicht richtig gelöst':won?'✔ selbst gelöst':rdy?'bereit zum Abgeben':'in Arbeit';\n  $('solBanner').style.display=solUsed?'block':'none';\n  $('stage').classList.toggle('sol',solUsed);\n}\n/* Tipps je Niveau: einfache Stufen keine, Mittel 1, Schwer 2, Sehr schwer/Ultraschwer 3 */\nconst TIP_LIMIT={sl:0,l:0,m:1,s:2,ss:3,us:3};\nfunction tipLimit(){return TIP_LIMIT[puz?puz.lvlKey:settings.lvl]||0;}\nfunction tipText(l){const n=TIP_LIMIT[l]||0;return n===0?'Keine Tipps möglich.':n===1?'Maximal 1 Tipp.':`Maximal ${n} Tipps.`;}\nfunction updateStats(){$('stTips').textContent=tips+'/'+tipLimit();$('stChecks').textContent=checks;}\n\nconst ctx={\n  autoCheck:()=>$('autoCheck').checked,\n  noteMode:()=>noteMode,\n  hideMsg,\n  changed:()=>{refreshTools();},\n\n  msg:showMsg\n};\n/* Beschriftungen – Rätsel dürfen sie überschreiben (def.sizeLabel, def.tag, def.newLabel …) */\nconst sizeLabel=v=>def.sizeLabel?def.sizeLabel(v):`${v} × ${v}`;\nconst tagOf=(s,l)=>def.tag?def.tag(s,l):`${LEVEL_NAMES[l]} (${s}×${s})`;\n\n/* Auswahl-Leisten */\nfunction makeSeg(el,items,current,onPick){\n  el.innerHTML='';\n  for(const it of items){\n    const b=document.createElement('button');\n    b.textContent=it.label;b.dataset.v=it.v;\n    b.classList.toggle('on',String(it.v)===String(current));\n    b.addEventListener('click',()=>onPick(it.v));\n    el.appendChild(b);\n  }\n}\n/* Manche Niveaus gibt es nur ab einer bestimmten Grösse (levels.xx.sizes) */\nfunction sizesFor(){return def.levels[settings.lvl].sizes||def.sizes;}\nfunction buildOptions(){\n  const allowed=sizesFor();\n  if(!allowed.includes(settings.size))settings.size=allowed.find(n=>n>=settings.size)||allowed[allowed.length-1];\n  makeSeg($('sizeSeg'),allowed.map(n=>({v:n,label:sizeLabel(n)})),settings.size,v=>{settings.size=v;buildOptions();saveStore();updateSetupSel();});\n  makeSeg($('lvlSeg'),Object.keys(def.levels).map(k=>({v:k,label:LEVEL_NAMES[k]})),settings.lvl,v=>{settings.lvl=v;buildOptions();saveStore();updateSetupSel();});\n  const d=def.levels[settings.lvl].desc;\n  $('lvlDesc').textContent=(typeof d==='function'?d(settings.size):d)+' '+tipText(settings.lvl);\n  $('sizeSeg').style.display=def.sizes.length>1?'':'none';\n  $('sizeLbl').style.display=def.sizes.length>1?'':'none';\n}\n\n\n/* Schritt 1: Rahmenbedingungen wählen – Schritt 2: Rätsel erstellen */\nconst TOOL_IDS=['btnCheck','btnNotes','btnHint','btnReset','btnSolve','btnPrint','btnSubmit'];\nfunction toolsDisabled(on){for(const id of TOOL_IDS){const e=$(id);if(e)e.disabled=on;}if($('autoCheck'))$('autoCheck').disabled=on;}\nfunction showSetup(){\n  ++genToken;stopTimer();puz=null;tips=0;checks=0;solUsed=false;\n  const stage=$('stage');stage.classList.remove('loading','sol');\n  stage.innerHTML=`<div class=\"setup-ph\"><div class=\"big\">${def.icon||'🧩'}<\/div><h3>Neues ${def.name} einrichten<\/h3><p>Wähle Grösse und Niveau und erstelle dann das Rätsel.<\/p><p class=\"chosen\" id=\"setupSel\"><\/p><button class=\"btn primary\" id=\"btnSetupGo\">Rätsel erstellen<\/button><\/div>`;\n  $('btnSetupGo').addEventListener('click',startGame);\n  const pad=$('pad');pad.innerHTML='';pad.removeAttribute('style');\n  toolsDisabled(true);hideMsg();\n  $('stLevel').textContent='–';$('stTime').textContent='00:00';$('stStatus').textContent='noch kein Rätsel';$('stStatus').className='';\n  if($('stTips'))$('stTips').textContent='–';\n  if($('solBanner'))$('solBanner').style.display='none';\n  updateSetupSel();\n}\nfunction updateSetupSel(){const e=$('setupSel');if(e)e.textContent=(def.sizes.length>1?sizeLabel(settings.size)+' · ':'')+LEVEL_NAMES[settings.lvl];}\nfunction startGame(){\n  if(puz&&!puz.done&&!puz.locked&&!solUsed&&!confirm('Das laufende Rätsel wird verworfen. Wirklich ein neues Rätsel erstellen?'))return;\n  newGame();\n}\n\n/* Neues Rätsel */\nfunction newGame(){\n  const token=++genToken, stage=$('stage');\n  stopTimer();\n  stage.classList.add('loading');\n  showMsg(`${def.name} wird erstellt …`,'info');\n  setTimeout(()=>{\n    if(token!==genToken)return;\n    let p=null;\n    try{p=def.create(settings.size,settings.lvl);}catch(err){console.error(err);}\n    stage.classList.remove('loading');\n    if(!p){showMsg('Das Rätsel konnte nicht erstellt werden. Bitte nochmals versuchen.','warn');if(!puz)showSetup();return;}\n    puz=p;tips=0;checks=0;solUsed=false;\n    toolsDisabled(false);\n    puz.mount(ctx,stage,$('pad'));setLocked(false);\n    if($('autoCheck').checked)puz.applyAutoCheck(true);\n    $('stLevel').textContent=tagOf(settings.size,settings.lvl);\n    $('phTitle').textContent=`${def.name} · ${tagOf(settings.size,settings.lvl)}`;\n    $('rules').innerHTML=def.rules(settings.size);\n    updateStats();updateStatus();startTimer();hideMsg();\n  },30);\n}\n\n/* Werkzeuge */\nfunction check(){\n  if(!puz||puz.done||puz.locked)return;\n  if(puz.customCheck){checks++;updateStats();const r=puz.customCheck();showMsg(r.text,r.type);return;}\n  checks++;\n  const {wrong,empty,right}=puz.check();\n  updateStats();\n  if(puz.solved()){win();return;}\n  const [one,many]=def.units;\n  if(wrong===0){\n    showMsg(right===0?`Noch nichts eingetragen. ${def.missing(empty)}`\n      :`Super! ${right===1?'Die eingetragene '+one+' ist':'Alle '+right+' eingetragenen '+many+' sind'} richtig. ${def.missing(empty)}`,'good');\n  } else {\n    showMsg(`${wrong} ${wrong===1?one+' ist':many+' sind'} falsch (rot). ${right} richtig. ${def.missing(empty)} Korrigiere die roten Felder.`,'warn');\n  }\n}\nfunction hint(){\n  if(!puz||puz.done||puz.locked||tips>=tipLimit())return;\n  const t=puz.hint();\n  if(t===null)return;\n  tips++;updateStats();showMsg(t,'info');\n  ctx.changed();\n}\nfunction resetGame(){\n  if(!puz||puz.locked||!confirm('Alle eigenen Eingaben löschen und neu beginnen? Bereits benutzte Tipps bleiben verbraucht.'))return;\n  puz.reset();startTimer();hideMsg();updateStats();refreshTools();\n}\nfunction showSolution(){\n  if(!puz)return;\n  if(!confirm(`Wirklich die ganze Lösung anzeigen? Das ${def.name}-Rätsel gilt dann als nicht gelöst.`))return;\n  solUsed=true;puz.reveal();stopTimer();refreshTools();\n  showMsg('Lösung angezeigt: grün = du hattest es richtig, rot = war falsch, gelb = war leer.','info');\n}\n/* Werkzeuge sperren/freigeben (nach einem vollständig falsch gelösten Rätsel bleibt nur «Lösung zeigen» / «Neues Rätsel») */\nfunction setLocked(on){\n  for(const id of ['btnCheck','btnHint','btnReset','btnNotes','autoCheck'])$(id).disabled=on;\n  $('autoCheck').parentElement.classList.toggle('off',on);\n  document.querySelectorAll('#pad button').forEach(b=>b.disabled=on);\n  refreshTools();\n}\n/* «Abgeben» ist erst möglich, wenn alles ausgefüllt ist. Dann sind Überprüfen und Tipp gesperrt – sonst könnte man vor dem Abgeben noch Fehler suchen. */\nfunction refreshTools(){\n  if(!puz)return;\n  const over=puz.done||puz.locked,comp=!over&&puz.complete();\n  $('btnSubmit').disabled=!comp;\n  $('btnSubmit').title=comp?'':'Erst alle Felder ausfüllen';\n  const lim=tipLimit(),left=lim-tips;\n  $('btnHint').textContent=lim?`💡 Tipp (${left} übrig)`:'💡 Keine Tipps';\n  if(!puz.locked){$('btnCheck').disabled=true;$('btnHint').disabled=over||comp||left<=0;}\n  updateStatus();\n  if(comp&&!$('msg').classList.contains('show'))showMsg('Alles ausgefüllt. Prüfe nochmals in Ruhe – mit «Abgeben» gibst du das Rätsel ab. Erst dann wird korrigiert.','info');\n}\n/* Abgeben: erst jetzt wird ausgewertet */\nfunction submitPuz(){\n  if(!puz||puz.done||puz.locked||!puz.complete())return;\n  if(puz.solved())win();else fail();\n}\n/* Rätsel ist vollständig ausgefüllt, aber nicht richtig: Fehler rot, keine Korrektur mehr möglich */\nfunction fail(){\n  puz.lock();stopTimer();setLocked(true);\n  const bad=puz.mark.filter(m=>m===2).length;\n  $('winTitle').textContent='✖ Leider nicht richtig';\n  $('winText').innerHTML=`${def.name} · Niveau: <b>${tagOf(settings.size,settings.lvl)}<\/b><br>Zeit: <b>${fmt(elapsed())}<\/b> · Tipps: <b>${tips} von ${tipLimit()}<\/b><br>Du hast das Rätsel abgegeben, aber <b>${bad===1?'ein Feld ist':bad+' Felder sind'} falsch<\/b> (rot markiert).<br>Abgegebene Rätsel können nicht mehr korrigiert werden – starte ein <b>neues Rätsel<\/b> und versuche es nochmals.`;\n  $('winTip').style.display='none';\n  $('btnWinNew').textContent='Neues Rätsel';$('btnWinClose').textContent='Fehler ansehen';\n  $('overlay').classList.add('show');\n  showMsg('Abgegeben – nicht richtig gelöst: Die roten Felder sind falsch. Korrigieren ist nicht mehr möglich – starte ein neues Rätsel.','warn');\n}\nfunction win(){\n  $('winTip').style.display='';$('btnWinNew').textContent='Nächstes Rätsel';$('btnWinClose').textContent='Schliessen';\n  puz.finish();stopTimer();\n  $('winText').innerHTML=`${def.name} · Niveau: <b>${tagOf(settings.size,settings.lvl)}<\/b><br>Zeit: <b>${fmt(elapsed())}<\/b><br>${puz.winInfo?puz.winInfo()+'<br>':''}Tipps: <b>${tips} von ${tipLimit()}<\/b>`;\n  if(solUsed){$('winTitle').textContent='⚠ Gelöst – aber mit Lösung';$('winText').innerHTML+='<br><b style=\"color:var(--bad)\">Die Lösung wurde angezeigt – das zählt nicht als selbst gelöst.<\/b>';}\n  else $('winTitle').textContent='🎉 Geschafft!';\n  refreshTools();\n  $('overlay').classList.add('show');\n  showMsg(solUsed?'Gelöst – aber die Lösung wurde vorher angezeigt.':`Gelöst in ${fmt(elapsed())} mit ${tips} Tipps.`,solUsed?'warn':'good');\n}\nfunction toggleNotes(){\n  if(def.tools.undo){if(puz)puz.undo();return;}\n  if(!def.tools.notes)return;\n  noteMode=!noteMode;\n  $('btnNotes').textContent=(def.tools.notesLabel||'✎ Notizen')+': '+(noteMode?'ein':'aus');\n  $('btnNotes').classList.toggle('on',noteMode);\n}\n\n/* Ereignisse */\n$('btnNew').addEventListener('click',startGame);\n$('btnCheck').addEventListener('click',check);\n$('btnSubmit').addEventListener('click',submitPuz);\n$('btnHint').addEventListener('click',hint);\n$('btnReset').addEventListener('click',resetGame);\n$('btnSolve').addEventListener('click',showSolution);\n$('btnPrint').addEventListener('click',()=>{if(puz){puz.clearSelection();}window.print();});\n$('btnNotes').addEventListener('click',toggleNotes);\n$('btnWinNew').addEventListener('click',()=>{$('overlay').classList.remove('show');showSetup();});\n$('btnWinClose').addEventListener('click',()=>$('overlay').classList.remove('show'));\n$('autoCheck').addEventListener('change',()=>{if(puz)puz.applyAutoCheck($('autoCheck').checked);});\n\ndocument.addEventListener('keydown',e=>{\n  if($('overlay').classList.contains('show')||!puz)return;\n  if(e.ctrlKey||e.metaKey||e.altKey)return;\n  const t=e.target;\n  if(e.key===' '&&t&&t.closest&&t.closest('button,input,summary,select,textarea'))return;   // Leertaste bedient dann das Bedienelement\n  if((e.key==='n'||e.key==='N')&&def.tools.notes&&!def.tools.undo){toggleNotes();return;}\n  if((e.key==='z'||e.key==='Z'||e.key==='Backspace')&&def.tools.undo&&puz.undo){puz.undo();e.preventDefault();return;}\n  if(puz.keydown(e))e.preventDefault();\n});\n\n/* Einbettung: Höhe an die Plattform melden */\nfunction setupEmbed(){\n  document.body.classList.add('embed');\n  if(window.parent===window)return;\n  const send=()=>window.parent.postMessage({type:'raetsel-height',id:def.id,h:Math.ceil(document.body.getBoundingClientRect().height)},'*');\n  if(window.ResizeObserver)new ResizeObserver(send).observe(document.body);\n  window.addEventListener('load',send);\n  send();\n}\n\n/* Start */\n(function init(){\n  loadStore();\n  $('gameTitle').textContent=def.title;\n  $('sub').textContent=def.intro;\n  $('newTitle').textContent=def.newLabel||'Neues '+def.name;\n  $('btnNew').textContent=def.newLabel?def.newLabel+' starten':'Neues '+def.name+' erstellen';\n  $('sizeLbl').textContent=def.sizeTitle||'Grösse';\n  if(def.tools.undo)$('btnNotes').textContent='↶ Zug zurück';\n  else if(def.tools.notesLabel)$('btnNotes').textContent=def.tools.notesLabel+': aus';\n  if(def.tools.auto===false)$('autoCheck').parentElement.style.display='none';\n  if(def.tools.legend===false)document.querySelector('.legend').style.display='none';\n  $('rulesTitle').textContent='So geht '+def.name;\n  $('btnNotes').style.display=(def.tools.notes||def.tools.undo)?'':'none';\n  $('btnHint').classList.toggle('full',!(def.tools.notes||def.tools.undo));\n  document.title=def.title+' – Rätsel-Trainer';\n  if(EMBED)setupEmbed();\n  buildOptions();\n  showSetup();\n})();\n\n<\/script>\n<\/body>\n<\/html>\n"
 },
 {
  "id": "bimaru",
  "name": "Bimaru",
  "icon": "🚢",
  "intro": "Bimaru (Schiffe versenken): Finde die versteckte Flotte – mit den Zahlen am Rand und ein bisschen Köpfchen.",
  "html": "<!doctype html>\n<html lang=\"de-CH\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Bimaru – Rätsel-Trainer<\/title>\n<style>\n:root{\n  /* Farben nach flade.ch: Weiss als Grund, Anthrazit für Text, Limettengrün #aecb35 als Akzent */\n  --bg:#ffffff; --card:#f8faf0; --ink:#231f20; --muted:#5f6657;\n  --line:#d3dbbd; --thick:#231f20; --given:#231f20; --user:#46640f;\n  --sel:#dbe9a0; --peer:#f4f8e2; --same:#e7f0bd;\n  --ok:#15803d; --okbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2;\n  --hint:#92400e; --hintbg:#fef3c7;\n  --accent:#aecb35; --accent-bg:#f1f7d9; --accent-dark:#5d7410; --lime:#aecb35;\n  --water:#e6f1f5;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,\"Segoe UI\",Arial,sans-serif;}\n.wrap{max-width:980px;margin:0 auto;padding:16px;}\n\n/* Kopf */\n.top{display:flex;align-items:center;gap:16px;margin:2px 0 14px;padding-bottom:12px;border-bottom:3px solid var(--lime)}\n.logo{height:58px;width:auto;display:block;flex:none}\n.titlebox h1{margin:0;font-size:1.7rem;line-height:1.15}\n.sub{color:var(--muted);margin:2px 0 0}\n/* Layout */\n.layout{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}\n.left{flex:1 1 420px;min-width:280px}\n.right{flex:0 1 300px;min-width:260px;display:flex;flex-direction:column;gap:12px}\n.card{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(35,31,32,.06)}\n.card h2{font-size:1.05rem;margin:0 0 8px}\nlabel.small{font-size:.9rem;color:var(--muted);display:block;margin-bottom:4px}\n.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}\n.seg button{flex:1 1 auto;border:2px solid var(--line);background:#fff;border-radius:8px;padding:7px 8px;font:inherit;cursor:pointer;color:var(--ink)}\n.seg button.on{border-color:var(--accent);background:var(--accent-bg);font-weight:bold}\n.lvldesc{font-size:.9rem;color:var(--muted);min-height:2.4em;margin:0 0 10px}\n.btn{border:none;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer;background:#e5e7eb;color:var(--ink)}\n.btn:hover{filter:brightness(.95)}\n.btn.primary{background:var(--accent);color:var(--ink);font-weight:bold}\n.btn.primary:hover{background:#9db92d}\n.btn.on{background:var(--accent-dark);color:#fff}\n.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.btns .full{grid-column:1/-1}\n.stats{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}\n.stats b{font-variant-numeric:tabular-nums}\nbutton:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}\n\n/* Spielfeld (gemeinsam) */\n.board{\n  width:min(100%,520px); aspect-ratio:1/1; margin:0 auto;\n  display:grid; grid-template-columns:repeat(var(--cols,var(--n)),1fr); grid-template-rows:repeat(var(--cols,var(--n)),1fr);\n  border:3px solid var(--thick); background:#fff; user-select:none; touch-action:manipulation;\n}\n.cell{\n  display:flex;align-items:center;justify-content:center;position:relative;\n  border-right:1px solid var(--line);border-bottom:1px solid var(--line);\n  font-size:calc(min(100vw - 40px,520px) / var(--n) * .55);\n  cursor:pointer;color:var(--user);\n}\n.cell.tr{border-right:3px solid var(--thick)}\n.cell.tb{border-bottom:3px solid var(--thick)}\n.cell.lastc{border-right:none}\n.cell.lastr{border-bottom:none}\n.cell.water{background:var(--water)}\n.cell.peer{background:var(--peer)}\n.cell.same{background:var(--same)}\n.cell.sel{background:var(--sel)}\n.cell.given{color:var(--given);font-weight:bold}\n.cell.hint{color:var(--hint);background:var(--hintbg)}\n.cell.ok{color:var(--ok);background:var(--okbg)}\n.cell.bad{color:var(--bad);background:var(--badbg)}\n.cell.sel.ok,.cell.sel.bad,.cell.sel.hint{outline:3px solid var(--accent);outline-offset:-3px}\n.cell.water.ok,.cell.water.bad,.cell.water.hint{outline:0}\n.notes{position:absolute;inset:2px;display:grid;font-size:calc(min(100vw - 40px,520px) / var(--n) * .22);color:#64748b;line-height:1;font-weight:normal}\n.notes span{display:flex;align-items:center;justify-content:center}\n\n/* Eingabe */\n.pad{display:grid;gap:6px;margin:12px auto 0;width:min(100%,520px)}\n.pad button{font:inherit;font-size:1.4rem;padding:10px 0;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}\n.pad button.del{font-size:1rem}\n.pad button.done{opacity:.35}\n.padhelp{margin:12px auto 0;width:min(100%,520px);font-size:.95rem;color:var(--muted);text-align:center}\n.msg{margin:12px auto 0;width:min(100%,520px);padding:10px 12px;border-radius:8px;display:none;font-size:1rem}\n.msg.show{display:block}\n.msg.info{background:#e0f2fe;color:#075985}\n.msg.good{background:var(--okbg);color:#14532d}\n.msg.warn{background:var(--badbg);color:#7f1d1d}\n.toggle{display:flex;gap:8px;align-items:center;font-size:.95rem;margin-top:6px;cursor:pointer}\ndetails summary{cursor:pointer;font-weight:bold}\ndetails ul{padding-left:18px;margin:8px 0 0}\ndetails li{margin-bottom:4px}\n.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:.85rem;margin-top:8px}\n.legend span{padding:2px 6px;border-radius:5px}\n.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}\n.overlay.show{display:flex}\n.dialog{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%;text-align:center}\n.dialog h3{margin:0 0 8px;font-size:1.5rem}\n.dialog p{margin:6px 0}\n.loading{opacity:.4;pointer-events:none}\n.printhead{display:none}\n.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}\n.pad button:disabled{opacity:.35;cursor:not-allowed}\n.toggle.off{opacity:.5;cursor:not-allowed}\n\n@media (max-width:520px){\n  .logo{height:46px}\n  .titlebox h1{font-size:1.4rem}\n}\n@media print{\n  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  body{background:#fff}\n  .right,.pad,.padhelp,.msg,.sub,.titlebox,.stats,.overlay{display:none!important}\n  .top{margin:0 0 8px}\n  .logo{height:1.3cm}\n  .printhead{display:block;margin-bottom:12px;font-size:1.2rem}\n  .board{width:16cm}\n  .cell{font-size:calc(16cm / var(--n) * .55)}\n  .cell.peer,.cell.same,.cell.sel{background:#fff}\n}\n\n/* Eingebettet in die Plattform: Kopf wird von der Plattform gezeigt */\nbody.embed .top{display:none}\nbody.embed .wrap{padding-top:0}\n@media print{body.embed .top{display:flex}}\n\n/* Kennzeichnung «Lösung angezeigt» */\n#stStatus.bad{color:var(--bad)}\n#stStatus.good{color:var(--ok)}\n.solbanner{display:none;background:#b91c1c;color:#fff;font-weight:bold;text-align:center;padding:8px 10px;border-radius:8px;margin-bottom:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n#stage{position:relative}\n#stage.sol{outline:4px solid #b91c1c;outline-offset:2px}\n#stage.sol::after{content:\"\";position:absolute;inset:0;pointer-events:none;z-index:5;background:url(\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='170'><text x='130' y='90' text-anchor='middle' font-family='Arial' font-size='22' font-weight='bold' fill='%23b91c1c' fill-opacity='.38' transform='rotate(-25 130 85)'>LÖSUNG ANGEZEIGT<\/text><\/svg>\") repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n\n/* Schiffe versenken */\n.shwrap{width:min(100%,520px);margin:0 auto;display:grid;grid-template-columns:calc(100% / var(--m)) 1fr}\n.shwrap .board{width:100%}\n.collabels{display:grid;grid-template-columns:repeat(var(--cols),1fr)}\n.rowlabels{display:grid;grid-template-rows:repeat(var(--cols),1fr)}\n.lbl{display:flex;align-items:center;justify-content:center;font-weight:bold;color:var(--muted);font-variant-numeric:tabular-nums;font-size:calc(min(100vw - 40px,520px) / var(--n) * .5)}\n.collabels .lbl{aspect-ratio:1/1}\n.lbl.full{color:var(--ok)}\n.lbl.over{color:var(--bad)}\n.cell.sh::before{\n  content:\"\";position:absolute;background:currentColor;\n  top:var(--t,14%);right:var(--r,14%);bottom:var(--b,14%);left:var(--l,14%);\n  border-radius:var(--tl,50%) var(--tr,50%) var(--br,50%) var(--bl,50%);\n}\n.cell.water::after{content:\"\";width:22%;height:22%;border-radius:50%;background:currentColor;opacity:.5}\n.fleet{width:min(100%,520px);margin:12px auto 0;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.92rem;color:var(--muted)}\n.fleet .grp{display:inline-flex;align-items:center;gap:6px}\n.fleet .ship{display:inline-flex;gap:2px}\n.fleet .ship i{width:16px;height:16px;background:var(--accent);border-radius:3px}\n.fleet .ship i:first-child{border-top-left-radius:8px;border-bottom-left-radius:8px}\n.fleet .ship i:last-child{border-top-right-radius:8px;border-bottom-right-radius:8px}\n\n@media print{\n  .shwrap{width:16cm}\n  .shwrap .board{width:100%}\n  .lbl{font-size:calc(16cm / var(--n) * .5)}\n  .fleet{width:16cm}\n}\n\n\n.setup-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:260px;padding:28px 18px;text-align:center;border:2px dashed var(--line,#cbd5e1);border-radius:16px;background:#f8fafc;color:#334155}\n.setup-ph .big{font-size:40px;line-height:1}\n.setup-ph h3{margin:0;font-size:1.15rem}\n.setup-ph p{margin:0;max-width:34ch;font-size:.95rem}\n.setup-ph .chosen{font-weight:700;color:#0f172a}\n.setup-ph .btn{margin-top:6px;min-width:220px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <img class=\"logo\" src=\"data:image/png;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==\" alt=\"Logo\">\n    <div class=\"titlebox\">\n      <h1 id=\"gameTitle\">Rätsel-Trainer<\/h1>\n      <p class=\"sub\" id=\"sub\"><\/p>\n    <\/div>\n  <\/header>\n\n    <div class=\"layout\">\n    <div class=\"left\">\n      <div class=\"printhead\"><span id=\"phTitle\"><\/span> &nbsp;&nbsp; Name: ______________________<\/div>\n      <div class=\"stats\">\n        <span>Niveau: <b id=\"stLevel\">–<\/b><\/span>\n        <span>Zeit: <b id=\"stTime\">00:00<\/b><\/span>\n        <span>Tipps: <b id=\"stTips\">0<\/b><\/span>\n        <span style=\"display:none\">Prüfungen: <b id=\"stChecks\">0<\/b><\/span>\n        <span>Status: <b id=\"stStatus\">in Arbeit<\/b><\/span>\n      <\/div>\n      <div id=\"solBanner\" class=\"solbanner\" role=\"alert\">⚠ LÖSUNG ANGEZEIGT – dieses Rätsel zählt nicht als selbst gelöst<\/div>\n      <div id=\"stage\"><\/div>\n      <div id=\"pad\"><\/div>\n      <div class=\"msg\" id=\"msg\" role=\"status\" aria-live=\"polite\"><\/div>\n    <\/div>\n\n    <div class=\"right\">\n      <div class=\"card\">\n        <h2 id=\"newTitle\">Neues Rätsel<\/h2>\n        <label class=\"small\" id=\"sizeLbl\">Grösse<\/label>\n        <div class=\"seg\" id=\"sizeSeg\"><\/div>\n        <label class=\"small\">Niveau<\/label>\n        <div class=\"seg\" id=\"lvlSeg\"><\/div>\n        <p class=\"lvldesc\" id=\"lvlDesc\"><\/p>\n        <button class=\"btn primary\" style=\"width:100%\" id=\"btnNew\">Neues Rätsel erstellen<\/button>\n      <\/div>\n\n      <div class=\"card\">\n        <h2>Werkzeuge<\/h2>\n        <div class=\"btns\">\n          <button class=\"btn primary full\" id=\"btnSubmit\" disabled title=\"Erst alle Felder ausfüllen\">📥 Abgeben<\/button>\n          <button class=\"btn full\" id=\"btnCheck\" style=\"display:none\">✔ Überprüfen<\/button>\n          <button class=\"btn\" id=\"btnNotes\">✎ Notizen: aus<\/button>\n          <button class=\"btn\" id=\"btnHint\">💡 Tipp<\/button>\n          <button class=\"btn\" id=\"btnReset\">↺ Neu beginnen<\/button>\n          <button class=\"btn\" id=\"btnSolve\">Lösung zeigen<\/button>\n          <button class=\"btn full\" id=\"btnPrint\">🖨 Drucken<\/button>\n        <\/div>\n        <label class=\"toggle\" style=\"display:none\"><input type=\"checkbox\" id=\"autoCheck\"> Fehler sofort rot anzeigen<\/label>\n        <div class=\"legend\">\n          <span style=\"background:var(--okbg);color:var(--ok)\">richtig<\/span>\n          <span style=\"background:var(--badbg);color:var(--bad)\">falsch<\/span>\n          <span style=\"background:var(--hintbg);color:var(--hint)\">Tipp<\/span>\n          <span style=\"font-weight:bold\">vorgegeben<\/span>\n        <\/div>\n      <\/div>\n\n      <div class=\"card\">\n        <details>\n          <summary id=\"rulesTitle\">So geht's<\/summary>\n          <ul id=\"rules\"><\/ul>\n        <\/details>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <div class=\"dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"winTitle\">\n    <h3 id=\"winTitle\">🎉 Geschafft!<\/h3>\n    <p id=\"winText\"><\/p>\n    <p id=\"winTip\" style=\"font-size:.9rem;color:var(--muted)\">Tipp: Mach einen Screenshot für dein Lernjournal.<\/p>\n    <button class=\"btn primary\" id=\"btnWinNew\" style=\"margin-top:10px\">Nächstes Rätsel<\/button>\n    <button class=\"btn\" id=\"btnWinClose\" style=\"margin-top:10px\">Schliessen<\/button>\n  <\/div>\n<\/div>\n\n<script>\n'use strict';\n/* =====================================================================\n   KERN – gemeinsam für alle Rätsel (wird in jede Rätsel-Datei eingebaut)\n   Enthält: Hilfsfunktionen und die Basisklasse GridPuzzle.\n   Ein Rätsel erbt von GridPuzzle und meldet sich mit  const GAME = {...}  an.\n   ===================================================================== */\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction randOf(a){return a[Math.floor(Math.random()*a.length)];}\nconst LEVEL_NAMES={sl:'Sehr leicht',l:'Leicht',m:'Mittel',s:'Schwer',ss:'Sehr schwer',us:'Ultraschwer'};\n\nclass GridPuzzle{\n  constructor(def,size,lvlKey,data){\n    this.def=def; this.n=size; this.lvlKey=lvlKey;\n    this.sol=data.sol; this.cur=data.puz.slice();\n    this.given=data.puz.map(v=>v>0);\n    this.hinted=new Array(size*size).fill(false);\n    this.mark=new Array(size*size).fill(0);          // 0 nichts, 1 richtig, 2 falsch\n    this.sel=-1; this.done=false; this.locked=false; this.cells=[]; this.ctx=null;\n  }\n\n  /* --- Hooks, die Unterklassen überschreiben --- */\n  baseClass(i){return 'cell';}\n  extraClass(i){return i===this.sel?' sel':'';}\n  paint(i,d){}                                       // Zelleninhalt zeichnen\n  onCell(i){this.sel=i;this.refresh();}\n  handleKey(e){return false;}\n  buildPad(pad){pad.className='padhelp';pad.textContent=this.def.padHelp||'';}\n  afterSet(i,v){}\n  afterReset(){}\n  afterRefresh(){}\n  cellState(i){const v=this.cur[i];if(!v)return 'empty';return v===this.sol[i]?'right':'wrong';}\n  solved(){return this.cur.every((v,k)=>v===this.sol[k]);}\n  pickHint(){\n    const open=[];\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]&&this.cur[i]!==this.sol[i])open.push(i);\n    if(!open.length)return null;\n    const i=(this.sel>=0&&open.includes(this.sel))?this.sel:randOf(open);\n    return {i,text:'Ein Feld wurde mit einem Tipp ausgefüllt (gelb).'};\n  }\n  revealEmpty(i){this.hinted[i]=true;}\n\n  /* --- gemeinsame Abläufe --- */\n  buildBoard(){\n    const b=document.createElement('div');\n    b.className='board g-'+this.def.id;\n    b.style.setProperty('--n',this.n);\n    b.setAttribute('aria-label',this.def.name+'-Feld');\n    this.cells=[];\n    for(let i=0;i<this.n*this.n;i++){\n      const d=document.createElement('div');\n      d.addEventListener('click',()=>this.onCell(i));\n      b.appendChild(d);this.cells.push(d);\n    }\n    return b;\n  }\n  mount(ctx,stage,pad){\n    this.ctx=ctx;\n    stage.innerHTML='';\n    stage.appendChild(this.buildBoard());\n    pad.className='';pad.removeAttribute('style');pad.innerHTML='';\n    this.buildPad(pad);\n    this.refresh();\n  }\n  refresh(){\n    for(let i=0;i<this.cur.length;i++){\n      const d=this.cells[i];\n      let cls=this.baseClass(i);\n      if(this.given[i])cls+=' given';\n      if(this.hinted[i])cls+=' hint';\n      if(this.mark[i]===1)cls+=' ok';\n      if(this.mark[i]===2)cls+=' bad';\n      cls+=this.extraClass(i);\n      d.className=cls;\n      this.paint(i,d);\n    }\n    this.afterRefresh();\n  }\n  commit(){this.ctx.hideMsg();this.refresh();this.ctx.changed();}\n  setCell(i,v){\n    this.cur[i]=v;this.hinted[i]=false;this.mark[i]=0;\n    if(v&&this.ctx.autoCheck()&&v!==this.sol[i])this.mark[i]=2;\n    this.afterSet(i,v);\n  }\n  editable(){return !this.done&&!this.locked&&this.sel>=0&&!this.given[this.sel];}\n  keydown(e){\n    if(this.handleKey(e))return true;\n    const k=e.key,N=this.n;\n    if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))return false;\n    if(this.sel<0)this.sel=0;\n    else{\n      const r=Math.floor(this.sel/N),c=this.sel%N;\n      if(k==='ArrowLeft'&&c>0)this.sel--;\n      if(k==='ArrowRight'&&c<N-1)this.sel++;\n      if(k==='ArrowUp'&&r>0)this.sel-=N;\n      if(k==='ArrowDown'&&r<N-1)this.sel+=N;\n    }\n    this.refresh();return true;\n  }\n  check(){\n    let wrong=0,empty=0,right=0;\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i]||this.hinted[i])continue;\n      const s=this.cellState(i);\n      if(s==='empty'){empty++;this.mark[i]=0;}\n      else if(s==='skip')this.mark[i]=0;\n      else if(s==='right'){this.mark[i]=1;right++;}\n      else{this.mark[i]=2;wrong++;}\n    }\n    this.refresh();\n    return {wrong,empty,right};\n  }\n  hint(){\n    const p=this.pickHint();\n    if(!p)return null;\n    this.cur[p.i]=this.sol[p.i];this.hinted[p.i]=true;this.mark[p.i]=0;\n    this.afterSet(p.i,this.sol[p.i]);\n    this.sel=p.i;this.refresh();\n    return p.text;\n  }\n  reset(){\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]){this.cur[i]=0;this.hinted[i]=false;}\n    this.mark.fill(0);this.sel=-1;this.done=false;\n    this.afterReset();this.refresh();\n  }\n  reveal(){\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i])continue;\n      if(this.cur[i]&&this.cur[i]!==this.sol[i])this.mark[i]=2;\n      else if(this.cur[i]===this.sol[i])this.mark[i]=1;\n      else this.revealEmpty(i);\n      this.cur[i]=this.sol[i];\n    }\n    this.afterReset();   // Notizen o. Ä. löschen\n    this.done=true;this.refresh();\n  }\n  finish(){\n    this.done=true;\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]&&!this.hinted[i])this.mark[i]=1;\n    this.refresh();\n  }\n  applyAutoCheck(on){\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i]||this.hinted[i])continue;\n      if(!on&&this.mark[i]===2)this.mark[i]=0;\n      if(on&&this.cur[i]&&this.cur[i]!==this.sol[i])this.mark[i]=2;\n    }\n    this.refresh();\n  }\n  clearSelection(){this.sel=-1;this.refresh();}\n  /* Alle Felder ausgefüllt? (Rätsel mit Wasser/Kreuzen überschreiben das.) */\n  complete(){return this.cur.every(v=>v>0);}\n  /* Vollständig, aber falsch: Fehler rot zeigen und das Rätsel sperren – es gibt kein Korrigieren mehr. */\n  lock(){\n    this.locked=true;this.drag=null;\n    this.check();                                         // markiert die falschen Felder rot\n    for(let i=0;i<this.mark.length;i++)if(this.mark[i]===1)this.mark[i]=0;\n    this.sel=-1;this.refresh();\n  }\n}\n\n\n/* =====================================================================\n   RÄTSEL-MODUL: Bimaru (Schiffe versenken)\n   ===================================================================== */\n/* ===== LOGIK-START ===== */\n/* ---------- Schiffe versenken (0 = leer, 1 = Wasser, 2 = Schiff) ---------- */\nconst SH_FLEET={6:[3,2,2,1,1,1],8:[4,3,3,2,2,1,1,1],10:[4,3,3,2,2,2,1,1,1,1]};\n\n/* Flotte zufällig platzieren: gerade Schiffe, keine Berührung (auch nicht diagonal). */\nfunction shPlace(N,fleet){\n  const g=new Array(N*N).fill(0);\n  const ships=fleet.slice().sort((a,b)=>b-a);\n  const free=(r,c)=>{\n    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){\n      const rr=r+dr,cc=c+dc;\n      if(rr>=0&&cc>=0&&rr<N&&cc<N&&g[rr*N+cc])return false;\n    }\n    return true;\n  };\n  function rec(k){\n    if(k===ships.length)return true;\n    const L=ships[k], opts=[];\n    for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const [dr,dc] of [[0,1],[1,0]]){\n      const cells=[];let ok=true;\n      for(let t=0;t<L;t++){\n        const rr=r+dr*t,cc=c+dc*t;\n        if(rr>=N||cc>=N||!free(rr,cc)){ok=false;break;}\n        cells.push(rr*N+cc);\n      }\n      if(ok)opts.push(cells);\n    }\n    shuffle(opts);\n    for(const cells of opts){\n      for(const i of cells)g[i]=2;\n      if(rec(k+1))return true;\n      for(const i of cells)g[i]=0;\n    }\n    return false;\n  }\n  return rec(0)?g.map(v=>v?2:1):null;\n}\nfunction shRunInfo(m,N){\n  let singles=0;const runs=[];let c=0;\n  while(c<N){\n    if((m>>c)&1){\n      let e=c;while(e+1<N&&((m>>(e+1))&1))e++;\n      const len=e-c+1;\n      if(len===1)singles|=1<<c; else runs.push(len);\n      c=e+1;\n    } else c++;\n  }\n  return {runs,singles};\n}\n/* Zählt Lösungen (bis limit). Zeilenweise Suche mit Bitmasken.\n   Wird das Suchbudget überschritten, gilt das Rätsel vorsichtshalber als mehrdeutig. */\nfunction shCount(N,fleet,rs,cs,puz,limit,budget){\n  budget=budget||400000;\n  const maxLen=Math.max(...fleet), need=new Array(maxLen+1).fill(0);\n  fleet.forEach(L=>need[L]++);\n  const full=(1<<N)-1, infoCache=new Map();\n  const info=m=>{let x=infoCache.get(m);if(!x){x=shRunInfo(m,N);infoCache.set(m,x);}return x;};\n  const pop=m=>{let c=0;while(m){m&=m-1;c++;}return c;};\n  const lists=[];\n  for(let r=0;r<N;r++){\n    let must=0,not=0;\n    for(let c=0;c<N;c++){const v=puz[r*N+c];if(v===2)must|=1<<c;else if(v===1)not|=1<<c;}\n    const list=[];\n    for(let m=0;m<=full;m++){\n      if(pop(m)!==rs[r]||(m&must)!==must||(m&not))continue;\n      if(info(m).runs.some(L=>L>maxLen))continue;\n      list.push(m);\n    }\n    if(!list.length)return 0;\n    lists.push(list);\n  }\n  let nodes=0,over=false;\n  function rec(r,prev,prevS,v,cnt,colRem){\n    if(over)return 0;\n    if(++nodes>budget){over=true;return limit;}\n    if(r===N){\n      const c2=cnt.slice();\n      for(let c=0;c<N;c++)if(((prev>>c)&1)&&((prevS>>c)&1))c2[v[c]]++;\n      for(let L=1;L<=maxLen;L++)if(c2[L]!==need[L])return 0;\n      for(let c=0;c<N;c++)if(colRem[c]!==0)return 0;\n      return 1;\n    }\n    let total=0;\n    const rowsLeft=N-1-r;\n    for(const m of lists[r]){\n      if(m&((prev<<1)|(prev>>1)))continue;           // diagonal berührt\n      const vm=m&prev;\n      if(vm&((m<<1)|(m>>1)))continue;                // kein Knick / keine T-Form\n      const inf=info(m), cr=colRem.slice(), nv=new Array(N).fill(0);\n      let bad=false;\n      for(let c=0;c<N;c++){\n        if((m>>c)&1){\n          cr[c]--; if(cr[c]<0){bad=true;break;}\n          nv[c]=((prev>>c)&1)?v[c]+1:1;\n          if(nv[c]>maxLen){bad=true;break;}\n        }\n        if(cr[c]>rowsLeft){bad=true;break;}\n      }\n      if(bad)continue;\n      const c2=cnt.slice(), ended=prev&~m&prevS;\n      for(let c=0;c<N;c++)if((ended>>c)&1){if(++c2[v[c]]>need[v[c]]){bad=true;break;}}\n      if(bad)continue;\n      for(const L of inf.runs)if(++c2[L]>need[L]){bad=true;break;}\n      if(bad)continue;\n      total+=rec(r+1,m,inf.singles,nv,c2,cr);\n      if(total>=limit)return total;\n    }\n    return total;\n  }\n  const res=rec(0,0,0,new Array(N).fill(0),new Array(maxLen+1).fill(0),cs.slice());\n  return over?limit:res;\n}\n/* ===== Logischer Löser für Schiffe-versenken =====\n   g: 0 unbekannt, 1 Wasser, 2 Schiff.\n   Stufen: 1 Grundregeln (Randzahlen, Abstand, gerade Schiffe) · 2 + Flotte (welche Schiffe fehlen noch?)\n           3 + Zeilen-/Spaltenanalyse (alle möglichen Verteilungen aufzählen) · 4 + Annahme testen · 5 + Annahme in der Annahme */\nfunction bmCtx(N,fleet,rs,cs){\n  const maxLen=Math.max(...fleet),need=new Array(maxLen+2).fill(0);\n  fleet.forEach(L=>need[L]++);\n  const masks=Array.from({length:N+1},()=>[]);\n  for(let m=0;m<(1<<N);m++){\n    let pc=0,run=0,ok=true;\n    for(let c=0;c<N;c++){if((m>>c)&1){pc++;run++;if(run>maxLen){ok=false;break;}}else run=0;}\n    if(ok)masks[pc].push(m);\n  }\n  return {N,rs,cs,need,maxLen,masks};\n}\n/* Schiffsstücke: Länge der Segmente; closed = beidseitig durch Wasser/Rand begrenzt */\nfunction bmSegments(c,g){\n  const N=c.N,segs=[];\n  const at=(r,k)=>(r>=0&&k>=0&&r<N&&k<N)?g[r*N+k]:1;\n  for(let r=0;r<N;r++)for(let k=0;k<N;k++){\n    if(g[r*N+k]!==2)continue;\n    const hl=at(r,k-1)===2,vl=at(r-1,k)===2;\n    if(hl||vl)continue;                             // nur am Anfang eines Segments zählen\n    let L=1,horiz=at(r,k+1)===2,vert=at(r+1,k)===2,cells=[r*N+k];\n    if(horiz){while(at(r,k+L)===2){cells.push(r*N+k+L);L++;}}\n    else if(vert){while(at(r+L,k)===2){cells.push((r+L)*N+k);L++;}}\n    let b1,b2;\n    if(horiz){b1=at(r,k-1);b2=at(r,k+L);}\n    else if(vert){b1=at(r-1,k);b2=at(r+L,k);}\n    else{b1=Math.min(at(r,k-1),at(r,k+1));b2=Math.min(at(r-1,k),at(r+1,k));}   // Einzelfeld: alle vier Nachbarn\n    let closed;\n    if(horiz||vert)closed=(b1===1&&b2===1);\n    else closed=(at(r,k-1)===1&&at(r,k+1)===1&&at(r-1,k)===1&&at(r+1,k)===1);\n    segs.push({L,closed,horiz,vert,r,k,cells});\n  }\n  return segs;\n}\nfunction bmProp(c,g,lvl){\n  const N=c.N;let bad=false,ch=true;\n  const inb=(r,k)=>r>=0&&k>=0&&r<N&&k<N;\n  const at=(r,k)=>inb(r,k)?g[r*N+k]:1;\n  const set=(r,k,v)=>{if(!inb(r,k))return;const i=r*N+k;if(g[i]===v)return;if(g[i]){bad=true;return;}g[i]=v;ch=true;};\n  while(ch&&!bad){\n    ch=false;\n    // Randzahlen\n    for(let a=0;a<N&&!bad;a++)for(const row of [true,false]){\n      let ships=0,unk=0;\n      for(let b=0;b<N;b++){const v=row?g[a*N+b]:g[b*N+a];if(v===2)ships++;else if(!v)unk++;}\n      const goal=row?c.rs[a]:c.cs[a];\n      if(ships>goal||ships+unk<goal){bad=true;break;}\n      if(unk&&(ships===goal||ships+unk===goal)){\n        const v=ships===goal?1:2;\n        for(let b=0;b<N;b++){const r=row?a:b,k=row?b:a;if(!g[r*N+k])set(r,k,v);}\n      }\n    }\n    if(bad)break;\n    // Abstand und gerade Schiffe\n    for(let r=0;r<N&&!bad;r++)for(let k=0;k<N;k++){\n      if(g[r*N+k]!==2)continue;\n      for(const [dr,dc] of [[-1,-1],[-1,1],[1,-1],[1,1]])set(r+dr,k+dc,1);\n      const h=at(r,k-1)===2||at(r,k+1)===2,v=at(r-1,k)===2||at(r+1,k)===2;\n      if(h&&v){bad=true;break;}\n      if(h){set(r-1,k,1);set(r+1,k,1);}\n      if(v){set(r,k-1,1);set(r,k+1,1);}\n    }\n    if(bad)break;\n    // Segmente und Flotte\n    const segs=bmSegments(c,g);\n    let M=c.maxLen;\n    if(lvl>=2){\n      const cnt=new Array(c.maxLen+2).fill(0);\n      for(const s of segs)if(s.closed){if(s.L>c.maxLen||++cnt[s.L]>c.need[s.L]){bad=true;break;}}\n      if(bad)break;\n      M=0;for(let L=c.maxLen;L>=1;L--)if(c.need[L]-cnt[L]>0){M=L;break;}\n    }\n    for(const s of segs){\n      if(s.closed)continue;\n      if(s.L>M){bad=true;break;}\n      if(s.L===M){\n        if(s.horiz){set(s.r,s.k-1,1);set(s.r,s.k+s.L,1);}\n        else if(s.vert){set(s.r-1,s.k,1);set(s.r+s.L,s.k,1);}\n        else{set(s.r,s.k-1,1);set(s.r,s.k+1,1);set(s.r-1,s.k,1);set(s.r+1,s.k,1);}\n      }\n    }\n    if(bad)break;\n    // Felder, die ein zu langes oder geknicktes Schiff ergäben, sind Wasser\n    for(let r=0;r<N&&!bad;r++)for(let k=0;k<N;k++){\n      if(g[r*N+k])continue;\n      let hl=0,hr=0,vu=0,vd=0;\n      while(at(r,k-1-hl)===2)hl++;\n      while(at(r,k+1+hr)===2)hr++;\n      while(at(r-1-vu,k)===2)vu++;\n      while(at(r+1+vd,k)===2)vd++;\n      const H=hl+hr+1,V=vu+vd+1;\n      if((H>1&&V>1)||H>M||V>M)set(r,k,1);\n    }\n    // Zum Schluss: stimmt die fertige Flotte?\n    if(lvl>=2&&!bad&&!g.includes(0)){\n      const cnt=new Array(c.maxLen+2).fill(0);\n      for(const s of bmSegments(c,g)){if(s.L>c.maxLen){bad=true;break;}cnt[s.L]++;}\n      for(let L=1;L<=c.maxLen;L++)if(cnt[L]!==c.need[L])bad=true;\n    }\n    if(lvl>=3&&!bad&&!ch){\n      const r=bmLines(c,g,M);\n      if(r<0)bad=true;else if(r>0)ch=true;\n    }\n  }\n  return !bad;\n}\n/* Zeilen-/Spaltenanalyse: alle zulässigen Verteilungen aufzählen; was in allen gleich ist, steht fest. -1 Widerspruch, 0 nichts, 1 Fortschritt */\nfunction bmLines(c,g,M){\n  const N=c.N;let prog=0;\n  for(const row of [true,false])for(let a=0;a<N;a++){\n    const goal=row?c.rs[a]:c.cs[a];\n    const idx=b=>row?a*N+b:b*N+a;\n    const cross=(da,b)=>{const aa=a+da;if(aa<0||aa>=N||b<0||b>=N)return 1;return row?g[aa*N+b]:g[b*N+aa];};\n    let must=0,not=0,unk=0;\n    for(let b=0;b<N;b++){const v=g[idx(b)];if(v===2)must|=1<<b;else if(v===1)not|=1<<b;else unk++;}\n    if(!unk)continue;\n    let anyShip=0,anyWater=0,n=0;\n    for(const m of c.masks[goal]){\n      if((m&must)!==must||(m&not))continue;\n      let ok=true,b=0;\n      while(b<N&&ok){\n        if(!((m>>b)&1)){b++;continue;}\n        let e=b;while(e+1<N&&((m>>(e+1))&1))e++;\n        const len=e-b+1;\n        const runBits=((1<<len)-1)<<b;\n        if(len>c.maxLen||(len>M&&(runBits&must)!==runBits)){ok=false;break;}   // schon fertige Schiffe zählen nicht\n        for(let t=b;t<=e&&ok;t++){\n          if(len>=2&&(cross(-1,t)===2||cross(1,t)===2))ok=false;\n          if(cross(-1,t-1)===2||cross(-1,t+1)===2||cross(1,t-1)===2||cross(1,t+1)===2)ok=false;\n        }\n        b=e+1;\n      }\n      if(!ok)continue;\n      n++;anyShip|=m;anyWater|=~m;\n    }\n    if(!n)return -1;\n    for(let b=0;b<N;b++){\n      if(g[idx(b)])continue;\n      const s=(anyShip>>b)&1,w=(anyWater>>b)&1;\n      if(s&&!w){g[idx(b)]=2;prog=1;}\n      else if(w&&!s){g[idx(b)]=1;prog=1;}\n    }\n  }\n  return prog;\n}\nconst BM_TIERS=[null,\n  {cheap:1},{cheap:2},{cheap:3},\n  {cheap:3,probe:{cheap:3}},\n  {cheap:3,probe:{cheap:3,probe:{cheap:3}}}];\nfunction bmPropL(c,g,L,st){\n  if(!bmProp(c,g,L.cheap))return false;\n  if(!L.probe)return true;\n  let prog=true;\n  while(prog){\n    prog=false;\n    for(let i=0;i<g.length;i++){\n      if(g[i])continue;\n      for(const v of [2,1]){\n        const t=g.slice();t[i]=v;\n        if(!bmPropL(c,t,L.probe)){\n          g[i]=3-v;prog=true;if(st)st.probes++;\n          if(!bmProp(c,g,L.cheap))return false;\n          break;\n        }\n      }\n    }\n  }\n  return true;\n}\nfunction bmTier(c,puz,maxT,st){\n  for(let t=1;t<=(maxT||5);t++){\n    const g=puz.slice();if(st)st.probes=0;\n    if(bmPropL(c,g,BM_TIERS[t],st)&&g.every(v=>v))return t;\n  }\n  return 0;\n}\n\n/* lvl: {ratio} (nur Anzahl Vorgaben) oder {tier, probes:{N:[min,max]}} (logisch lösbar: nötige Stufe und Anzahl Annahmen) */\nfunction shGenerate(N,lvl){\n  const fleet=SH_FLEET[N].slice().sort((a,b)=>b-a);\n  let sol=null;\n  for(let t=0;t<50&&!sol;t++)sol=shPlace(N,fleet);\n  if(!sol)return null;\n  const rs=new Array(N).fill(0), cs=new Array(N).fill(0);\n  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(sol[r*N+c]===2){rs[r]++;cs[c]++;}\n  const T=N*N, puz=sol.slice();\n  if(lvl.tier){\n    const c=bmCtx(N,fleet,rs,cs), pr=(lvl.probes&&lvl.probes[N])||[0,1e9];\n    const solvable=q=>{const g=q.slice(),st={probes:0};return bmPropL(c,g,BM_TIERS[lvl.tier],st)&&g.every(v=>v)&&st.probes<=pr[1];};\n    for(const i of shuffle([...Array(T).keys()])){const v=puz[i];puz[i]=0;if(!solvable(puz))puz[i]=v;}\n    const st={probes:0},t=bmTier(c,puz,lvl.tier,st);\n    if(!t||(lvl.exact&&t!==lvl.tier)||st.probes<pr[0]||st.probes>pr[1])return null;\n  } else {\n    const target=Math.round(T*lvl.ratio),bc=bmCtx(N,fleet,rs,cs);\n    const logical=q=>{const g=q.slice();return bmPropL(bc,g,BM_TIERS[3])&&g.every(v=>v);};   // ohne Annahme lösbar\n    let givens=T;\n    for(const i of shuffle([...Array(T).keys()])){\n      if(givens<=target)break;\n      const v=puz[i]; puz[i]=0;\n      if(logical(puz))givens--; else puz[i]=v;\n    }\n  }\n  // Absicherung: mindestens ein Schiffsfeld muss noch gefunden werden müssen\n  if(sol.every((v,i)=>v!==2||puz[i]===2))return null;\n  return {sol,puz,rs,cs,fleet};\n}\n/* ===== LOGIK-ENDE ===== */\n\n/* ---------- Bimaru ---------- */\nconst WATER=1, SHIP=2;\nclass BimaruPuzzle extends GridPuzzle{\n  constructor(def,size,lvlKey,data){\n    super(def,size,lvlKey,data);\n    this.rs=data.rs;this.cs=data.cs;this.fleet=data.fleet;\n    this.bc=bmCtx(size,data.fleet,data.rs,data.cs);\n    this.rowLbl=[];this.colLbl=[];\n  }\n  baseClass(i){\n    const N=this.n;let cls='cell';\n    if(i%N===N-1)cls+=' lastc';\n    if(Math.floor(i/N)===N-1)cls+=' lastr';\n    return cls;\n  }\n  buildBoard(){\n    const N=this.n;\n    const wrap=document.createElement('div');\n    const outer=document.createElement('div');\n    outer.className='shwrap';\n    outer.style.setProperty('--m',N+1);outer.style.setProperty('--n',N+1);outer.style.setProperty('--cols',N);\n    outer.appendChild(document.createElement('div'));                // Ecke\n    const cl=document.createElement('div');cl.className='collabels';\n    const rl=document.createElement('div');rl.className='rowlabels';\n    this.colLbl=[];this.rowLbl=[];\n    for(let c=0;c<N;c++){const d=document.createElement('div');d.className='lbl';d.textContent=this.cs[c];cl.appendChild(d);this.colLbl.push(d);}\n    for(let r=0;r<N;r++){const d=document.createElement('div');d.className='lbl';d.textContent=this.rs[r];rl.appendChild(d);this.rowLbl.push(d);}\n    outer.appendChild(cl);outer.appendChild(rl);\n    const b=document.createElement('div');\n    b.className='board g-schiffe';\n    b.style.setProperty('--n',N+1);b.style.setProperty('--cols',N);\n    b.setAttribute('aria-label','Schiffe-Feld');\n    this.cells=[];\n    for(let i=0;i<N*N;i++){\n      const d=document.createElement('div');\n      d.addEventListener('click',()=>this.onCell(i));\n      b.appendChild(d);this.cells.push(d);\n    }\n    outer.appendChild(b);\n    wrap.appendChild(outer);\n    // Flotte\n    const fl=document.createElement('div');fl.className='fleet';\n    fl.appendChild(document.createTextNode('Flotte:'));\n    const counts={};this.fleet.forEach(L=>counts[L]=(counts[L]||0)+1);\n    Object.keys(counts).map(Number).sort((a,b)=>b-a).forEach(L=>{\n      const g=document.createElement('span');g.className='grp';\n      const s=document.createElement('span');s.className='ship';\n      for(let t=0;t<L;t++)s.appendChild(document.createElement('i'));\n      g.appendChild(s);g.appendChild(document.createTextNode('× '+counts[L]));\n      fl.appendChild(g);\n    });\n    wrap.appendChild(fl);\n    return wrap;\n  }\n  cellState(i){\n    const v=this.cur[i];\n    if(!v)return this.sol[i]===SHIP?'empty':'skip';   // unmarkiertes Wasser ist in Ordnung\n    return v===this.sol[i]?'right':'wrong';\n  }\n  solved(){\n    for(let i=0;i<this.cur.length;i++)if((this.cur[i]===SHIP)!==(this.sol[i]===SHIP))return false;\n    return true;\n  }\n  revealEmpty(i){if(this.sol[i]===SHIP)this.hinted[i]=true;}\n  /* «Vollständig» = so viele Schiffsfelder gesetzt, wie die Flotte hat (oder mehr) */\n  complete(){\n    let a=0,b=0;\n    for(let i=0;i<this.cur.length;i++){if(this.cur[i]===SHIP)a++;if(this.sol[i]===SHIP)b++;}\n    return a>=b;\n  }\n  finish(){\n    this.done=true;\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i]||this.hinted[i])continue;\n      if(!this.cur[i])this.cur[i]=WATER; else this.mark[i]=1;\n    }\n    this.refresh();\n  }\n  paint(i,d){\n    const N=this.n,r=Math.floor(i/N),c=i%N,v=this.cur[i];\n    d.removeAttribute('style');\n    if(v===SHIP){\n      d.classList.add('sh');\n      // Vorgegebene/Tipp-Felder zeigen ihre wahre Form, eigene Eingaben die aktuelle Nachbarschaft\n      const src=(this.given[i]||this.hinted[i])?this.sol:this.cur;\n      const is=(rr,cc)=>rr>=0&&cc>=0&&rr<N&&cc<N&&src[rr*N+cc]===SHIP;\n      const n=is(r-1,c),s=is(r+1,c),w=is(r,c-1),e=is(r,c+1);\n      d.style.setProperty('--t',n?'-1px':'14%');d.style.setProperty('--b',s?'-1px':'14%');\n      d.style.setProperty('--l',w?'-1px':'14%');d.style.setProperty('--r',e?'-1px':'14%');\n      d.style.setProperty('--tl',(!n&&!w)?'50%':'0');d.style.setProperty('--tr',(!n&&!e)?'50%':'0');\n      d.style.setProperty('--br',(!s&&!e)?'50%':'0');d.style.setProperty('--bl',(!s&&!w)?'50%':'0');\n    } else if(v===WATER)d.classList.add('water');\n    d.textContent='';\n  }\n  afterRefresh(){\n    const N=this.n,rc=new Array(N).fill(0),cc=new Array(N).fill(0);\n    for(let i=0;i<this.cur.length;i++)if(this.cur[i]===SHIP){rc[Math.floor(i/N)]++;cc[i%N]++;}\n    for(let k=0;k<N;k++){\n      this.rowLbl[k].className='lbl'+(rc[k]===this.rs[k]?' full':rc[k]>this.rs[k]?' over':'');\n      this.colLbl[k].className='lbl'+(cc[k]===this.cs[k]?' full':cc[k]>this.cs[k]?' over':'');\n    }\n  }\n  onCell(i){\n    this.sel=i;\n    if(this.editable()){\n      const nx={0:SHIP,[SHIP]:WATER,[WATER]:0}[this.cur[i]];   // leer → Schiff → Wasser → leer\n      this.setCell(i,nx);\n    }\n    this.commit();\n  }\n  setSym(v){if(!this.editable())return;this.setCell(this.sel,v);this.commit();}\n  handleKey(e){\n    const k=e.key;\n    if(k==='s'||k==='S'||k==='1'){this.setSym(SHIP);return true;}\n    if(k==='w'||k==='W'||k==='2'){this.setSym(WATER);return true;}\n    if(k==='Backspace'||k==='Delete'||k==='0'){this.setSym(0);return true;}\n    if(k===' '){if(this.editable())this.onCell(this.sel);return true;}\n    return false;\n  }\n  /* logisch herleitbares Feld aus dem bisher Richtigen suchen */\n  logicHint(){\n    const N=this.n,g=this.cur.map((v,i)=>(this.given[i]||this.hinted[i]||v===this.sol[i])?v:0);\n    const open=i=>!g[i]&&!this.given[i];\n    for(let r=0;r<N;r++)for(let k=0;k<N;k++){\n      if(g[r*N+k]!==SHIP)continue;\n      for(const [dr,dc] of [[-1,-1],[-1,1],[1,-1],[1,1]]){\n        const rr=r+dr,cc=k+dc,j=rr*N+cc;\n        if(rr>=0&&cc>=0&&rr<N&&cc<N&&open(j)&&this.sol[j]===WATER)\n          return {i:j,text:'Tipp (gelb): Diagonal neben einem Schiffsteil ist Wasser – Schiffe berühren sich nie, auch nicht an den Ecken.'};\n      }\n    }\n    for(const row of [true,false])for(let a=0;a<N;a++){\n      const idx=[];for(let b=0;b<N;b++)idx.push(row?a*N+b:b*N+a);\n      const goal=row?this.rs[a]:this.cs[a],nm=row?'Zeile':'Spalte';\n      let ships=0,free=[];\n      for(const j of idx){if(g[j]===SHIP)ships++;else if(!g[j])free.push(j);}\n      const f=free.find(j=>open(j));\n      if(f===undefined)continue;\n      if(goal===0&&this.sol[f]===WATER)return {i:f,text:`Tipp (gelb): Diese ${nm} hat die Zahl 0 – hier liegt nur Wasser.`};\n      if(ships===goal&&this.sol[f]===WATER)return {i:f,text:`Tipp (gelb): In dieser ${nm} sind schon alle ${goal} Schiffsteile gefunden – der Rest ist Wasser.`};\n      if(ships+free.length===goal&&this.sol[f]===SHIP)return {i:f,text:`Tipp (gelb): In dieser ${nm} fehlen noch ${goal-ships} Schiffsteile und es sind genau so viele Felder frei – alle freien Felder sind Schiff.`};\n    }\n    return null;\n  }\n  /* Tipp mit dem Löser: Feld suchen, das aus dem bisher Richtigen folgt (ohne Annahme) */\n  solverHint(){\n    const known=this.cur.map((v,i)=>(this.given[i]||this.hinted[i]||v===this.sol[i])?v:0);\n    for(const t of [1,2,3]){\n      const g=known.slice();\n      if(!bmProp(this.bc,g,t))return null;\n      const open=[];\n      for(let i=0;i<g.length;i++)if(!known[i]&&g[i]&&!this.given[i]&&this.cur[i]!==this.sol[i]&&g[i]===this.sol[i])open.push(i);\n      if(open.length){\n        const sel=open.filter(i=>i===this.sel),i=randOf(sel.length?sel:open);\n        const what=this.sol[i]===SHIP?'Schiff':'Wasser';\n        const why=t===1?'Das folgt aus den Randzahlen und der Regel, dass sich Schiffe nie berühren.'\n                :t===2?'Das folgt aus der Flotte: Überlege, welche Schiffe noch fehlen und wo sie überhaupt Platz haben.'\n                :'Das folgt aus einer Zeile oder Spalte: Zähle alle Möglichkeiten, wie die fehlenden Schiffsteile dort liegen können – dieses Feld ist immer gleich.';\n        return {i,text:`Tipp (gelb): Hier ist ${what}. ${why}`};\n      }\n    }\n    // braucht eine Annahme\n    const g=known.slice();\n    if(bmPropL(this.bc,g,BM_TIERS[4])){\n      const open=[];\n      for(let i=0;i<g.length;i++)if(!known[i]&&g[i]&&!this.given[i]&&this.cur[i]!==this.sol[i]&&g[i]===this.sol[i])open.push(i);\n      if(open.length){\n        const sel=open.filter(i=>i===this.sel),i=randOf(sel.length?sel:open);\n        return {i,text:`Tipp (gelb): Hier ist ${this.sol[i]===SHIP?'Schiff':'Wasser'}. Das findest du nur mit einer Annahme: Nimm das Gegenteil an und folge den Folgerungen, bis ein Widerspruch entsteht.`};\n      }\n    }\n    return null;\n  }\n  pickHint(){\n    const lh=this.logicHint();\n    if(lh)return lh;\n    const sh=this.solverHint();\n    if(sh)return sh;\n    const wrong=[],missing=[];\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i]||this.hinted[i])continue;\n      const s=this.cellState(i);\n      if(s==='wrong')wrong.push(i);else if(s==='empty')missing.push(i);\n    }\n    let i;\n    if(this.sel>=0&&(wrong.includes(this.sel)||missing.includes(this.sel)))i=this.sel;\n    else if(wrong.length)i=randOf(wrong);\n    else if(missing.length)i=randOf(missing);\n    else return null;\n    const was=wrong.includes(i);\n    const text=(was?'Dieses Feld war falsch. ':'Dieses Feld ist nur durch längeres Überlegen zu finden. ')+(this.sol[i]===SHIP?'Hier liegt ein Schiff (gelb).':'Hier ist Wasser (gelb).');\n    return {i,text};\n  }\n}\n\n/* ----- Anmeldung beim Kern ----- */\nconst GAME={\n    title:'Bimaru-Trainer',\n    id:'bimaru', name:'Bimaru', icon:'🚢', units:['Markierung','Markierungen'],\n    intro:'Bimaru (Schiffe versenken): Finde die versteckte Flotte – mit den Zahlen am Rand und ein bisschen Köpfchen.',\n    sizes:[6,8,10], size:6, lvl:'sl', tools:{notes:false},\n    padHelp:'Feld antippen: leer → Schiff → Wasser → leer.',\n    missing:n=>`Es fehlen noch ${n} Schiffsfelder.`,\n    levels:{\n      sl:{ratio:.35,desc:'Viele Teile sind schon verraten. Die Zahlen am Rand helfen beim Finden.'},\n      l: {ratio:.25,desc:'Einige Teile vorgegeben. Kombiniere die Randzahlen mit den Hinweisen.'},\n      m: {ratio:.14,desc:'Wenige Teile vorgegeben. Denk an: Schiffe berühren sich nie.'},\n      s: {tier:3,best:3,desc:'Sehr wenige Teile vorgegeben, fast nur die Zahlen am Rand – wie in der Zeitung. Alles ist ohne Raten und ohne Annahme herleitbar.'},\n      ss:{tier:4,exact:true,probes:{6:[1,4],8:[1,6],10:[1,9]},desc:'Kaum Hinweise. Du musst mehrmals eine Annahme machen («Wenn hier ein Schiff liegt, dann …») und einen Widerspruch finden. Raten hilft nicht – nur Denken.'},\n      us:{tier:4,exact:true,probes:{6:[7,99],8:[10,99],10:[18,99]},desc:'Das Härteste: Sehr viele Annahmen und Widersprüche sind nötig, bis die Flotte steht. Alles ist logisch herleitbar, aber du brauchst Geduld, Notizen auf Papier und einen klaren Kopf.'}\n    },\n    create(size,lvl){\n      const L=this.levels[lvl],t0=Date.now();\n      let best=null,found=0;\n      for(let t=0;t<400&&(t<30||Date.now()-t0<12000);t++){\n        const d=shGenerate(size,L);if(!d)continue;\n        const g=d.puz.filter(v=>v).length;\n        if(!best||g<best.g)best={d,g};\n        if(++found>=(L.best||1))break;\n      }\n      return best?new BimaruPuzzle(this,size,lvl,best.d):null;\n    },\n    rules(n){\n      return `\n        <li>Versteckt ist die <b>Flotte<\/b> (siehe unter dem Feld). Finde alle Schiffe.<\/li>\n        <li>Die <b>Zahlen am Rand<\/b> zeigen, wie viele Schiffsteile in der Zeile bzw. Spalte liegen.<\/li>\n        <li>Schiffe liegen <b>gerade<\/b> (waagrecht oder senkrecht).<\/li>\n        <li>Schiffe berühren sich <b>nie<\/b> – auch nicht diagonal. Rundherum ist Wasser.<\/li>\n        <li>Vorgegebene Felder sind sicher: Schiffsstück (mit seiner Form: Einzelschiff, Ende, Mittelteil) oder Wasser.<\/li>\n        <li><b>Strategie:<\/b> Zahl 0 → alles Wasser. Passt die Zahl genau zur Anzahl freier Felder → alles Schiff. Die Randzahl wird grün, wenn sie stimmt, und rot, wenn du zu viele Teile gesetzt hast.<\/li>\n        <li><b>Für Fortgeschrittene:<\/b> Überlege, welche Schiffe der Flotte noch fehlen. Zähle bei einer Zeile alle Möglichkeiten durch. Bei «Sehr schwer» und «Ultraschwer»: Nimm an, ein Feld sei Schiff (oder Wasser), und prüfe, ob ein Widerspruch entsteht.<\/li>\n        <li><b>Abgeben:<\/b> Fülle das ganze Rätsel aus und drücke dann «Abgeben». Erst jetzt wird korrigiert: Stimmt etwas nicht, werden die falschen Felder rot und du musst ein neues Rätsel beginnen. Prüfe deshalb vor dem Abgeben alles nochmals in Ruhe.<\/li>\n        <li><b>Bedienung:<\/b> Feld antippen: Schiff → Wasser → leer. Tastatur: S, W, Entf, Leertaste, Pfeiltasten.<\/li>`;\n    }\n  };\n\n/* =====================================================================\n   KERN – Oberfläche (gilt für jedes Rätsel)\n   Erwartet eine globale Konstante GAME (vom Rätsel-Modul definiert).\n   Kümmert sich um: Auswahl Grösse/Niveau, Zeit, Statistik, Prüfen, Tipp,\n   Neu beginnen, Lösung zeigen, Drucken, Gewonnen-Dialog, Tastatur,\n   Einbettung in die Plattform (?embed=1).\n   ===================================================================== */\nconst $=id=>document.getElementById(id);\nconst def=GAME;\nconst EMBED=/[?&]embed=1/.test(location.search)||window.name==='raetsel-embed';\nconst STORE_KEY='raetsel-trainer-v1-'+def.id;\nconst settings={size:def.size,lvl:def.lvl};\nlet solUsed=false,puz=null,noteMode=false,tips=0,checks=0,startT=0,timerId=null,genToken=0;\n\n$('autoCheck').checked=false;\nfunction loadStore(){\n  try{\n    const o=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');\n    if(def.sizes.includes(o.size))settings.size=o.size;\n    if(def.levels[o.lvl])settings.lvl=o.lvl;\n  }catch(e){}\n}\nfunction saveStore(){try{localStorage.setItem(STORE_KEY,JSON.stringify(settings));}catch(e){}}\n\n/* Meldungen, Zeit, Statistik */\nfunction showMsg(t,type){const m=$('msg');m.textContent=t;m.className='msg show '+type;}\nfunction hideMsg(){$('msg').className='msg';}\nfunction elapsed(){return Math.floor((Date.now()-startT)/1000);}\nfunction fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}\nfunction startTimer(){stopTimer();startT=Date.now();$('stTime').textContent='00:00';timerId=setInterval(()=>$('stTime').textContent=fmt(elapsed()),1000);}\nfunction stopTimer(){if(timerId)clearInterval(timerId);timerId=null;}\n/* Deutlich sichtbare Kennzeichnung: Wurde die Lösung angezeigt, bleibt das für dieses Rätsel sichtbar\n   (auch nach «Neu beginnen» und nach dem Lösen) – ein Screenshot kann also nicht als eigene Lösung gelten. */\nfunction updateStatus(){\n  const st=$('stStatus'),won=puz&&puz.done&&!solUsed&&puz.solved(),lk=puz&&puz.locked&&!solUsed,rdy=puz&&!puz.done&&!puz.locked&&puz.complete();\n  st.className=(solUsed||lk)?'bad':won?'good':'';\n  st.textContent=solUsed?'⚠ Lösung angezeigt':lk?'✖ nicht richtig gelöst':won?'✔ selbst gelöst':rdy?'bereit zum Abgeben':'in Arbeit';\n  $('solBanner').style.display=solUsed?'block':'none';\n  $('stage').classList.toggle('sol',solUsed);\n}\n/* Tipps je Niveau: einfache Stufen keine, Mittel 1, Schwer 2, Sehr schwer/Ultraschwer 3 */\nconst TIP_LIMIT={sl:0,l:0,m:1,s:2,ss:3,us:3};\nfunction tipLimit(){return TIP_LIMIT[puz?puz.lvlKey:settings.lvl]||0;}\nfunction tipText(l){const n=TIP_LIMIT[l]||0;return n===0?'Keine Tipps möglich.':n===1?'Maximal 1 Tipp.':`Maximal ${n} Tipps.`;}\nfunction updateStats(){$('stTips').textContent=tips+'/'+tipLimit();$('stChecks').textContent=checks;}\n\nconst ctx={\n  autoCheck:()=>$('autoCheck').checked,\n  noteMode:()=>noteMode,\n  hideMsg,\n  changed:()=>{refreshTools();},\n\n  msg:showMsg\n};\n/* Beschriftungen – Rätsel dürfen sie überschreiben (def.sizeLabel, def.tag, def.newLabel …) */\nconst sizeLabel=v=>def.sizeLabel?def.sizeLabel(v):`${v} × ${v}`;\nconst tagOf=(s,l)=>def.tag?def.tag(s,l):`${LEVEL_NAMES[l]} (${s}×${s})`;\n\n/* Auswahl-Leisten */\nfunction makeSeg(el,items,current,onPick){\n  el.innerHTML='';\n  for(const it of items){\n    const b=document.createElement('button');\n    b.textContent=it.label;b.dataset.v=it.v;\n    b.classList.toggle('on',String(it.v)===String(current));\n    b.addEventListener('click',()=>onPick(it.v));\n    el.appendChild(b);\n  }\n}\n/* Manche Niveaus gibt es nur ab einer bestimmten Grösse (levels.xx.sizes) */\nfunction sizesFor(){return def.levels[settings.lvl].sizes||def.sizes;}\nfunction buildOptions(){\n  const allowed=sizesFor();\n  if(!allowed.includes(settings.size))settings.size=allowed.find(n=>n>=settings.size)||allowed[allowed.length-1];\n  makeSeg($('sizeSeg'),allowed.map(n=>({v:n,label:sizeLabel(n)})),settings.size,v=>{settings.size=v;buildOptions();saveStore();updateSetupSel();});\n  makeSeg($('lvlSeg'),Object.keys(def.levels).map(k=>({v:k,label:LEVEL_NAMES[k]})),settings.lvl,v=>{settings.lvl=v;buildOptions();saveStore();updateSetupSel();});\n  const d=def.levels[settings.lvl].desc;\n  $('lvlDesc').textContent=(typeof d==='function'?d(settings.size):d)+' '+tipText(settings.lvl);\n  $('sizeSeg').style.display=def.sizes.length>1?'':'none';\n  $('sizeLbl').style.display=def.sizes.length>1?'':'none';\n}\n\n\n/* Schritt 1: Rahmenbedingungen wählen – Schritt 2: Rätsel erstellen */\nconst TOOL_IDS=['btnCheck','btnNotes','btnHint','btnReset','btnSolve','btnPrint','btnSubmit'];\nfunction toolsDisabled(on){for(const id of TOOL_IDS){const e=$(id);if(e)e.disabled=on;}if($('autoCheck'))$('autoCheck').disabled=on;}\nfunction showSetup(){\n  ++genToken;stopTimer();puz=null;tips=0;checks=0;solUsed=false;\n  const stage=$('stage');stage.classList.remove('loading','sol');\n  stage.innerHTML=`<div class=\"setup-ph\"><div class=\"big\">${def.icon||'🧩'}<\/div><h3>Neues ${def.name} einrichten<\/h3><p>Wähle Grösse und Niveau und erstelle dann das Rätsel.<\/p><p class=\"chosen\" id=\"setupSel\"><\/p><button class=\"btn primary\" id=\"btnSetupGo\">Rätsel erstellen<\/button><\/div>`;\n  $('btnSetupGo').addEventListener('click',startGame);\n  const pad=$('pad');pad.innerHTML='';pad.removeAttribute('style');\n  toolsDisabled(true);hideMsg();\n  $('stLevel').textContent='–';$('stTime').textContent='00:00';$('stStatus').textContent='noch kein Rätsel';$('stStatus').className='';\n  if($('stTips'))$('stTips').textContent='–';\n  if($('solBanner'))$('solBanner').style.display='none';\n  updateSetupSel();\n}\nfunction updateSetupSel(){const e=$('setupSel');if(e)e.textContent=(def.sizes.length>1?sizeLabel(settings.size)+' · ':'')+LEVEL_NAMES[settings.lvl];}\nfunction startGame(){\n  if(puz&&!puz.done&&!puz.locked&&!solUsed&&!confirm('Das laufende Rätsel wird verworfen. Wirklich ein neues Rätsel erstellen?'))return;\n  newGame();\n}\n\n/* Neues Rätsel */\nfunction newGame(){\n  const token=++genToken, stage=$('stage');\n  stopTimer();\n  stage.classList.add('loading');\n  showMsg(`${def.name} wird erstellt …`,'info');\n  setTimeout(()=>{\n    if(token!==genToken)return;\n    let p=null;\n    try{p=def.create(settings.size,settings.lvl);}catch(err){console.error(err);}\n    stage.classList.remove('loading');\n    if(!p){showMsg('Das Rätsel konnte nicht erstellt werden. Bitte nochmals versuchen.','warn');if(!puz)showSetup();return;}\n    puz=p;tips=0;checks=0;solUsed=false;\n    toolsDisabled(false);\n    puz.mount(ctx,stage,$('pad'));setLocked(false);\n    if($('autoCheck').checked)puz.applyAutoCheck(true);\n    $('stLevel').textContent=tagOf(settings.size,settings.lvl);\n    $('phTitle').textContent=`${def.name} · ${tagOf(settings.size,settings.lvl)}`;\n    $('rules').innerHTML=def.rules(settings.size);\n    updateStats();updateStatus();startTimer();hideMsg();\n  },30);\n}\n\n/* Werkzeuge */\nfunction check(){\n  if(!puz||puz.done||puz.locked)return;\n  if(puz.customCheck){checks++;updateStats();const r=puz.customCheck();showMsg(r.text,r.type);return;}\n  checks++;\n  const {wrong,empty,right}=puz.check();\n  updateStats();\n  if(puz.solved()){win();return;}\n  const [one,many]=def.units;\n  if(wrong===0){\n    showMsg(right===0?`Noch nichts eingetragen. ${def.missing(empty)}`\n      :`Super! ${right===1?'Die eingetragene '+one+' ist':'Alle '+right+' eingetragenen '+many+' sind'} richtig. ${def.missing(empty)}`,'good');\n  } else {\n    showMsg(`${wrong} ${wrong===1?one+' ist':many+' sind'} falsch (rot). ${right} richtig. ${def.missing(empty)} Korrigiere die roten Felder.`,'warn');\n  }\n}\nfunction hint(){\n  if(!puz||puz.done||puz.locked||tips>=tipLimit())return;\n  const t=puz.hint();\n  if(t===null)return;\n  tips++;updateStats();showMsg(t,'info');\n  ctx.changed();\n}\nfunction resetGame(){\n  if(!puz||puz.locked||!confirm('Alle eigenen Eingaben löschen und neu beginnen? Bereits benutzte Tipps bleiben verbraucht.'))return;\n  puz.reset();startTimer();hideMsg();updateStats();refreshTools();\n}\nfunction showSolution(){\n  if(!puz)return;\n  if(!confirm(`Wirklich die ganze Lösung anzeigen? Das ${def.name}-Rätsel gilt dann als nicht gelöst.`))return;\n  solUsed=true;puz.reveal();stopTimer();refreshTools();\n  showMsg('Lösung angezeigt: grün = du hattest es richtig, rot = war falsch, gelb = war leer.','info');\n}\n/* Werkzeuge sperren/freigeben (nach einem vollständig falsch gelösten Rätsel bleibt nur «Lösung zeigen» / «Neues Rätsel») */\nfunction setLocked(on){\n  for(const id of ['btnCheck','btnHint','btnReset','btnNotes','autoCheck'])$(id).disabled=on;\n  $('autoCheck').parentElement.classList.toggle('off',on);\n  document.querySelectorAll('#pad button').forEach(b=>b.disabled=on);\n  refreshTools();\n}\n/* «Abgeben» ist erst möglich, wenn alles ausgefüllt ist. Dann sind Überprüfen und Tipp gesperrt – sonst könnte man vor dem Abgeben noch Fehler suchen. */\nfunction refreshTools(){\n  if(!puz)return;\n  const over=puz.done||puz.locked,comp=!over&&puz.complete();\n  $('btnSubmit').disabled=!comp;\n  $('btnSubmit').title=comp?'':'Erst alle Felder ausfüllen';\n  const lim=tipLimit(),left=lim-tips;\n  $('btnHint').textContent=lim?`💡 Tipp (${left} übrig)`:'💡 Keine Tipps';\n  if(!puz.locked){$('btnCheck').disabled=true;$('btnHint').disabled=over||comp||left<=0;}\n  updateStatus();\n  if(comp&&!$('msg').classList.contains('show'))showMsg('Alles ausgefüllt. Prüfe nochmals in Ruhe – mit «Abgeben» gibst du das Rätsel ab. Erst dann wird korrigiert.','info');\n}\n/* Abgeben: erst jetzt wird ausgewertet */\nfunction submitPuz(){\n  if(!puz||puz.done||puz.locked||!puz.complete())return;\n  if(puz.solved())win();else fail();\n}\n/* Rätsel ist vollständig ausgefüllt, aber nicht richtig: Fehler rot, keine Korrektur mehr möglich */\nfunction fail(){\n  puz.lock();stopTimer();setLocked(true);\n  const bad=puz.mark.filter(m=>m===2).length;\n  $('winTitle').textContent='✖ Leider nicht richtig';\n  $('winText').innerHTML=`${def.name} · Niveau: <b>${tagOf(settings.size,settings.lvl)}<\/b><br>Zeit: <b>${fmt(elapsed())}<\/b> · Tipps: <b>${tips} von ${tipLimit()}<\/b><br>Du hast das Rätsel abgegeben, aber <b>${bad===1?'ein Feld ist':bad+' Felder sind'} falsch<\/b> (rot markiert).<br>Abgegebene Rätsel können nicht mehr korrigiert werden – starte ein <b>neues Rätsel<\/b> und versuche es nochmals.`;\n  $('winTip').style.display='none';\n  $('btnWinNew').textContent='Neues Rätsel';$('btnWinClose').textContent='Fehler ansehen';\n  $('overlay').classList.add('show');\n  showMsg('Abgegeben – nicht richtig gelöst: Die roten Felder sind falsch. Korrigieren ist nicht mehr möglich – starte ein neues Rätsel.','warn');\n}\nfunction win(){\n  $('winTip').style.display='';$('btnWinNew').textContent='Nächstes Rätsel';$('btnWinClose').textContent='Schliessen';\n  puz.finish();stopTimer();\n  $('winText').innerHTML=`${def.name} · Niveau: <b>${tagOf(settings.size,settings.lvl)}<\/b><br>Zeit: <b>${fmt(elapsed())}<\/b><br>${puz.winInfo?puz.winInfo()+'<br>':''}Tipps: <b>${tips} von ${tipLimit()}<\/b>`;\n  if(solUsed){$('winTitle').textContent='⚠ Gelöst – aber mit Lösung';$('winText').innerHTML+='<br><b style=\"color:var(--bad)\">Die Lösung wurde angezeigt – das zählt nicht als selbst gelöst.<\/b>';}\n  else $('winTitle').textContent='🎉 Geschafft!';\n  refreshTools();\n  $('overlay').classList.add('show');\n  showMsg(solUsed?'Gelöst – aber die Lösung wurde vorher angezeigt.':`Gelöst in ${fmt(elapsed())} mit ${tips} Tipps.`,solUsed?'warn':'good');\n}\nfunction toggleNotes(){\n  if(def.tools.undo){if(puz)puz.undo();return;}\n  if(!def.tools.notes)return;\n  noteMode=!noteMode;\n  $('btnNotes').textContent=(def.tools.notesLabel||'✎ Notizen')+': '+(noteMode?'ein':'aus');\n  $('btnNotes').classList.toggle('on',noteMode);\n}\n\n/* Ereignisse */\n$('btnNew').addEventListener('click',startGame);\n$('btnCheck').addEventListener('click',check);\n$('btnSubmit').addEventListener('click',submitPuz);\n$('btnHint').addEventListener('click',hint);\n$('btnReset').addEventListener('click',resetGame);\n$('btnSolve').addEventListener('click',showSolution);\n$('btnPrint').addEventListener('click',()=>{if(puz){puz.clearSelection();}window.print();});\n$('btnNotes').addEventListener('click',toggleNotes);\n$('btnWinNew').addEventListener('click',()=>{$('overlay').classList.remove('show');showSetup();});\n$('btnWinClose').addEventListener('click',()=>$('overlay').classList.remove('show'));\n$('autoCheck').addEventListener('change',()=>{if(puz)puz.applyAutoCheck($('autoCheck').checked);});\n\ndocument.addEventListener('keydown',e=>{\n  if($('overlay').classList.contains('show')||!puz)return;\n  if(e.ctrlKey||e.metaKey||e.altKey)return;\n  const t=e.target;\n  if(e.key===' '&&t&&t.closest&&t.closest('button,input,summary,select,textarea'))return;   // Leertaste bedient dann das Bedienelement\n  if((e.key==='n'||e.key==='N')&&def.tools.notes&&!def.tools.undo){toggleNotes();return;}\n  if((e.key==='z'||e.key==='Z'||e.key==='Backspace')&&def.tools.undo&&puz.undo){puz.undo();e.preventDefault();return;}\n  if(puz.keydown(e))e.preventDefault();\n});\n\n/* Einbettung: Höhe an die Plattform melden */\nfunction setupEmbed(){\n  document.body.classList.add('embed');\n  if(window.parent===window)return;\n  const send=()=>window.parent.postMessage({type:'raetsel-height',id:def.id,h:Math.ceil(document.body.getBoundingClientRect().height)},'*');\n  if(window.ResizeObserver)new ResizeObserver(send).observe(document.body);\n  window.addEventListener('load',send);\n  send();\n}\n\n/* Start */\n(function init(){\n  loadStore();\n  $('gameTitle').textContent=def.title;\n  $('sub').textContent=def.intro;\n  $('newTitle').textContent=def.newLabel||'Neues '+def.name;\n  $('btnNew').textContent=def.newLabel?def.newLabel+' starten':'Neues '+def.name+' erstellen';\n  $('sizeLbl').textContent=def.sizeTitle||'Grösse';\n  if(def.tools.undo)$('btnNotes').textContent='↶ Zug zurück';\n  else if(def.tools.notesLabel)$('btnNotes').textContent=def.tools.notesLabel+': aus';\n  if(def.tools.auto===false)$('autoCheck').parentElement.style.display='none';\n  if(def.tools.legend===false)document.querySelector('.legend').style.display='none';\n  $('rulesTitle').textContent='So geht '+def.name;\n  $('btnNotes').style.display=(def.tools.notes||def.tools.undo)?'':'none';\n  $('btnHint').classList.toggle('full',!(def.tools.notes||def.tools.undo));\n  document.title=def.title+' – Rätsel-Trainer';\n  if(EMBED)setupEmbed();\n  buildOptions();\n  showSetup();\n})();\n\n<\/script>\n<\/body>\n<\/html>\n"
 },
 {
  "id": "nonogramm",
  "name": "Nonogramm",
  "icon": "🖼️",
  "intro": "Die Zahlen am Rand verraten, wo die schwarzen Blöcke liegen – so entsteht ein Bild.",
  "html": "<!doctype html>\n<html lang=\"de-CH\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Nonogramm – Rätsel-Trainer<\/title>\n<style>\n:root{\n  /* Farben nach flade.ch: Weiss als Grund, Anthrazit für Text, Limettengrün #aecb35 als Akzent */\n  --bg:#ffffff; --card:#f8faf0; --ink:#231f20; --muted:#5f6657;\n  --line:#d3dbbd; --thick:#231f20; --given:#231f20; --user:#46640f;\n  --sel:#dbe9a0; --peer:#f4f8e2; --same:#e7f0bd;\n  --ok:#15803d; --okbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2;\n  --hint:#92400e; --hintbg:#fef3c7;\n  --accent:#aecb35; --accent-bg:#f1f7d9; --accent-dark:#5d7410; --lime:#aecb35;\n  --water:#e6f1f5;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,\"Segoe UI\",Arial,sans-serif;}\n.wrap{max-width:980px;margin:0 auto;padding:16px;}\n\n/* Kopf */\n.top{display:flex;align-items:center;gap:16px;margin:2px 0 14px;padding-bottom:12px;border-bottom:3px solid var(--lime)}\n.logo{height:58px;width:auto;display:block;flex:none}\n.titlebox h1{margin:0;font-size:1.7rem;line-height:1.15}\n.sub{color:var(--muted);margin:2px 0 0}\n/* Layout */\n.layout{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}\n.left{flex:1 1 420px;min-width:280px}\n.right{flex:0 1 300px;min-width:260px;display:flex;flex-direction:column;gap:12px}\n.card{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(35,31,32,.06)}\n.card h2{font-size:1.05rem;margin:0 0 8px}\nlabel.small{font-size:.9rem;color:var(--muted);display:block;margin-bottom:4px}\n.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}\n.seg button{flex:1 1 auto;border:2px solid var(--line);background:#fff;border-radius:8px;padding:7px 8px;font:inherit;cursor:pointer;color:var(--ink)}\n.seg button.on{border-color:var(--accent);background:var(--accent-bg);font-weight:bold}\n.lvldesc{font-size:.9rem;color:var(--muted);min-he
