<style>
:root{--bg:#ffffff;--ink:#231f20;--muted:#5f6657;--line:#d3dbbd;--accent:#aecb35;--accent-bg:#f1f7d9;--accent-dark:#5d7410;--lime:#aecb35}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,"Segoe UI",Arial,sans-serif;}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 0}
.top{display:flex;align-items:center;gap:16px;margin:2px 0 14px;padding-bottom:12px;border-bottom:3px solid var(--lime)}
.logo{height:58px;width:auto;display:block;flex:none}
.titlebox h1{margin:0;font-size:1.7rem;line-height:1.15}
.sub{color:var(--muted);margin:2px 0 0}
.tabs{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.tabs button{flex:1 1 140px;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font:inherit;font-size:1.05rem;cursor:pointer;color:var(--ink)}
.tabs button:hover{border-color:var(--accent)}
.tabs button.on{border-color:var(--accent);background:var(--accent);color:var(--ink);font-weight:bold}
.tabs .ic{font-size:1.15rem;line-height:1}

iframe{display:block;width:100%;height:900px;border:0;background:transparent}
noscript{display:block;padding:12px;background:#fef3c7;border-radius:8px}
@media (max-width:520px){.logo{height:46px}.titlebox h1{font-size:1.4rem}}
@media print{body{background:#fff}.top,.tabs{display:none}.wrap{padding:0}}
button:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
</style>
</head>

  "html": "<!doctype html>\n<html lang=\"de-CH\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Sudoku – Rätsel-Trainer<\/title>\n<style>\n:root{\n  /* Farben nach flade.ch: Weiss als Grund, Anthrazit für Text, Limettengrün #aecb35 als Akzent */\n  --bg:#ffffff; --card:#f8faf0; --ink:#231f20; --muted:#5f6657;\n  --line:#d3dbbd; --thick:#231f20; --given:#231f20; --user:#46640f;\n  --sel:#dbe9a0; --peer:#f4f8e2; --same:#e7f0bd;\n  --ok:#15803d; --okbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2;\n  --hint:#92400e; --hintbg:#fef3c7;\n  --accent:#aecb35; --accent-bg:#f1f7d9; --accent-dark:#5d7410; --lime:#aecb35;\n  --water:#e6f1f5;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,\"Segoe UI\",Arial,sans-serif;}\n.wrap{max-width:980px;margin:0 auto;padding:16px;}\n\n/* Kopf */\n.top{display:flex;align-items:center;gap:16px;margin:2px 0 14px;padding-bottom:12px;border-bottom:3px solid var(--lime)}\n.logo{height:58px;width:auto;display:block;flex:none}\n.titlebox h1{margin:0;font-size:1.7rem;line-height:1.15}\n.sub{color:var(--muted);margin:2px 0 0}\n/* Layout */\n.layout{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}\n.left{flex:1 1 420px;min-width:280px}\n.right{flex:0 1 300px;min-width:260px;display:flex;flex-direction:column;gap:12px}\n.card{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(35,31,32,.06)}\n.card h2{font-size:1.05rem;margin:0 0 8px}\nlabel.small{font-size:.9rem;color:var(--muted);display:block;margin-bottom:4px}\n.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}\n.seg button{flex:1 1 auto;border:2px solid var(--line);background:#fff;border-radius:8px;padding:7px 8px;font:inherit;cursor:pointer;color:var(--ink)}\n.seg button.on{border-color:var(--accent);background:var(--accent-bg);font-weight:bold}\n.lvldesc{font-size:.9rem;color:var(--muted);min-height:2.4em;margin:0 0 10px}\n.btn{border:none;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer;background:#e5e7eb;color:var(--ink)}\n.btn:hover{filter:brightness(.95)}\n.btn.primary{background:var(--accent);color:var(--ink);font-weight:bold}\n.btn.primary:hover{background:#9db92d}\n.btn.on{background:var(--accent-dark);color:#fff}\n.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.btns .full{grid-column:1/-1}\n.stats{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}\n.stats b{font-variant-numeric:tabular-nums}\nbutton:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}\n\n/* Spielfeld (gemeinsam) */\n.board{\n  width:min(100%,520px); aspect-ratio:1/1; margin:0 auto;\n  display:grid; grid-template-columns:repeat(var(--cols,var(--n)),1fr); grid-template-rows:repeat(var(--cols,var(--n)),1fr);\n  border:3px solid var(--thick); background:#fff; user-select:none; touch-action:manipulation;\n}\n.cell{\n  display:flex;align-items:center;justify-content:center;position:relative;\n  border-right:1px solid var(--line);border-bottom:1px solid var(--line);\n  font-size:calc(min(100vw - 40px,520px) / var(--n) * .55);\n  cursor:pointer;color:var(--user);\n}\n.cell.tr{border-right:3px solid var(--thick)}\n.cell.tb{border-bottom:3px solid var(--thick)}\n.cell.lastc{border-right:none}\n.cell.lastr{border-bottom:none}\n.cell.water{background:var(--water)}\n.cell.peer{background:var(--peer)}\n.cell.same{background:var(--same)}\n.cell.sel{background:var(--sel)}\n.cell.given{color:var(--given);font-weight:bold}\n.cell.hint{color:var(--hint);background:var(--hintbg)}\n.cell.ok{color:var(--ok);background:var(--okbg)}\n.cell.bad{color:var(--bad);background:var(--badbg)}\n.cell.sel.ok,.cell.sel.bad,.cell.sel.hint{outline:3px solid var(--accent);outline-offset:-3px}\n.cell.water.ok,.cell.water.bad,.cell.water.hint{outline:0}\n.notes{position:absolute;inset:2px;display:grid;font-size:calc(min(100vw - 40px,520px) / var(--n) * .22);color:#64748b;line-height:1;font-weight:normal}\n.notes span{display:flex;align-items:center;justify-content:center}\n\n/* Eingabe */\n.pad{display:grid;gap:6px;margin:12px auto 0;width:min(100%,520px)}\n.pad button{font:inherit;font-size:1.4rem;padding:10px 0;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}\n.pad button.del{font-size:1rem}\n.pad button.done{opacity:.35}\n.padhelp{margin:12px auto 0;width:min(100%,520px);font-size:.95rem;color:var(--muted);text-align:center}\n.msg{margin:12px auto 0;width:min(100%,520px);padding:10px 12px;border-radius:8px;display:none;font-size:1rem}\n.msg.show{display:block}\n.msg.info{background:#e0f2fe;color:#075985}\n.msg.good{background:var(--okbg);color:#14532d}\n.msg.warn{background:var(--badbg);color:#7f1d1d}\n.toggle{display:flex;gap:8px;align-items:center;font-size:.95rem;margin-top:6px;cursor:pointer}\ndetails summary{cursor:pointer;font-weight:bold}\ndetails ul{padding-left:18px;margin:8px 0 0}\ndetails li{margin-bottom:4px}\n.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:.85rem;margin-top:8px}\n.legend span{padding:2px 6px;border-radius:5px}\n.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}\n.overlay.show{display:flex}\n.dialog{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%;text-align:center}\n.dialog h3{margin:0 0 8px;font-size:1.5rem}\n.dialog p{margin:6px 0}\n.loading{opacity:.4;pointer-events:none}\n.printhead{display:none}\n.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}\n.pad button:disabled{opacity:.35;cursor:not-allowed}\n.toggle.off{opacity:.5;cursor:not-allowed}\n\n@media (max-width:520px){\n  .logo{height:46px}\n  .titlebox h1{font-size:1.4rem}\n}\n@media print{\n  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  body{background:#fff}\n  .right,.pad,.padhelp,.msg,.sub,.titlebox,.stats,.overlay{display:none!important}\n  .top{margin:0 0 8px}\n  .logo{height:1.3cm}\n  .printhead{display:block;margin-bottom:12px;font-size:1.2rem}\n  .board{width:16cm}\n  .cell{font-size:calc(16cm / var(--n) * .55)}\n  .cell.peer,.cell.same,.cell.sel{background:#fff}\n}\n\n/* Eingebettet in die Plattform: Kopf wird von der Plattform gezeigt */\nbody.embed .top{display:none}\nbody.embed .wrap{padding-top:0}\n@media print{body.embed .top{display:flex}}\n\n/* Kennzeichnung «Lösung angezeigt» */\n#stStatus.bad{color:var(--bad)}\n#stStatus.good{color:var(--ok)}\n.solbanner{display:none;background:#b91c1c;color:#fff;font-weight:bold;text-align:center;padding:8px 10px;border-radius:8px;margin-bottom:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n#stage{position:relative}\n#stage.sol{outline:4px solid #b91c1c;outline-offset:2px}\n#stage.sol::after{content:\"\";position:absolute;inset:0;pointer-events:none;z-index:5;background:url(\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='170'><text x='130' y='90' text-anchor='middle' font-family='Arial' font-size='22' font-weight='bold' fill='%23b91c1c' fill-opacity='.38' transform='rotate(-25 130 85)'>LÖSUNG ANGEZEIGT<\/text><\/svg>\") repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n\n/* Sudoku braucht keine Zusatzformatierung (Blockränder kommen aus dem Kern) */\n\n\n.setup-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:260px;padding:28px 18px;text-align:center;border:2px dashed var(--line,#cbd5e1);border-radius:16px;background:#f8fafc;color:#334155}\n.setup-ph .big{font-size:40px;line-height:1}\n.setup-ph h3{margin:0;font-size:1.15rem}\n.setup-ph p{margin:0;max-width:34ch;font-size:.95rem}\n.setup-ph .chosen{font-weight:700;color:#0f172a}\n.setup-ph .btn{margin-top:6px;min-width:220px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <img class=\"logo\" src=\"data:image/png;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==\" alt=\"Logo\">\n    <div class=\"titlebox\">\n      <h1 id=\"gameTitle\">Rätsel-Trainer<\/h1>\n      <p class=\"sub\" id=\"sub\"><\/p>\n    <\/div>\n  <\/header>\n\n    <div class=\"layout\">\n    <div class=\"left\">\n      <div class=\"printhead\"><span id=\"phTitle\"><\/span> &nbsp;&nbsp; Name: ______________________<\/div>\n      <div class=\"stats\">\n        <span>Niveau: <b id=\"stLevel\">–<\/b><\/span>\n        <span>Zeit: <b id=\"stTime\">00:00<\/b><\/span>\n        <span>Tipps: <b id=\"stTips\">0<\/b><\/span>\n        <span style=\"display:none\">Prüfungen: <b id=\"stChecks\">0<\/b><\/span>\n        <span>Status: <b id=\"stStatus\">in Arbeit<\/b><\/span>\n      <\/div>\n      <div id=\"solBanner\" class=\"solbanner\" role=\"alert\">⚠ LÖSUNG ANGEZEIGT – dieses Rätsel zählt nicht als selbst gelöst<\/div>\n      <div id=\"stage\"><\/div>\n      <div id=\"pad\"><\/div>\n      <div class=\"msg\" id=\"msg\" role=\"status\" aria-live=\"polite\"><\/div>\n    <\/div>\n\n    <div class=\"right\">\n      <div class=\"card\">\n        <h2 id=\"newTitle\">Neues Rätsel<\/h2>\n        <label class=\"small\" id=\"sizeLbl\">Grösse<\/label>\n        <div class=\"seg\" id=\"sizeSeg\"><\/div>\n        <label class=\"small\">Niveau<\/label>\n        <div class=\"seg\" id=\"lvlSeg\"><\/div>\n        <p class=\"lvldesc\" id=\"lvlDesc\"><\/p>\n        <button class=\"btn primary\" style=\"width:100%\" id=\"btnNew\">Neues Rätsel erstellen<\/button>\n      <\/div>\n\n      <div class=\"card\">\n        <h2>Werkzeuge<\/h2>\n        <div class=\"btns\">\n          <button class=\"btn primary full\" id=\"btnSubmit\" disabled title=\"Erst alle Felder ausfüllen\">📥 Abgeben<\/button>\n          <button class=\"btn full\" id=\"btnCheck\" style=\"display:none\">✔ Überprüfen<\/button>\n          <button class=\"btn\" id=\"btnNotes\">✎ Notizen: aus<\/button>\n          <button class=\"btn\" id=\"btnHint\">💡 Tipp<\/button>\n          <button class=\"btn\" id=\"btnReset\">↺ Neu beginnen<\/button>\n          <button class=\"btn\" id=\"btnSolve\">Lösung zeigen<\/button>\n          <button class=\"btn full\" id=\"btnPrint\">🖨 Drucken<\/button>\n        <\/div>\n        <label class=\"toggle\" style=\"display:none\"><input type=\"checkbox\" id=\"autoCheck\"> Fehler sofort rot anzeigen<\/label>\n        <div class=\"legend\">\n          <span style=\"background:var(--okbg);color:var(--ok)\">richtig<\/span>\n          <span style=\"background:var(--badbg);color:var(--bad)\">falsch<\/span>\n          <span style=\"background:var(--hintbg);color:var(--hint)\">Tipp<\/span>\n          <span style=\"font-weight:bold\">vorgegeben<\/span>\n        <\/div>\n      <\/div>\n\n      <div class=\"card\">\n        <details>\n          <summary id=\"rulesTitle\">So geht's<\/summary>\n          <ul id=\"rules\"><\/ul>\n        <\/details>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <div class=\"dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"winTitle\">\n    <h3 id=\"winTitle\">🎉 Geschafft!<\/h3>\n    <p id=\"winText\"><\/p>\n    <p id=\"winTip\" style=\"font-size:.9rem;color:var(--muted)\">Tipp: Mach einen Screenshot für dein Lernjournal.<\/p>\n    <button class=\"btn primary\" id=\"btnWinNew\" style=\"margin-top:10px\">Nächstes Rätsel<\/button>\n    <button class=\"btn\" id=\"btnWinClose\" style=\"margin-top:10px\">Schliessen<\/button>\n  <\/div>\n<\/div>\n\n<script>\n'use strict';\n/* =====================================================================\n   KERN – gemeinsam für alle Rätsel (wird in jede Rätsel-Datei eingebaut)\n   Enthält: Hilfsfunktionen und die Basisklasse GridPuzzle.\n   Ein Rätsel erbt von GridPuzzle und meldet sich mit  const GAME = {...}  an.\n   ===================================================================== */\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction randOf(a){return a[Math.floor(Math.random()*a.length)];}\nconst LEVEL_NAMES={sl:'Sehr leicht',l:'Leicht',m:'Mittel',s:'Schwer',ss:'Sehr schwer',us:'Ultraschwer'};\n\nclass GridPuzzle{\n  constructor(def,size,lvlKey,data){\n    this.def=def; this.n=size; this.lvlKey=lvlKey;\n    this.sol=data.sol; this.cur=data.puz.slice();\n    this.given=data.puz.map(v=>v>0);\n    this.hinted=new Array(size*size).fill(false);\n    this.mark=new Array(size*size).fill(0);          // 0 nichts, 1 richtig, 2 falsch\n    this.sel=-1; this.done=false; this.locked=false; this.cells=[]; this.ctx=null;\n  }\n\n  /* --- Hooks, die Unterklassen überschreiben --- */\n  baseClass(i){return 'cell';}\n  extraClass(i){return i===this.sel?' sel':'';}\n  paint(i,d){}                                       // Zelleninhalt zeichnen\n  onCell(i){this.sel=i;this.refresh();}\n  handleKey(e){return false;}\n  buildPad(pad){pad.className='padhelp';pad.textContent=this.def.padHelp||'';}\n  afterSet(i,v){}\n  afterReset(){}\n  afterRefresh(){}\n  cellState(i){const v=this.cur[i];if(!v)return 'empty';return v===this.sol[i]?'right':'wrong';}\n  solved(){return this.cur.every((v,k)=>v===this.sol[k]);}\n  pickHint(){\n    const open=[];\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]&&this.cur[i]!==this.sol[i])open.push(i);\n    if(!open.length)return null;\n    const i=(this.sel>=0&&open.includes(this.sel))?this.sel:randOf(open);\n    return {i,text:'Ein Feld wurde mit einem Tipp ausgefüllt (gelb).'};\n  }\n  revealEmpty(i){this.hinted[i]=true;}\n\n  /* --- gemeinsame Abläufe --- */\n  buildBoard(){\n    const b=document.createElement('div');\n    b.className='board g-'+this.def.id;\n    b.style.setProperty('--n',this.n);\n    b.setAttribute('aria-label',this.def.name+'-Feld');\n    this.cells=[];\n    for(let i=0;i<this.n*this.n;i++){\n      const d=document.createElement('div');\n      d.addEventListener('click',()=>this.onCell(i));\n      b.appendChild(d);this.cells.push(d);\n    }\n    return b;\n  }\n  mount(ctx,stage,pad){\n    this.ctx=ctx;\n    stage.innerHTML='';\n    stage.appendChild(this.buildBoard());\n    pad.className='';pad.removeAttribute('style');pad.innerHTML='';\n    this.buildPad(pad);\n    this.refresh();\n  }\n  refresh(){\n    for(let i=0;i<this.cur.length;i++){\n      const d=this.cells[i];\n      let cls=this.baseClass(i);\n      if(this.given[i])cls+=' given';\n      if(this.hinted[i])cls+=' hint';\n      if(this.mark[i]===1)cls+=' ok';\n      if(this.mark[i]===2)cls+=' bad';\n      cls+=this.extraClass(i);\n      d.className=cls;\n      this.paint(i,d);\n    }\n    this.afterRefresh();\n  }\n  commit(){this.ctx.hideMsg();this.refresh();this.ctx.changed();}\n  setCell(i,v){\n    this.cur[i]=v;this.hinted[i]=false;this.mark[i]=0;\n    if(v&&this.ctx.autoCheck()&&v!==this.sol[i])this.mark[i]=2;\n    this.afterSet(i,v);\n  }\n  editable(){return !this.done&&!this.locked&&this.sel>=0&&!this.given[this.sel];}\n  keydown(e){\n    if(this.handleKey(e))return true;\n    const k=e.key,N=this.n;\n    if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))return false;\n    if(this.sel<0)this.sel=0;\n    else{\n      const r=Math.floor(this.sel/N),c=this.sel%N;\n      if(k==='ArrowLeft'&&c>0)this.sel--;\n      if(k==='ArrowRight'&&c<N-1)this.sel++;\n      if(k==='ArrowUp'&&r>0)this.sel-=N;\n      if(k==='ArrowDown'&&r<N-1)this.sel+=N;\n    }\n    this.refresh();return true;\n  }\n  check(){\n    let wrong=0,empty=0,right=0;\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i]||this.hinted[i])continue;\n      const s=this.cellState(i);\n      if(s==='empty'){empty++;this.mark[i]=0;}\n      else if(s==='skip')this.mark[i]=0;\n      else if(s==='right'){this.mark[i]=1;right++;}\n      else{this.mark[i]=2;wrong++;}\n    }\n    this.refresh();\n    return {wrong,empty,right};\n  }\n  hint(){\n    const p=this.pickHint();\n    if(!p)return null;\n    this.cur[p.i]=this.sol[p.i];this.hinted[p.i]=true;this.mark[p.i]=0;\n    this.afterSet(p.i,this.sol[p.i]);\n    this.sel=p.i;this.refresh();\n    return p.text;\n  }\n  reset(){\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]){this.cur[i]=0;this.hinted[i]=false;}\n    this.mark.fill(0);this.sel=-1;this.done=false;\n    this.afterReset();this.refresh();\n  }\n  reveal(){\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i])continue;\n      if(this.cur[i]&&this.cur[i]!==this.sol[i])this.mark[i]=2;\n      else if(this.cur[i]===this.sol[i])this.mark[i]=1;\n      else this.revealEmpty(i);\n      this.cur[i]=this.sol[i];\n    }\n    this.afterReset();   // Notizen o. Ä. löschen\n    this.done=true;this.refresh();\n  }\n  finish(){\n    this.done=true;\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]&&!this.hinted[i])this.mark[i]=1;\n    this.refresh();\n  }\n  applyAutoCheck(on){\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i]||this.hinted[i])continue;\n      if(!on&&this.mark[i]===2)this.mark[i]=0;\n      if(on&&this.cur[i]&&this.cur[i]!==this.sol[i])this.mark[i]=2;\n    }\n    this.refresh();\n  }\n  clearSelection(){this.sel=-1;this.refresh();}\n  /* Alle Felder ausgefüllt? (Rätsel mit Wasser/Kreuzen überschreiben das.) */\n  complete(){return this.cur.every(v=>v>0);}\n  /* Vollständig, aber falsch: Fehler rot zeigen und das Rätsel sperren – es gibt kein Korrigieren mehr. */\n  lock(){\n    this.locked=true;this.drag=null;\n    this.check();                                         // markiert die falschen Felder rot\n    for(let i=0;i<this.mark.length;i++)if(this.mark[i]===1)this.mark[i]=0;\n    this.sel=-1;this.refresh();\n  }\n}\n\n\n/* =====================================================================\n   RÄTSEL-MODUL: Sudoku\n   ===================================================================== */\n/* ===== LOGIK-START ===== */\n/* ---------- Sudoku ---------- */\nconst SUDOKU_BLOCKS={4:[2,2],6:[2,3],9:[3,3]};   // [Zeilen pro Block, Spalten pro Block]\n\nfunction sdGeo(n){\n  const [BR,BC]=SUDOKU_BLOCKS[n], N=n, units=[];\n  for(let r=0;r<N;r++){const u=[];for(let c=0;c<N;c++)u.push(r*N+c);units.push(u);}\n  for(let c=0;c<N;c++){const u=[];for(let r=0;r<N;r++)u.push(r*N+c);units.push(u);}\n  for(let br=0;br<N;br+=BR)for(let bc=0;bc<N;bc+=BC){\n    const u=[];for(let r=br;r<br+BR;r++)for(let c=bc;c<bc+BC;c++)u.push(r*N+c);units.push(u);\n  }\n  const peerSets=Array.from({length:N*N},()=>new Set());\n  for(const u of units)for(const a of u)for(const b of u)if(a!==b)peerSets[a].add(b);\n  return {N,BR,BC,units,peerSets,peers:peerSets.map(s=>[...s])};\n}\nfunction sdCandidates(geo,g,i){\n  const used=new Array(geo.N+1).fill(false);\n  for(const p of geo.peers[i])used[g[p]]=true;\n  const res=[];for(let v=1;v<=geo.N;v++)if(!used[v])res.push(v);\n  return res;\n}\nfunction sdFill(geo,g){\n  const i=g.indexOf(0); if(i<0)return true;\n  for(const v of shuffle(sdCandidates(geo,g,i))){g[i]=v;if(sdFill(geo,g))return true;}\n  g[i]=0;return false;\n}\nfunction sdCount(geo,g,limit){\n  let best=-1,bestC=null;\n  for(let i=0;i<g.length;i++){\n    if(g[i])continue;\n    const c=sdCandidates(geo,g,i);\n    if(!c.length)return 0;\n    if(!bestC||c.length<bestC.length){best=i;bestC=c;if(c.length===1)break;}\n  }\n  if(best<0)return 1;\n  let n=0;\n  for(const v of bestC){g[best]=v;n+=sdCount(geo,g,limit-n);if(n>=limit)break;}\n  g[best]=0;return n;\n}\n/* Lösbar nur mit einfachen Strategien (einzige Möglichkeit im Feld / in Zeile, Spalte, Block)? */\nfunction sdLogic(geo,p){\n  const g=p.slice(); let changed=true;\n  while(changed){\n    changed=false;\n    for(let i=0;i<g.length;i++){\n      if(g[i])continue;\n      const c=sdCandidates(geo,g,i);\n      if(c.length===0)return false;\n      if(c.length===1){g[i]=c[0];changed=true;}\n    }\n    if(changed)continue;\n    for(const u of geo.units){\n      for(let v=1;v<=geo.N;v++){\n        if(u.some(i=>g[i]===v))continue;\n        const pos=u.filter(i=>!g[i]&&sdCandidates(geo,g,i).includes(v));\n        if(pos.length===1){g[pos[0]]=v;changed=true;}\n      }\n    }\n  }\n  return g.every(v=>v);\n}\n/* ===== Kandidaten-Löser mit Technik-Stufen =====\n   1 einzige Möglichkeit (nackt/versteckt) · 2 Paare/Drillinge, Block-Zeile-Wechselwirkung\n   3 X-Wing/Schwertfisch, XY-Wing · 4 Annahme mit Folgerungen (Verzweigung) */\nfunction sdPop(m){let c=0;while(m){m&=m-1;c++;}return c;}\nfunction sdState(geo,p){\n  const N=geo.N,full=((1<<(N+1))-1)&~1,cand=new Array(N*N).fill(full);\n  const st={geo,cand,bad:false};\n  for(let i=0;i<p.length;i++)if(p[i]&&!sdAssign(st,i,p[i]))break;\n  return st;\n}\nfunction sdAssign(st,i,v){\n  const b=1<<v;\n  if(!(st.cand[i]&b)){st.bad=true;return false;}\n  st.cand[i]=b;\n  for(const q of st.geo.peers[i]){\n    if(st.cand[q]&b){\n      st.cand[q]&=~b;\n      if(!st.cand[q]){st.bad=true;return false;}\n    }\n  }\n  return true;\n}\nfunction sdElim(st,i,mask){\n  const old=st.cand[i];\n  if(!(old&mask))return false;\n  st.cand[i]=old&~mask;\n  if(!st.cand[i])st.bad=true;\n  return true;\n}\nfunction sdSolvedAll(st){return st.cand.every(c=>sdPop(c)===1);}\n/* Stufe 1 */\nfunction sdSingles(st){\n  const {geo,cand}=st,N=geo.N;let any=false;\n  for(let i=0;i<cand.length;i++){\n    if(sdPop(cand[i])===1){\n      const v=31-Math.clz32(cand[i]);\n      for(const q of geo.peers[i])if(cand[q]&cand[i]){if(!sdElim(st,q,cand[i]))continue;any=true;if(st.bad)return true;}\n    }\n  }\n  for(const u of geo.units){\n    for(let v=1;v<=N;v++){\n      const b=1<<v;let pos=-1,n=0,fixed=false;\n      for(const i of u){if(cand[i]===b){fixed=true;break;}if(cand[i]&b){n++;pos=i;}}\n      if(fixed)continue;\n      if(n===0){st.bad=true;return true;}\n      if(n===1){cand[pos]=b;any=true;}\n    }\n  }\n  return any;\n}\n/* Stufe 2: Block-Zeile-Wechselwirkung, Paare/Drillinge */\nfunction sdLocked(st){\n  const {geo,cand}=st,N=geo.N;let any=false;\n  const rows=geo.units.slice(0,N),cols=geo.units.slice(N,2*N),blocks=geo.units.slice(2*N);\n  const lines=rows.concat(cols);\n  for(const blk of blocks)for(let v=1;v<=N;v++){\n    const b=1<<v,pos=blk.filter(i=>cand[i]&b&&cand[i]!==b);\n    if(pos.length<2||blk.some(i=>cand[i]===b))continue;\n    for(const ln of lines){\n      if(pos.every(i=>ln.includes(i))){\n        for(const q of ln)if(!blk.includes(q)&&sdElim(st,q,b))any=true;\n      }\n    }\n  }\n  for(const ln of lines)for(let v=1;v<=N;v++){\n    const b=1<<v;\n    if(ln.some(i=>cand[i]===b))continue;\n    const pos=ln.filter(i=>cand[i]&b);\n    if(pos.length<2)continue;\n    for(const blk of blocks){\n      if(pos.every(i=>blk.includes(i))){\n        for(const q of blk)if(!ln.includes(q)&&sdElim(st,q,b))any=true;\n      }\n    }\n  }\n  return any;\n}\nfunction sdSubsets(st,maxK){\n  const {geo,cand}=st,N=geo.N;let any=false;\n  for(const u of geo.units){\n    const open=u.filter(i=>sdPop(cand[i])>1);\n    // nackte k-Mengen\n    for(let k=2;k<=maxK;k++){\n      const comb=(start,chosen,uni)=>{\n        if(chosen.length===k){\n          if(sdPop(uni)===k){for(const q of open)if(!chosen.includes(q)&&sdElim(st,q,uni))any=true;}\n          return;\n        }\n        for(let a=start;a<open.length;a++){\n          const nu=uni|cand[open[a]];\n          if(sdPop(nu)>k)continue;\n          comb(a+1,chosen.concat(open[a]),nu);\n        }\n      };\n      comb(0,[],0);\n    }\n    // versteckte k-Mengen\n    const vals=[];for(let v=1;v<=N;v++){const b=1<<v;if(!u.some(i=>cand[i]===b))vals.push(v);}\n    for(let k=2;k<=maxK;k++){\n      const comb=(start,chosen,cells)=>{\n        if(chosen.length===k){\n          if(cells.length===k){\n            let keep=0;for(const v of chosen)keep|=1<<v;\n            for(const q of cells)if(cand[q]&~keep&&sdElim(st,q,cand[q]&~keep))any=true;\n          }\n          return;\n        }\n        for(let a=start;a<vals.length;a++){\n          const b=1<<vals[a],cs=new Set(cells);\n          for(const i of u)if(cand[i]&b)cs.add(i);\n          if(cs.size>k)continue;\n          comb(a+1,chosen.concat(vals[a]),[...cs]);\n        }\n      };\n      comb(0,[],[]);\n    }\n  }\n  return any;\n}\n/* Stufe 3: Fische (X-Wing, Schwertfisch) und XY-Wing */\nfunction sdFish(st,maxK){\n  const {geo,cand}=st,N=geo.N;let any=false;\n  for(let v=1;v<=N;v++){\n    const b=1<<v;\n    for(const byRow of [true,false]){\n      const base=[];\n      for(let a=0;a<N;a++){\n        const pos=[];for(let c=0;c<N;c++){const i=byRow?a*N+c:c*N+a;if(cand[i]&b)pos.push(c);}\n        const placed=pos.some(c=>cand[byRow?a*N+c:c*N+a]===b);\n        if(!placed&&pos.length>=2&&pos.length<=maxK)base.push({a,pos});\n      }\n      for(let k=2;k<=maxK;k++){\n        const comb=(start,chosen,cov)=>{\n          if(chosen.length===k){\n            if(cov.size===k){\n              for(const c of cov)for(let a=0;a<N;a++){\n                if(chosen.some(x=>x.a===a))continue;\n                const i=byRow?a*N+c:c*N+a;\n                if(sdElim(st,i,b))any=true;\n              }\n            }\n            return;\n          }\n          for(let x=start;x<base.length;x++){\n            const nc=new Set(cov);base[x].pos.forEach(c=>nc.add(c));\n            if(nc.size>k)continue;\n            comb(x+1,chosen.concat(base[x]),nc);\n          }\n        };\n        comb(0,[],new Set());\n      }\n    }\n  }\n  return any;\n}\nfunction sdXYWing(st){\n  const {geo,cand}=st;let any=false;\n  const bi=[];for(let i=0;i<cand.length;i++)if(sdPop(cand[i])===2)bi.push(i);\n  for(const p of bi){\n    const peersP=bi.filter(q=>geo.peerSets[p].has(q));\n    for(const w1 of peersP)for(const w2 of peersP){\n      if(w1>=w2)continue;\n      const a=cand[p],c1=cand[w1],c2=cand[w2];\n      const common=c1&c2&~a;\n      if(sdPop(common)!==1)continue;\n      if((c1&a)===0||(c2&a)===0||(c1&a)===(c2&a))continue;\n      if((c1|c2|a)!==(a|common))continue;\n      for(let q=0;q<cand.length;q++){\n        if(q===p||q===w1||q===w2)continue;\n        if(geo.peerSets[w1].has(q)&&geo.peerSets[w2].has(q)&&sdElim(st,q,common))any=true;\n      }\n    }\n  }\n  return any;\n}\n/* Stufe 4: Annahme mit Folgerungen. Zwei-Kandidaten-Feld: beide Möglichkeiten durchrechnen (mit Stufe 1–2).\n   Widerspruch → die Annahme ist falsch. Gleiches Ergebnis in beiden Fällen → gilt sicher. */\nfunction sdBranch(st,inner){\n  const {geo,cand}=st;let any=false;\n  const cells=[];for(let i=0;i<cand.length;i++)if(sdPop(cand[i])===2)cells.push(i);\n  for(const i of cells){\n    if(sdPop(cand[i])!==2)continue;\n    const vs=[];for(let v=1;v<=geo.N;v++)if(cand[i]&(1<<v))vs.push(v);\n    const res=[];\n    for(const v of vs){\n      const t={geo,cand:cand.slice(),bad:false};\n      sdAssign(t,i,v);\n      if(!t.bad)sdRun(t,inner);\n      res.push(t);\n    }\n    if(res[0].bad&&res[1].bad){st.bad=true;return true;}\n    for(let k=0;k<2;k++){\n      if(res[k].bad){const v=vs[1-k];sdAssign(st,i,v);any=true;if(st.bad)return true;break;}\n    }\n    if(any)return true;\n    for(let q=0;q<cand.length;q++){\n      const u=res[0].cand[q]|res[1].cand[q];       // in mindestens einem Fall möglich\n      if(cand[q]&~u){sdElim(st,q,cand[q]&~u);any=true;}\n    }\n    if(any)return true;\n  }\n  return any;\n}\n/* bis Stufe t folgern; immer die einfachste anwendbare Technik zuerst. Liefert die höchste benutzte Stufe. */\nfunction sdRun(st,t){\n  let used=0;\n  for(;;){\n    if(st.bad||sdSolvedAll(st))return used;\n    let hit=0;\n    if(sdSingles(st))hit=1;\n    else if(t>=2&&(sdLocked(st)||sdSubsets(st,3)))hit=2;\n    else if(t>=3&&(sdFish(st,3)||sdXYWing(st)))hit=3;\n    else if(t>=4&&sdBranch(st,3))hit=4;\n    if(!hit)return used;\n    if(hit>used)used=hit;\n    if(hit===4)st.branches=(st.branches||0)+1;\n  }\n}\n/* nötige Stufe zum Lösen (0 = nicht logisch lösbar mit diesen Techniken) */\nfunction sdTier(geo,p,maxT,info){\n  for(let t=1;t<=(maxT||4);t++){\n    const st=sdState(geo,p);\n    if(st.bad)return 0;\n    sdRun(st,t);\n    if(!st.bad&&sdSolvedAll(st)){if(info)info.branches=st.branches||0;return t;}\n  }\n  return 0;\n}\n\n/* lvl: {ratio, logic (nur Einzelschritte), tier (nötige Technik-Stufe, nur 9×9), branches (mind. so viele Annahmen)} */\nfunction sdGenerate(n,lvl){\n  const geo=sdGeo(n), N=n;\n  const need=(lvl.tier&&N===9)?lvl.tier:0;\n  const s=new Array(N*N).fill(0); sdFill(geo,s);\n  const p=s.slice();\n  const target=need?0:Math.round(N*N*lvl.ratio);\n  let givens=N*N;\n  for(const i of shuffle([...Array(N*N).keys()])){\n    if(givens<=target)break;\n    const v=p[i]; p[i]=0;\n    const ok=sdCount(geo,p.slice(),2)===1 && (need||!lvl.logic||sdLogic(geo,p));\n    if(ok)givens--; else p[i]=v;\n  }\n  if(!need&&sdTier(geo,p,4)===0)return null;   // nie nur mit Raten lösbar\n  if(need){\n    const info={branches:0};\n    if(sdTier(geo,p,need,info)!==need||info.branches<(lvl.branches||0))return null;   // zu leicht (oder nicht logisch lösbar)\n  }\n  return {geo,sol:s,puz:p};\n}\n/* ===== LOGIK-ENDE ===== */\n\n/* ---------- Sudoku ---------- */\nclass SudokuPuzzle extends GridPuzzle{\n  constructor(def,size,lvlKey,data){\n    super(def,size,lvlKey,data);\n    this.geo=data.geo;\n    this.notes=new Array(size*size).fill(0);\n    this.padBtns=[];\n  }\n  baseClass(i){\n    const {N,BR,BC}=this.geo, r=Math.floor(i/N), c=i%N;\n    let cls='cell';\n    if(c===N-1)cls+=' lastc'; else if((c+1)%BC===0)cls+=' tr';\n    if(r===N-1)cls+=' lastr'; else if((r+1)%BR===0)cls+=' tb';\n    return cls;\n  }\n  extraClass(i){\n    const sv=this.sel>=0?this.cur[this.sel]:0;\n    if(i===this.sel)return ' sel';\n    if(this.sel>=0&&sv&&this.cur[i]===sv)return ' same';\n    if(this.sel>=0&&this.geo.peerSets[this.sel].has(i))return ' peer';\n    return '';\n  }\n  paint(i,d){\n    if(this.cur[i]){d.textContent=this.cur[i];return;}\n    if(this.notes[i]){\n      const box=document.createElement('div');box.className='notes';\n      box.style.gridTemplateColumns=`repeat(${this.geo.BC},1fr)`;\n      for(let v=1;v<=this.n;v++){const s=document.createElement('span');s.textContent=((this.notes[i]>>v)&1)?v:'';box.appendChild(s);}\n      d.textContent='';d.appendChild(box);\n    } else d.textContent='';\n  }\n  buildPad(pad){\n    pad.className='pad';\n    pad.style.gridTemplateColumns=`repeat(${this.n+1},1fr)`;\n    this.padBtns=[];\n    for(let v=1;v<=this.n;v++){\n      const b=document.createElement('button');b.textContent=v;b.dataset.v=v;\n      b.addEventListener('click',()=>this.input(v));pad.appendChild(b);this.padBtns.push(b);\n    }\n    const del=document.createElement('button');del.textContent='Löschen';del.className='del';\n    del.addEventListener('click',()=>this.input(0));pad.appendChild(del);\n  }\n  afterRefresh(){\n    // Ziffern ausgrauen, die schon N-mal gesetzt sind\n    for(const b of this.padBtns){\n      const v=+b.dataset.v;let cnt=0;\n      for(let k=0;k<this.cur.length;k++)if(this.cur[k]===v)cnt++;   // zählt nur, wie oft die Zahl steht – verrät nicht, ob sie stimmt\n      b.classList.toggle('done',cnt>=this.n);\n    }\n  }\n  input(v){\n    if(!this.editable())return;\n    const i=this.sel;\n    if(this.ctx.noteMode()&&v){\n      if(this.cur[i])return;\n      this.notes[i]^=(1<<v);\n    } else {\n      this.setCell(i,(v&&this.cur[i]===v)?0:v);\n    }\n    this.commit();\n  }\n  afterSet(i,v){\n    this.notes[i]=0;\n    if(v)for(const p of this.geo.peers[i])this.notes[p]&=~(1<<v);\n  }\n  afterReset(){this.notes.fill(0);}\n  handleKey(e){\n    const k=e.key;\n    if(/^[1-9]$/.test(k)&&+k<=this.n){this.input(+k);return true;}\n    if(k==='Backspace'||k==='Delete'||k==='0'){this.input(0);return true;}\n    return false;\n  }\n  pickHint(){\n    let i=-1;\n    if(this.sel>=0&&!this.given[this.sel]&&this.cur[this.sel]!==this.sol[this.sel])i=this.sel;\n    else{\n      const open=[];for(let k=0;k<this.cur.length;k++)if(this.cur[k]!==this.sol[k])open.push(k);\n      if(!open.length)return null;\n      // bevorzugt ein Feld, das man logisch finden kann: zuerst mit einfachen, dann mit allen Strategien\n      const g=this.cur.map((v,j)=>v===this.sol[j]?v:0);\n      for(const t of [1,4]){\n        const st=sdState(this.geo,g);\n        if(st.bad)break;\n        sdRun(st,t);\n        const easy=open.filter(k=>g[k]===0&&sdPop(st.cand[k])===1);\n        if(easy.length){\n          i=randOf(easy);\n          const text=t===1?'Tipp (gelb): Dieses Feld lässt sich mit den einfachen Regeln herleiten – achte auf Felder, in denen nur eine Zahl möglich ist, oder Zahlen, die in einer Zeile/Spalte/einem Block nur an einer Stelle passen.'\n                          :'Tipp (gelb): Dieses Feld ist nur mit fortgeschrittenen Strategien herleitbar (Paare, X-Wing, XY-Wing oder Annahmen mit Folgerungen).';\n          return {i,text};\n        }\n      }\n      i=randOf(open);\n    }\n    return {i,text:'Ein Feld wurde mit einem Tipp ausgefüllt (gelb).'};\n  }\n}\n\n/* ----- Anmeldung beim Kern ----- */\nconst GAME={\n    title:'Sudoku-Trainer',\n    id:'sudoku', name:'Sudoku', icon:'🔢', units:['Zahl','Zahlen'],\n    intro:'Wähle Grösse und Niveau, löse das Sudoku und gib es ab.',\n    sizes:[4,6,9], size:9, lvl:'sl', tools:{notes:true},\n    missing:n=>`Noch ${n} Felder leer.`,\n    levels:{\n      sl:{ratio:.64,logic:true,desc:'Sehr viele Zahlen sind vorgegeben. Oft fehlt in einer Zeile nur eine Zahl. Ideal zum Einstieg.'},\n      l: {ratio:.54,logic:true,desc:'Viele Zahlen vorgegeben. Lösbar ohne Raten – genau hinschauen genügt.'},\n      m: {ratio:.44,logic:true,desc:'Weniger Zahlen. Notizen helfen, um mögliche Zahlen festzuhalten.'},\n      s: {ratio:.35,logic:false,tier:2,desc:'Wenige Zahlen. Einzelne Zahlen finden reicht nicht: Du brauchst Paare, Drillinge und «gesperrte» Kandidaten (Zahl liegt in einem Block nur in einer Zeile).'},\n      ss:{ratio:0,tier:3,sizes:[9],desc:'Nur ca. 22–26 Zahlen. Es braucht Muster wie X-Wing, Schwertfisch oder XY-Wing. Nur 9×9.'},\n      us:{ratio:0,tier:4,branches:3,sizes:[9],desc:'Das Härteste: Alle Muster reichen nicht – du musst Annahmen durchdenken («Wenn hier 3, dann …») und mehrfach Widersprüche finden. Alles ist logisch herleitbar, aber es braucht viel Zeit und Notizen. Nur 9×9.'}\n    },\n    create(size,lvl){\n      const t0=Date.now();\n      for(let t=0;t<800&&(t<30||Date.now()-t0<12000);t++){const d=sdGenerate(size,this.levels[lvl]);if(d)return new SudokuPuzzle(this,size,lvl,d);}\n      return null;\n    },\n    rules(n){\n      const [br,bc]=SUDOKU_BLOCKS[n];\n      return `\n        <li>Fülle alle leeren Felder mit den Zahlen <b>1 bis ${n}<\/b>.<\/li>\n        <li>Jede Zahl kommt in jeder <b>Zeile<\/b> genau einmal vor.<\/li>\n        <li>Jede Zahl kommt in jeder <b>Spalte<\/b> genau einmal vor.<\/li>\n        <li>Jede Zahl kommt in jedem <b>${br}×${bc}-Block<\/b> (dick umrandet) genau einmal vor.<\/li>\n        <li><b>Strategie:<\/b> Suche eine Zeile, Spalte oder einen Block, in dem nur noch wenige Zahlen fehlen.<\/li>\n        <li><b>Für Fortgeschrittene:<\/b> Paare (zwei Felder teilen sich zwei Zahlen), gesperrte Kandidaten, X-Wing, XY-Wing – und bei «Ultraschwer» Annahmen mit Folgerungen.<\/li>\n        <li><b>Abgeben:<\/b> Fülle das ganze Rätsel aus und drücke dann «Abgeben». Erst jetzt wird korrigiert: Stimmt etwas nicht, werden die falschen Felder rot und du musst ein neues Rätsel beginnen. Prüfe deshalb vor dem Abgeben alles nochmals in Ruhe.<\/li>\n        <li><b>Notizen:<\/b> Schalte «Notizen» ein, um mögliche Zahlen klein ins Feld zu schreiben.<\/li>\n        <li><b>Tastatur:<\/b> Zahlen tippen, Pfeiltasten zum Bewegen, Entf/Backspace zum Löschen, N für Notizen.<\/li>`;\n    }\n  };\n\n/* =====================================================================\n   KERN – Oberfläche (gilt für jedes Rätsel)\n   Erwartet eine globale Konstante GAME (vom Rätsel-Modul definiert).\n   Kümmert sich um: Auswahl Grösse/Niveau, Zeit, Statistik, Prüfen, Tipp,\n   Neu beginnen, Lösung zeigen, Drucken, Gewonnen-Dialog, Tastatur,\n   Einbettung in die Plattform (?embed=1).\n   ===================================================================== */\nconst $=id=>document.getElementById(id);\nconst def=GAME;\nconst EMBED=/[?&]embed=1/.test(location.search)||window.name==='raetsel-embed';\nconst STORE_KEY='raetsel-trainer-v1-'+def.id;\nconst settings={size:def.size,lvl:def.lvl};\nlet solUsed=false,puz=null,noteMode=false,tips=0,checks=0,startT=0,timerId=null,genToken=0;\n\n$('autoCheck').checked=false;\nfunction loadStore(){\n  try{\n    const o=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');\n    if(def.sizes.includes(o.size))settings.size=o.size;\n    if(def.levels[o.lvl])settings.lvl=o.lvl;\n  }catch(e){}\n}\nfunction saveStore(){try{localStorage.setItem(STORE_KEY,JSON.stringify(settings));}catch(e){}}\n\n/* Meldungen, Zeit, Statistik */\nfunction showMsg(t,type){const m=$('msg');m.textContent=t;m.className='msg show '+type;}\nfunction hideMsg(){$('msg').className='msg';}\nfunction elapsed(){return Math.floor((Date.now()-startT)/1000);}\nfunction fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}\nfunction startTimer(){stopTimer();startT=Date.now();$('stTime').textContent='00:00';timerId=setInterval(()=>$('stTime').textContent=fmt(elapsed()),1000);}\nfunction stopTimer(){if(timerId)clearInterval(timerId);timerId=null;}\n/* Deutlich sichtbare Kennzeichnung: Wurde die Lösung angezeigt, bleibt das für dieses Rätsel sichtbar\n   (auch nach «Neu beginnen» und nach dem Lösen) – ein Screenshot kann also nicht als eigene Lösung gelten. */\nfunction updateStatus(){\n  const st=$('stStatus'),won=puz&&puz.done&&!solUsed&&puz.solved(),lk=puz&&puz.locked&&!solUsed,rdy=puz&&!puz.done&&!puz.locked&&puz.complete();\n  st.className=(solUsed||lk)?'bad':won?'good':'';\n  st.textContent=solUsed?'⚠ Lösung angezeigt':lk?'✖ nicht richtig gelöst':won?'✔ selbst gelöst':rdy?'bereit zum Abgeben':'in Arbeit';\n  $('solBanner').style.display=solUsed?'block':'none';\n  $('stage').classList.toggle('sol',solUsed);\n}\n/* Tipps je Niveau: einfache Stufen keine, Mittel 1, Schwer 2, Sehr schwer/Ultraschwer 3 */\nconst TIP_LIMIT={sl:0,l:0,m:1,s:2,ss:3,us:3};\nfunction tipLimit(){return TIP_LIMIT[puz?puz.lvlKey:settings.lvl]||0;}\nfunction tipText(l){const n=TIP_LIMIT[l]||0;return n===0?'Keine Tipps möglich.':n===1?'Maximal 1 Tipp.':`Maximal ${n} Tipps.`;}\nfunction updateStats(){$('stTips').textContent=tips+'/'+tipLimit();$('stChecks').textContent=checks;}\n\nconst ctx={\n  autoCheck:()=>$('autoCheck').checked,\n  noteMode:()=>noteMode,\n  hideMsg,\n  changed:()=>{refreshTools();},\n\n  msg:showMsg\n};\n/* Beschriftungen – Rätsel dürfen sie überschreiben (def.sizeLabel, def.tag, def.newLabel …) */\nconst sizeLabel=v=>def.sizeLabel?def.sizeLabel(v):`${v} × ${v}`;\nconst tagOf=(s,l)=>def.tag?def.tag(s,l):`${LEVEL_NAMES[l]} (${s}×${s})`;\n\n/* Auswahl-Leisten */\nfunction makeSeg(el,items,current,onPick){\n  el.innerHTML='';\n  for(const it of items){\n    const b=document.createElement('button');\n    b.textContent=it.label;b.dataset.v=it.v;\n    b.classList.toggle('on',String(it.v)===String(current));\n    b.addEventListener('click',()=>onPick(it.v));\n    el.appendChild(b);\n  }\n}\n/* Manche Niveaus gibt es nur ab einer bestimmten Grösse (levels.xx.sizes) */\nfunction sizesFor(){return def.levels[settings.lvl].sizes||def.sizes;}\nfunction buildOptions(){\n  const allowed=sizesFor();\n  if(!allowed.includes(settings.size))settings.size=allowed.find(n=>n>=settings.size)||allowed[allowed.length-1];\n  makeSeg($('sizeSeg'),allowed.map(n=>({v:n,label:sizeLabel(n)})),settings.size,v=>{settings.size=v;buildOptions();saveStore();updateSetupSel();});\n  makeSeg($('lvlSeg'),Object.keys(def.levels).map(k=>({v:k,label:LEVEL_NAMES[k]})),settings.lvl,v=>{settings.lvl=v;buildOptions();saveStore();updateSetupSel();});\n  const d=def.levels[settings.lvl].desc;\n  $('lvlDesc').textContent=(typeof d==='function'?d(settings.size):d)+' '+tipText(settings.lvl);\n  $('sizeSeg').style.display=def.sizes.length>1?'':'none';\n  $('sizeLbl').style.display=def.sizes.length>1?'':'none';\n}\n\n\n/* Schritt 1: Rahmenbedingungen wählen – Schritt 2: Rätsel erstellen */\nconst TOOL_IDS=['btnCheck','btnNotes','btnHint','btnReset','btnSolve','btnPrint','btnSubmit'];\nfunction toolsDisabled(on){for(const id of TOOL_IDS){const e=$(id);if(e)e.disabled=on;}if($('autoCheck'))$('autoCheck').disabled=on;}\nfunction showSetup(){\n  ++genToken;stopTimer();puz=null;tips=0;checks=0;solUsed=false;\n  const stage=$('stage');stage.classList.remove('loading','sol');\n  stage.innerHTML=`<div class=\"setup-ph\"><div class=\"big\">${def.icon||'🧩'}<\/div><h3>Neues ${def.name} einrichten<\/h3><p>Wähle Grösse und Niveau und erstelle dann das Rätsel.<\/p><p class=\"chosen\" id=\"setupSel\"><\/p><button class=\"btn primary\" id=\"btnSetupGo\">Rätsel erstellen<\/button><\/div>`;\n  $('btnSetupGo').addEventListener('click',startGame);\n  const pad=$('pad');pad.innerHTML='';pad.removeAttribute('style');\n  toolsDisabled(true);hideMsg();\n  $('stLevel').textContent='–';$('stTime').textContent='00:00';$('stStatus').textContent='noch kein Rätsel';$('stStatus').className='';\n  if($('stTips'))$('stTips').textContent='–';\n  if($('solBanner'))$('solBanner').style.display='none';\n  updateSetupSel();\n}\nfunction updateSetupSel(){const e=$('setupSel');if(e)e.textContent=(def.sizes.length>1?sizeLabel(settings.size)+' · ':'')+LEVEL_NAMES[settings.lvl];}\nfunction startGame(){\n  if(puz&&!puz.done&&!puz.locked&&!solUsed&&!confirm('Das laufende Rätsel wird verworfen. Wirklich ein neues Rätsel erstellen?'))return;\n  newGame();\n}\n\n/* Neues Rätsel */\nfunction newGame(){\n  const token=++genToken, stage=$('stage');\n  stopTimer();\n  stage.classList.add('loading');\n  showMsg(`${def.name} wird erstellt …`,'info');\n  setTimeout(()=>{\n    if(token!==genToken)return;\n    let p=null;\n    try{p=def.create(settings.size,settings.lvl);}catch(err){console.error(err);}\n    stage.classList.remove('loading');\n    if(!p){showMsg('Das Rätsel konnte nicht erstellt werden. Bitte nochmals versuchen.','warn');if(!puz)showSetup();return;}\n    puz=p;tips=0;checks=0;solUsed=false;\n    toolsDisabled(false);\n    puz.mount(ctx,stage,$('pad'));setLocked(false);\n    if($('autoCheck').checked)puz.applyAutoCheck(true);\n    $('stLevel').textContent=tagOf(settings.size,settings.lvl);\n    $('phTitle').textContent=`${def.name} · ${tagOf(settings.size,settings.lvl)}`;\n    $('rules').innerHTML=def.rules(settings.size);\n    updateStats();updateStatus();startTimer();hideMsg();\n  },30);\n}\n\n/* Werkzeuge */\nfunction check(){\n  if(!puz||puz.done||puz.locked)return;\n  if(puz.customCheck){checks++;updateStats();const r=puz.customCheck();showMsg(r.text,r.type);return;}\n  checks++;\n  const {wrong,empty,right}=puz.check();\n  updateStats();\n  if(puz.solved()){win();return;}\n  const [one,many]=def.units;\n  if(wrong===0){\n    showMsg(right===0?`Noch nichts eingetragen. ${def.missing(empty)}`\n      :`Super! ${right===1?'Die eingetragene '+one+' ist':'Alle '+right+' eingetragenen '+many+' sind'} richtig. ${def.missing(empty)}`,'good');\n  } else {\n    showMsg(`${wrong} ${wrong===1?one+' ist':many+' sind'} falsch (rot). ${right} richtig. ${def.missing(empty)} Korrigiere die roten Felder.`,'warn');\n  }\n}\nfunction hint(){\n  if(!puz||puz.done||puz.locked||tips>=tipLimit())return;\n  const t=puz.hint();\n  if(t===null)return;\n  tips++;updateStats();showMsg(t,'info');\n  ctx.changed();\n}\nfunction resetGame(){\n  if(!puz||puz.locked||!confirm('Alle eigenen Eingaben löschen und neu beginnen? Bereits benutzte Tipps bleiben verbraucht.'))return;\n  puz.reset();startTimer();hideMsg();updateStats();refreshTools();\n}\nfunction showSolution(){\n  if(!puz)return;\n  if(!confirm(`Wirklich die ganze Lösung anzeigen? Das ${def.name}-Rätsel gilt dann als nicht gelöst.`))return;\n  solUsed=true;puz.reveal();stopTimer();refreshTools();\n  showMsg('Lösung angezeigt: grün = du hattest es richtig, rot = war falsch, gelb = war leer.','info');\n}\n/* Werkzeuge sperren/freigeben (nach einem vollständig falsch gelösten Rätsel bleibt nur «Lösung zeigen» / «Neues Rätsel») */\nfunction setLocked(on){\n  for(const id of ['btnCheck','btnHint','btnReset','btnNotes','autoCheck'])$(id).disabled=on;\n  $('autoCheck').parentElement.classList.toggle('off',on);\n  document.querySelectorAll('#pad button').forEach(b=>b.disabled=on);\n  refreshTools();\n}\n/* «Abgeben» ist erst möglich, wenn alles ausgefüllt ist. Dann sind Überprüfen und Tipp gesperrt – sonst könnte man vor dem Abgeben noch Fehler suchen. */\nfunction refreshTools(){\n  if(!puz)return;\n  const over=puz.done||puz.locked,comp=!over&&puz.complete();\n  $('btnSubmit').disabled=!comp;\n  $('btnSubmit').title=comp?'':'Erst alle Felder ausfüllen';\n  const lim=tipLimit(),left=lim-tips;\n  $('btnHint').textContent=lim?`💡 Tipp (${left} übrig)`:'💡 Keine Tipps';\n  if(!puz.locked){$('btnCheck').disabled=true;$('btnHint').disabled=over||comp||left<=0;}\n  updateStatus();\n  if(comp&&!$('msg').classList.contains('show'))showMsg('Alles ausgefüllt. Prüfe nochmals in Ruhe – mit «Abgeben» gibst du das Rätsel ab. Erst dann wird korrigiert.','info');\n}\n/* Abgeben: erst jetzt wird ausgewertet */\nfunction submitPuz(){\n  if(!puz||puz.done||puz.locked||!puz.complete())return;\n  if(puz.solved())win();else fail();\n}\n/* Rätsel ist vollständig ausgefüllt, aber nicht richtig: Fehler rot, keine Korrektur mehr möglich */\nfunction fail(){\n  puz.lock();stopTimer();setLocked(true);\n  const bad=puz.mark.filter(m=>m===2).length;\n  $('winTitle').textContent='✖ Leider nicht richtig';\n  $('winText').innerHTML=`${def.name} · Niveau: <b>${tagOf(settings.size,settings.lvl)}<\/b><br>Zeit: <b>${fmt(elapsed())}<\/b> · Tipps: <b>${tips} von ${tipLimit()}<\/b><br>Du hast das Rätsel abgegeben, aber <b>${bad===1?'ein Feld ist':bad+' Felder sind'} falsch<\/b> (rot markiert).<br>Abgegebene Rätsel können nicht mehr korrigiert werden – starte ein <b>neues Rätsel<\/b> und versuche es nochmals.`;\n  $('winTip').style.display='none';\n  $('btnWinNew').textContent='Neues Rätsel';$('btnWinClose').textContent='Fehler ansehen';\n  $('overlay').classList.add('show');\n  showMsg('Abgegeben – nicht richtig gelöst: Die roten Felder sind falsch. Korrigieren ist nicht mehr möglich – starte ein neues Rätsel.','warn');\n}\nfunction win(){\n  $('winTip').style.display='';$('btnWinNew').textContent='Nächstes Rätsel';$('btnWinClose').textContent='Schliessen';\n  puz.finish();stopTimer();\n  $('winText').innerHTML=`${def.name} · Niveau: <b>${tagOf(settings.size,settings.lvl)}<\/b><br>Zeit: <b>${fmt(elapsed())}<\/b><br>${puz.winInfo?puz.winInfo()+'<br>':''}Tipps: <b>${tips} von ${tipLimit()}<\/b>`;\n  if(solUsed){$('winTitle').textContent='⚠ Gelöst – aber mit Lösung';$('winText').innerHTML+='<br><b style=\"color:var(--bad)\">Die Lösung wurde angezeigt – das zählt nicht als selbst gelöst.<\/b>';}\n  else $('winTitle').textContent='🎉 Geschafft!';\n  refreshTools();\n  $('overlay').classList.add('show');\n  showMsg(solUsed?'Gelöst – aber die Lösung wurde vorher angezeigt.':`Gelöst in ${fmt(elapsed())} mit ${tips} Tipps.`,solUsed?'warn':'good');\n}\nfunction toggleNotes(){\n  if(def.tools.undo){if(puz)puz.undo();return;}\n  if(!def.tools.notes)return;\n  noteMode=!noteMode;\n  $('btnNotes').textContent=(def.tools.notesLabel||'✎ Notizen')+': '+(noteMode?'ein':'aus');\n  $('btnNotes').classList.toggle('on',noteMode);\n}\n\n/* Ereignisse */\n$('btnNew').addEventListener('click',startGame);\n$('btnCheck').addEventListener('click',check);\n$('btnSubmit').addEventListener('click',submitPuz);\n$('btnHint').addEventListener('click',hint);\n$('btnReset').addEventListener('click',resetGame);\n$('btnSolve').addEventListener('click',showSolution);\n$('btnPrint').addEventListener('click',()=>{if(puz){puz.clearSelection();}window.print();});\n$('btnNotes').addEventListener('click',toggleNotes);\n$('btnWinNew').addEventListener('click',()=>{$('overlay').classList.remove('show');showSetup();});\n$('btnWinClose').addEventListener('click',()=>$('overlay').classList.remove('show'));\n$('autoCheck').addEventListener('change',()=>{if(puz)puz.applyAutoCheck($('autoCheck').checked);});\n\ndocument.addEventListener('keydown',e=>{\n  if($('overlay').classList.contains('show')||!puz)return;\n  if(e.ctrlKey||e.metaKey||e.altKey)return;\n  const t=e.target;\n  if(e.key===' '&&t&&t.closest&&t.closest('button,input,summary,select,textarea'))return;   // Leertaste bedient dann das Bedienelement\n  if((e.key==='n'||e.key==='N')&&def.tools.notes&&!def.tools.undo){toggleNotes();return;}\n  if((e.key==='z'||e.key==='Z'||e.key==='Backspace')&&def.tools.undo&&puz.undo){puz.undo();e.preventDefault();return;}\n  if(puz.keydown(e))e.preventDefault();\n});\n\n/* Einbettung: Höhe an die Plattform melden */\nfunction setupEmbed(){\n  document.body.classList.add('embed');\n  if(window.parent===window)return;\n  const send=()=>window.parent.postMessage({type:'raetsel-height',id:def.id,h:Math.ceil(document.body.getBoundingClientRect().height)},'*');\n  if(window.ResizeObserver)new ResizeObserver(send).observe(document.body);\n  window.addEventListener('load',send);\n  send();\n}\n\n/* Start */\n(function init(){\n  loadStore();\n  $('gameTitle').textContent=def.title;\n  $('sub').textContent=def.intro;\n  $('newTitle').textContent=def.newLabel||'Neues '+def.name;\n  $('btnNew').textContent=def.newLabel?def.newLabel+' starten':'Neues '+def.name+' erstellen';\n  $('sizeLbl').textContent=def.sizeTitle||'Grösse';\n  if(def.tools.undo)$('btnNotes').textContent='↶ Zug zurück';\n  else if(def.tools.notesLabel)$('btnNotes').textContent=def.tools.notesLabel+': aus';\n  if(def.tools.auto===false)$('autoCheck').parentElement.style.display='none';\n  if(def.tools.legend===false)document.querySelector('.legend').style.display='none';\n  $('rulesTitle').textContent='So geht '+def.name;\n  $('btnNotes').style.display=(def.tools.notes||def.tools.undo)?'':'none';\n  $('btnHint').classList.toggle('full',!(def.tools.notes||def.tools.undo));\n  document.title=def.title+' – Rätsel-Trainer';\n  if(EMBED)setupEmbed();\n  buildOptions();\n  showSetup();\n})();\n\n<\/script>\n<\/body>\n<\/html>\n"
 },
 {

  "icon": "✕○",
  "intro": "Fülle das Feld mit X und O – nach festen Regeln, ganz ohne Raten.",
  "html": "<!doctype html>\n<html lang=\"de-CH\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Binoxxo – Rätsel-Trainer<\/title>\n<style>\n:root{\n  /* Farben nach flade.ch: Weiss als Grund, Anthrazit für Text, Limettengrün #aecb35 als Akzent */\n  --bg:#ffffff; --card:#f8faf0; --ink:#231f20; --muted:#5f6657;\n  --line:#d3dbbd; --thick:#231f20; --given:#231f20; --user:#46640f;\n  --sel:#dbe9a0; --peer:#f4f8e2; --same:#e7f0bd;\n  --ok:#15803d; --okbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2;\n  --hint:#92400e; --hintbg:#fef3c7;\n  --accent:#aecb35; --accent-bg:#f1f7d9; --accent-dark:#5d7410; --lime:#aecb35;\n  --water:#e6f1f5;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,\"Segoe UI\",Arial,sans-serif;}\n.wrap{max-width:980px;margin:0 auto;padding:16px;}\n\n/* Kopf */\n.top{display:flex;align-items:center;gap:16px;margin:2px 0 14px;padding-bottom:12px;border-bottom:3px solid var(--lime)}\n.logo{height:58px;width:auto;display:block;flex:none}\n.titlebox h1{margin:0;font-size:1.7rem;line-height:1.15}\n.sub{color:var(--muted);margin:2px 0 0}\n/* Layout */\n.layout{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}\n.left{flex:1 1 420px;min-width:280px}\n.right{flex:0 1 300px;min-width:260px;display:flex;flex-direction:column;gap:12px}\n.card{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(35,31,32,.06)}\n.card h2{font-size:1.05rem;margin:0 0 8px}\nlabel.small{font-size:.9rem;color:var(--muted);display:block;margin-bottom:4px}\n.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}\n.seg button{flex:1 1 auto;border:2px solid var(--line);background:#fff;border-radius:8px;padding:7px 8px;font:inherit;cursor:pointer;color:var(--ink)}\n.seg button.on{border-color:var(--accent);background:var(--accent-bg);font-weight:bold}\n.lvldesc{font-size:.9rem;color:var(--muted);min-height:2.4em;margin:0 0 10px}\n.btn{border:none;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer;background:#e5e7eb;color:var(--ink)}\n.btn:hover{filter:brightness(.95)}\n.btn.primary{background:var(--accent);color:var(--ink);font-weight:bold}\n.btn.primary:hover{background:#9db92d}\n.btn.on{background:var(--accent-dark);color:#fff}\n.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.btns .full{grid-column:1/-1}\n.stats{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}\n.stats b{font-variant-numeric:tabular-nums}\nbutton:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}\n\n/* Spielfeld (gemeinsam) */\n.board{\n  width:min(100%,520px); aspect-ratio:1/1; margin:0 auto;\n  display:grid; grid-template-columns:repeat(var(--cols,var(--n)),1fr); grid-template-rows:repeat(var(--cols,var(--n)),1fr);\n  border:3px solid var(--thick); background:#fff; user-select:none; touch-action:manipulation;\n}\n.cell{\n  display:flex;align-items:center;justify-content:center;position:relative;\n  border-right:1px solid var(--line);border-bottom:1px solid var(--line);\n  font-size:calc(min(100vw - 40px,520px) / var(--n) * .55);\n  cursor:pointer;color:var(--user);\n}\n.cell.tr{border-right:3px solid var(--thick)}\n.cell.tb{border-bottom:3px solid var(--thick)}\n.cell.lastc{border-right:none}\n.cell.lastr{border-bottom:none}\n.cell.water{background:var(--water)}\n.cell.peer{background:var(--peer)}\n.cell.same{background:var(--same)}\n.cell.sel{background:var(--sel)}\n.cell.given{color:var(--given);font-weight:bold}\n.cell.hint{color:var(--hint);background:var(--hintbg)}\n.cell.ok{color:var(--ok);background:var(--okbg)}\n.cell.bad{color:var(--bad);background:var(--badbg)}\n.cell.sel.ok,.cell.sel.bad,.cell.sel.hint{outline:3px solid var(--accent);outline-offset:-3px}\n.cell.water.ok,.cell.water.bad,.cell.water.hint{outline:0}\n.notes{position:absolute;inset:2px;display:grid;font-size:calc(min(100vw - 40px,520px) / var(--n) * .22);color:#64748b;line-height:1;font-weight:normal}\n.notes span{display:flex;align-items:center;justify-content:center}\n\n/* Eingabe */\n.pad{display:grid;gap:6px;margin:12px auto 0;width:min(100%,520px)}\n.pad button{font:inherit;font-size:1.4rem;padding:10px 0;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}\n.pad button.del{font-size:1rem}\n.pad button.done{opacity:.35}\n.padhelp{margin:12px auto 0;width:min(100%,520px);font-size:.95rem;color:var(--muted);text-align:center}\n.msg{margin:12px auto 0;width:min(100%,520px);padding:10px 12px;border-radius:8px;display:none;font-size:1rem}\n.msg.show{display:block}\n.msg.info{background:#e0f2fe;color:#075985}\n.msg.good{background:var(--okbg);color:#14532d}\n.msg.warn{background:var(--badbg);color:#7f1d1d}\n.toggle{display:flex;gap:8px;align-items:center;font-size:.95rem;margin-top:6px;cursor:pointer}\ndetails summary{cursor:pointer;font-weight:bold}\ndetails ul{padding-left:18px;margin:8px 0 0}\ndetails li{margin-bottom:4px}\n.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:.85rem;margin-top:8px}\n.legend span{padding:2px 6px;border-radius:5px}\n.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}\n.overlay.show{display:flex}\n.dialog{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%;text-align:center}\n.dialog h3{margin:0 0 8px;font-size:1.5rem}\n.dialog p{margin:6px 0}\n.loading{opacity:.4;pointer-events:none}\n.printhead{display:none}\n.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}\n.pad button:disabled{opacity:.35;cursor:not-allowed}\n.toggle.off{opacity:.5;cursor:not-allowed}\n\n@media (max-width:520px){\n  .logo{height:46px}\n  .titlebox h1{font-size:1.4rem}\n}\n@media print{\n  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  body{background:#fff}\n  .right,.pad,.padhelp,.msg,.sub,.titlebox,.stats,.overlay{display:none!important}\n  .top{margin:0 0 8px}\n  .logo{height:1.3cm}\n  .printhead{display:block;margin-bottom:12px;font-size:1.2rem}\n  .board{width:16cm}\n  .cell{font-size:calc(16cm / var(--n) * .55)}\n  .cell.peer,.cell.same,.cell.sel{background:#fff}\n}\n\n/* Eingebettet in die Plattform: Kopf wird von der Plattform gezeigt */\nbody.embed .top{display:none}\nbody.embed .wrap{padding-top:0}\n@media print{body.embed .top{display:flex}}\n\n/* Kennzeichnung «Lösung angezeigt» */\n#stStatus.bad{color:var(--bad)}\n#stStatus.good{color:var(--ok)}\n.solbanner{display:none;background:#b91c1c;color:#fff;font-weight:bold;text-align:center;padding:8px 10px;border-radius:8px;margin-bottom:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n#stage{position:relative}\n#stage.sol{outline:4px solid #b91c1c;outline-offset:2px}\n#stage.sol::after{content:\"\";position:absolute;inset:0;pointer-events:none;z-index:5;background:url(\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='170'><text x='130' y='90' text-anchor='middle' font-family='Arial' font-size='22' font-weight='bold' fill='%23b91c1c' fill-opacity='.38' transform='rotate(-25 130 85)'>LÖSUNG ANGEZEIGT<\/text><\/svg>\") repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n\n/* Binoxxo */\n.g-binoxxo .cell{font-weight:700;font-size:calc(min(100vw - 40px,520px) / var(--n) * .6)}\n.g-binoxxo .cell.given{font-weight:800}\n\n@media print{\n  .g-binoxxo .cell{font-size:calc(16cm / var(--n) * .6)}\n}\n\n\n.setup-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:260px;padding:28px 18px;text-align:center;border:2px dashed var(--line,#cbd5e1);border-radius:16px;background:#f8fafc;color:#334155}\n.setup-ph .big{font-size:40px;line-height:1}\n.setup-ph h3{margin:0;font-size:1.15rem}\n.setup-ph p{margin:0;max-width:34ch;font-size:.95rem}\n.setup-ph .chosen{font-weight:700;color:#0f172a}\n.setup-ph .btn{margin-top:6px;min-width:220px}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <img class=\"logo\" src=\"data:image/png;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==\" alt=\"Logo\">\n    <div class=\"titlebox\">\n      <h1 id=\"gameTitle\">Rätsel-Trainer<\/h1>\n      <p class=\"sub\" id=\"sub\"><\/p>\n    <\/div>\n  <\/header>\n\n    <div class=\"layout\">\n    <div class=\"left\">\n      <div class=\"printhead\"><span id=\"phTitle\"><\/span> &nbsp;&nbsp; Name: ______________________<\/div>\n      <div class=\"stats\">\n        <span>Niveau: <b id=\"stLevel\">–<\/b><\/span>\n        <span>Zeit: <b id=\"stTime\">00:00<\/b><\/span>\n        <span>Tipps: <b id=\"stTips\">0<\/b><\/span>\n        <span style=\"display:none\">Prüfungen: <b id=\"stChecks\">0<\/b><\/span>\n        <span>Status: <b id=\"stStatus\">in Arbeit<\/b><\/span>\n      <\/div>\n      <div id=\"solBanner\" class=\"solbanner\" role=\"alert\">⚠ LÖSUNG ANGEZEIGT – dieses Rätsel zählt nicht als selbst gelöst<\/div>\n      <div id=\"stage\"><\/div>\n      <div id=\"pad\"><\/div>\n      <div class=\"msg\" id=\"msg\" role=\"status\" aria-live=\"polite\"><\/div>\n    <\/div>\n\n    <div class=\"right\">\n      <div class=\"card\">\n        <h2 id=\"newTitle\">Neues Rätsel<\/h2>\n        <label class=\"small\" id=\"sizeLbl\">Grösse<\/label>\n        <div class=\"seg\" id=\"sizeSeg\"><\/div>\n        <label class=\"small\">Niveau<\/label>\n        <div class=\"seg\" id=\"lvlSeg\"><\/div>\n        <p class=\"lvldesc\" id=\"lvlDesc\"><\/p>\n        <button class=\"btn primary\" style=\"width:100%\" id=\"btnNew\">Neues Rätsel erstellen<\/button>\n      <\/div>\n\n      <div class=\"card\">\n        <h2>Werkzeuge<\/h2>\n        <div class=\"btns\">\n          <button class=\"btn primary full\" id=\"btnSubmit\" disabled title=\"Erst alle Felder ausfüllen\">📥 Abgeben<\/button>\n          <button class=\"btn full\" id=\"btnCheck\" style=\"display:none\">✔ Überprüfen<\/button>\n          <button class=\"btn\" id=\"btnNotes\">✎ Notizen: aus<\/button>\n          <button class=\"btn\" id=\"btnHint\">💡 Tipp<\/button>\n          <button class=\"btn\" id=\"btnReset\">↺ Neu beginnen<\/button>\n          <button class=\"btn\" id=\"btnSolve\">Lösung zeigen<\/button>\n          <button class=\"btn full\" id=\"btnPrint\">🖨 Drucken<\/button>\n        <\/div>\n        <label class=\"toggle\" style=\"display:none\"><input type=\"checkbox\" id=\"autoCheck\"> Fehler sofort rot anzeigen<\/label>\n        <div class=\"legend\">\n          <span style=\"background:var(--okbg);color:var(--ok)\">richtig<\/span>\n          <span style=\"background:var(--badbg);color:var(--bad)\">falsch<\/span>\n          <span style=\"background:var(--hintbg);color:var(--hint)\">Tipp<\/span>\n          <span style=\"font-weight:bold\">vorgegeben<\/span>\n        <\/div>\n      <\/div>\n\n      <div class=\"card\">\n        <details>\n          <summary id=\"rulesTitle\">So geht's<\/summary>\n          <ul id=\"rules\"><\/ul>\n        <\/details>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\">\n  <div class=\"dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"winTitle\">\n    <h3 id=\"winTitle\">🎉 Geschafft!<\/h3>\n    <p id=\"winText\"><\/p>\n    <p id=\"winTip\" style=\"font-size:.9rem;color:var(--muted)\">Tipp: Mach einen Screenshot für dein Lernjournal.<\/p>\n    <button class=\"btn primary\" id=\"btnWinNew\" style=\"margin-top:10px\">Nächstes Rätsel<\/button>\n    <button class=\"btn\" id=\"btnWinClose\" style=\"margin-top:10px\">Schliessen<\/button>\n  <\/div>\n<\/div>\n\n<script>\n'use strict';\n/* =====================================================================\n   KERN – gemeinsam für alle Rätsel (wird in jede Rätsel-Datei eingebaut)\n   Enthält: Hilfsfunktionen und die Basisklasse GridPuzzle.\n   Ein Rätsel erbt von GridPuzzle und meldet sich mit  const GAME = {...}  an.\n   ===================================================================== */\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction randOf(a){return a[Math.floor(Math.random()*a.length)];}\nconst LEVEL_NAMES={sl:'Sehr leicht',l:'Leicht',m:'Mittel',s:'Schwer',ss:'Sehr schwer',us:'Ultraschwer'};\n\nclass GridPuzzle{\n  constructor(def,size,lvlKey,data){\n    this.def=def; this.n=size; this.lvlKey=lvlKey;\n    this.sol=data.sol; this.cur=data.puz.slice();\n    this.given=data.puz.map(v=>v>0);\n    this.hinted=new Array(size*size).fill(false);\n    this.mark=new Array(size*size).fill(0);          // 0 nichts, 1 richtig, 2 falsch\n    this.sel=-1; this.done=false; this.locked=false; this.cells=[]; this.ctx=null;\n  }\n\n  /* --- Hooks, die Unterklassen überschreiben --- */\n  baseClass(i){return 'cell';}\n  extraClass(i){return i===this.sel?' sel':'';}\n  paint(i,d){}                                       // Zelleninhalt zeichnen\n  onCell(i){this.sel=i;this.refresh();}\n  handleKey(e){return false;}\n  buildPad(pad){pad.className='padhelp';pad.textContent=this.def.padHelp||'';}\n  afterSet(i,v){}\n  afterReset(){}\n  afterRefresh(){}\n  cellState(i){const v=this.cur[i];if(!v)return 'empty';return v===this.sol[i]?'right':'wrong';}\n  solved(){return this.cur.every((v,k)=>v===this.sol[k]);}\n  pickHint(){\n    const open=[];\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]&&this.cur[i]!==this.sol[i])open.push(i);\n    if(!open.length)return null;\n    const i=(this.sel>=0&&open.includes(this.sel))?this.sel:randOf(open);\n    return {i,text:'Ein Feld wurde mit einem Tipp ausgefüllt (gelb).'};\n  }\n  revealEmpty(i){this.hinted[i]=true;}\n\n  /* --- gemeinsame Abläufe --- */\n  buildBoard(){\n    const b=document.createElement('div');\n    b.className='board g-'+this.def.id;\n    b.style.setProperty('--n',this.n);\n    b.setAttribute('aria-label',this.def.name+'-Feld');\n    this.cells=[];\n    for(let i=0;i<this.n*this.n;i++){\n      const d=document.createElement('div');\n      d.addEventListener('click',()=>this.onCell(i));\n      b.appendChild(d);this.cells.push(d);\n    }\n    return b;\n  }\n  mount(ctx,stage,pad){\n    this.ctx=ctx;\n    stage.innerHTML='';\n    stage.appendChild(this.buildBoard());\n    pad.className='';pad.removeAttribute('style');pad.innerHTML='';\n    this.buildPad(pad);\n    this.refresh();\n  }\n  refresh(){\n    for(let i=0;i<this.cur.length;i++){\n      const d=this.cells[i];\n      let cls=this.baseClass(i);\n      if(this.given[i])cls+=' given';\n      if(this.hinted[i])cls+=' hint';\n      if(this.mark[i]===1)cls+=' ok';\n      if(this.mark[i]===2)cls+=' bad';\n      cls+=this.extraClass(i);\n      d.className=cls;\n      this.paint(i,d);\n    }\n    this.afterRefresh();\n  }\n  commit(){this.ctx.hideMsg();this.refresh();this.ctx.changed();}\n  setCell(i,v){\n    this.cur[i]=v;this.hinted[i]=false;this.mark[i]=0;\n    if(v&&this.ctx.autoCheck()&&v!==this.sol[i])this.mark[i]=2;\n    this.afterSet(i,v);\n  }\n  editable(){return !this.done&&!this.locked&&this.sel>=0&&!this.given[this.sel];}\n  keydown(e){\n    if(this.handleKey(e))return true;\n    const k=e.key,N=this.n;\n    if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))return false;\n    if(this.sel<0)this.sel=0;\n    else{\n      const r=Math.floor(this.sel/N),c=this.sel%N;\n      if(k==='ArrowLeft'&&c>0)this.sel--;\n      if(k==='ArrowRight'&&c<N-1)this.sel++;\n      if(k==='ArrowUp'&&r>0)this.sel-=N;\n      if(k==='ArrowDown'&&r<N-1)this.sel+=N;\n    }\n    this.refresh();return true;\n  }\n  check(){\n    let wrong=0,empty=0,right=0;\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i]||this.hinted[i])continue;\n      const s=this.cellState(i);\n      if(s==='empty'){empty++;this.mark[i]=0;}\n      else if(s==='skip')this.mark[i]=0;\n      else if(s==='right'){this.mark[i]=1;right++;}\n      else{this.mark[i]=2;wrong++;}\n    }\n    this.refresh();\n    return {wrong,empty,right};\n  }\n  hint(){\n    const p=this.pickHint();\n    if(!p)return null;\n    this.cur[p.i]=this.sol[p.i];this.hinted[p.i]=true;this.mark[p.i]=0;\n    this.afterSet(p.i,this.sol[p.i]);\n    this.sel=p.i;this.refresh();\n    return p.text;\n  }\n  reset(){\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]){this.cur[i]=0;this.hinted[i]=false;}\n    this.mark.fill(0);this.sel=-1;this.done=false;\n    this.afterReset();this.refresh();\n  }\n  reveal(){\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i])continue;\n      if(this.cur[i]&&this.cur[i]!==this.sol[i])this.mark[i]=2;\n      else if(this.cur[i]===this.sol[i])this.mark[i]=1;\n      else this.revealEmpty(i);\n      this.cur[i]=this.sol[i];\n    }\n    this.afterReset();   // Notizen o. Ä. löschen\n    this.done=true;this.refresh();\n  }\n  finish(){\n    this.done=true;\n    for(let i=0;i<this.cur.length;i++)if(!this.given[i]&&!this.hinted[i])this.mark[i]=1;\n    this.refresh();\n  }\n  applyAutoCheck(on){\n    for(let i=0;i<this.cur.length;i++){\n      if(this.given[i]||this.hinted[i])continue;\n      if(!on&&this.mark[i]===2)this.mark[i]=0;\n      if(on&&this.cur[i]&&this.cur[i]!==this.sol[i])this.mark[i]=2;\n    }\n    this.refresh();\n  }\n  clearSelection(){this.sel=-1;this.refresh();}\n  /* Alle Felder ausgefüllt? (Rätsel mit Wasser/Kreuzen überschreiben das.) */\n  complete(){return this.cur.every(v=>v>0);}\n  /* Vollständig, aber falsch: Fehler rot zeigen und das Rätsel sperren – es gibt kein Korrigieren mehr. */\n  lock(){\n    this.locked=true;this.drag=null;\n    this.check();                                         // markiert die falschen Felder rot\n    for(let i=0;i<this.mark.length;i++)if(this.mark[i]===1)this.mark[i]=0;\n    this.sel=-1;this.refresh();\n  }\n}\n\n\n/* =====================================================================\n   RÄTSEL-MODUL: Binoxxo\n   ===================================================================== */\n/* ===== LOGIK-START ===== */\n/* ---------- Binoxxo (0 = leer, 1 = X, 2 = O) ---------- */\nconst bxGeoCache={};\nfunction bxGeo(N){\n  if(bxGeoCache[N])return bxGeoCache[N];\n  const rows=[],cols=[];\n  for(let r=0;r<N;r++){const u=[];for(let c=0;c<N;c++)u.push(r*N+c);rows.push(u);}\n  for(let c=0;c<N;c++){const u=[];for(let r=0;r<N;r++)u.push(r*N+c);cols.push(u);}\n  return bxGeoCache[N]={N,h:N/2,rows,cols,lines:rows.concat(cols)};\n}\n/* Regeln anwenden, bis nichts mehr folgt. false = Widerspruch.\n   dup: auch «keine zwei gleichen Zeilen/Spalten» nutzen.\n   log/once: Herleitungen protokollieren (für Tipps). */\nfunction bxProp(g,geo,dup,log,once){\n  const {N,h,rows,cols,lines}=geo;\n  let changed=true,stop=false;\n  const set=(i,v,t,row)=>{g[i]=v;changed=true;if(log){log.push({i,v,t,row});if(once)stop=true;}};\n  while(changed&&!stop){\n    changed=false;\n    for(let li=0;li<lines.length&&!stop;li++){\n      const line=lines[li], row=li<N;\n      let x=0,o=0;\n      for(let k=0;k<N;k++){const v=g[line[k]];if(v===1)x++;else if(v===2)o++;}\n      if(x>h||o>h)return false;\n      for(let k=0;k+2<N&&!stop;k++){\n        const a=g[line[k]],b=g[line[k+1]],c=g[line[k+2]];\n        if(a&&a===b&&a===c)return false;\n        if(a&&a===b&&!c)set(line[k+2],3-a,'pair',row);\n        else if(b&&b===c&&!a)set(line[k],3-b,'pair',row);\n        else if(a&&a===c&&!b)set(line[k+1],3-a,'sandwich',row);\n      }\n      if(stop)break;\n      x=0;o=0;\n      for(let k=0;k<N;k++){const v=g[line[k]];if(v===1)x++;else if(v===2)o++;}\n      if(x>h||o>h)return false;\n      if(x===h&&o<h){for(let k=0;k<N;k++)if(!g[line[k]])set(line[k],2,'count',row);}\n      else if(o===h&&x<h){for(let k=0;k<N;k++)if(!g[line[k]])set(line[k],1,'count',row);}\n    }\n    if(dup&&!stop){\n      for(const group of [rows,cols]){\n        const isRow=group===rows, complete=[];\n        for(const line of group){\n          let full=true,s='';\n          for(const i of line){if(!g[i]){full=false;break;}s+=g[i];}\n          if(full)complete.push(s);\n        }\n        if(new Set(complete).size<complete.length)return false;\n        for(const line of group){\n          let x=0,o=0;const e=[];\n          for(const i of line){const v=g[i];if(v===1)x++;else if(v===2)o++;else e.push(i);}\n          if(e.length===2&&x===h-1&&o===h-1){\n            const okc=[];\n            for(const [a,b] of [[1,2],[2,1]]){\n              let s='';for(const i of line)s+=i===e[0]?a:i===e[1]?b:g[i];\n              if(!complete.includes(s))okc.push([a,b]);\n            }\n            if(!okc.length)return false;\n            if(okc.length===1){set(e[0],okc[0][0],'dup',isRow);set(e[1],okc[0][1],'dup',isRow);}\n          }\n        }\n        if(stop)break;\n      }\n    }\n  }\n  return true;\n}\nfunction bxCount(g,geo,limit){\n  if(!bxProp(g,geo,true))return 0;\n  const i=g.indexOf(0); if(i<0)return 1;\n  let n=0;\n  for(const v of [1,2]){\n    const g2=g.slice(); g2[i]=v;\n    n+=bxCount(g2,geo,limit-n);\n    if(n>=limit)break;\n  }\n  return n;\n}\nfunction bxFill(g,geo){\n  if(!bxProp(g,geo,true))return null;\n  const i=g.indexOf(0); if(i<0)return g;\n  for(const v of shuffle([1,2])){\n    const g2=g.slice(); g2[i]=v;\n    const r=bxFill(g2,geo); if(r)return r;\n  }\n  return null;\n}\n/* Lösbarkeitsstufe:\n   1 = einfache Regeln (nie drei gleiche, gleich viele X/O)\n   2 = zusätzlich «keine zwei gleichen Zeilen/Spalten»\n   3 = zusätzlich «Annahme testen»: ein Zeichen probeweise setzen; führt es zum Widerspruch, gilt das andere */\nfunction bxLogic(p,geo,level){\n  const g=p.slice();\n  if(!bxProp(g,geo,level>=2))return false;\n  if(level>=3){\n    let prog=true;\n    while(prog&&g.includes(0)){\n      prog=false;\n      for(let i=0;i<g.length;i++){\n        if(g[i])continue;\n        for(const v of [1,2]){\n          const t=g.slice();t[i]=v;\n          if(!bxProp(t,geo,true)){\n            g[i]=3-v;prog=true;\n            if(!bxProp(g,geo,true))return false;\n            break;\n          }\n        }\n      }\n    }\n  }\n  return g.every(v=>v);\n}\n/* Zeilenanalyse: Alle gültigen Zeilen/Spalten aufzählen, die zu den gesetzten Zeichen passen.\n   Felder, die in allen Möglichkeiten gleich sind, stehen fest. Rückgabe: -1 Widerspruch, 0 nichts, 1 Fortschritt */\nfunction bxValid(geo){\n  if(geo.valid)return geo.valid;\n  const N=geo.N,h=geo.h,out=[];\n  (function rec(s,x,o){\n    const k=s.length;\n    if(k===N){out.push(s.slice());return;}\n    for(const v of [1,2]){\n      if(k>=2&&s[k-1]===v&&s[k-2]===v)continue;\n      const nx=x+(v===1),no=o+(v===2);\n      if(nx>h||no>h)continue;\n      s.push(v);rec(s,nx,no);s.pop();\n    }\n  })([],0,0);\n  return geo.valid=out;\n}\nfunction bxLines(g,geo,dup){\n  const {N,rows,cols}=geo,valid=bxValid(geo);\n  let prog=0;\n  for(const group of [rows,cols]){\n    const done=new Set();\n    if(dup)for(const line of group){let s='',f=true;for(const i of line){if(!g[i]){f=false;break;}s+=g[i];}if(f)done.add(s);}\n    for(const line of group){\n      let free=0;for(const i of line)if(!g[i])free++;\n      if(!free)continue;\n      const can=[new Uint8Array(N),new Uint8Array(N)];let n=0;\n      for(const s of valid){\n        let ok=true;\n        for(let k=0;k<N;k++){const v=g[line[k]];if(v&&v!==s[k]){ok=false;break;}}\n        if(!ok)continue;\n        if(dup&&done.has(s.join('')))continue;\n        n++;for(let k=0;k<N;k++)can[s[k]-1][k]=1;\n      }\n      if(!n)return -1;\n      for(let k=0;k<N;k++){\n        if(g[line[k]])continue;\n        if(can[0][k]&&!can[1][k]){g[line[k]]=1;prog=1;}\n        else if(can[1][k]&&!can[0][k]){g[line[k]]=2;prog=1;}\n      }\n    }\n  }\n  return prog;\n}\n/* Technik-Stufen. cheap: 1 Grundregeln, 2 + gleiche Zeilen, 3 + Zeilenanalyse; probe: Annahme testen\n   (mit den Techniken der inneren Stufe). Einfache Techniken kommen immer zuerst. */\nconst BX_TIERS=[null,\n  {cheap:1},\n  {cheap:2},\n  {cheap:3},\n  {cheap:3,probe:{cheap:2}},\n  {cheap:3,probe:{cheap:3}},\n  {cheap:3,probe:{cheap:3,probe:{cheap:3}}}];\nfunction bxPropL(g,geo,L,st){\n  for(;;){\n    if(!bxProp(g,geo,L.cheap>=2))return false;\n    if(L.cheap>=3){\n      const r=bxLines(g,geo,true);\n      if(r<0)return false;\n      if(r>0)continue;\n    }\n    if(L.probe){\n      let found=false;\n      for(let i=0;i<g.length&&!found;i++){\n        if(g[i])continue;\n        for(const v of [1,2]){\n          const c=g.slice();c[i]=v;\n          if(!bxPropL(c,geo,L.probe)){g[i]=3-v;found=true;if(st)st.probes++;break;}\n        }\n      }\n      if(found)continue;\n    }\n    return true;\n  }\n}\n/* Stufe, die zum Lösen nötig ist (0 = nur mit Raten lösbar) */\nfunction bxTier(p,geo,maxT,st){\n  for(let t=1;t<=(maxT||6);t++){\n    const g=p.slice();\n    if(st)st.probes=0;\n    if(bxPropL(g,geo,BX_TIERS[t],st)&&g.every(v=>v))return t;\n  }\n  return 0;\n}\n\n/* lvl: {ratio, logic (höchste erlaubte Stufe), min (Stufe, die NICHT genügen darf),\n         tier (genau diese Stufe nach BX_TIERS ist zum Lösen nötig), probes (mindestens so viele Annahmen)} */\nfunction bxGenerate(N,lvl){\n  const geo=bxGeo(N);\n  const sol=bxFill(new Array(N*N).fill(0),geo);\n  if(!sol)return null;\n  const p=sol.slice();\n  const target=Math.round(N*N*lvl.ratio);\n  let givens=N*N;\n  for(const i of shuffle([...Array(N*N).keys()])){\n    if(givens<=target)break;\n    const v=p[i]; p[i]=0;\n    const ok=bxCount(p.slice(),geo,2)===1 && (!lvl.logic||bxLogic(p,geo,lvl.logic));\n    if(ok)givens--; else p[i]=v;\n  }\n  if(lvl.min&&bxLogic(p,geo,lvl.min))return null;   // zu einfach: mit niedrigerer Stufe lösbar\n  if(lvl.tier){\n    const st={probes:0};\n    if(bxTier(p,geo,lvl.tier,st)!==lvl.tier||st.probes<(lvl.probes||0))return null;   // zu einfach oder nicht logisch lösbar\n  }\n  return {sol,puz:p};\n}\nfunction bxReason(e){\n  const zeile=e.row?'Zeile':'Spalte', zeilen=e.row?'Zeilen':'Spalten';\n  const sym=v=>v===1?'X':'O';\n  if(e.t==='pair')return 'Zwei gleiche Zeichen stehen nebeneinander – daneben muss das andere Zeichen stehen (nie drei in Folge).';\n  if(e.t==='sandwich')return 'Zwischen zwei gleichen Zeichen muss das andere Zeichen stehen (nie drei in Folge).';\n  if(e.t==='count')return `In dieser ${zeile} sind schon alle ${sym(3-e.v)} gesetzt – der Rest muss ${sym(e.v)} sein.`;\n  return `Zwei ${zeilen} dürfen nie gleich sein – nur ${sym(e.v)} verhindert hier eine doppelte ${zeile}.`;\n}\n/* ===== LOGIK-ENDE ===== */\n\n/* ---------- Binoxxo ---------- */\nclass BinoxxoPuzzle extends GridPuzzle{\n  constructor(def,size,lvlKey,data){super(def,size,lvlKey,data);this.geo=bxGeo(size);}\n  baseClass(i){\n    const N=this.n;let cls='cell';\n    if(i%N===N-1)cls+=' lastc';\n    if(Math.floor(i/N)===N-1)cls+=' lastr';\n    return cls;\n  }\n  extraClass(i){\n    if(i===this.sel)return ' sel';\n    if(this.sel>=0){\n      const N=this.n;\n      if(Math.floor(i/N)===Math.floor(this.sel/N)||i%N===this.sel%N)return ' peer';\n    }\n    return '';\n  }\n  paint(i,d){d.textContent=this.cur[i]===1?'X':this.cur[i]===2?'O':'';}\n  onCell(i){\n    this.sel=i;\n    if(this.editable())this.setCell(i,(this.cur[i]+1)%3);   // leer → X → O → leer\n    this.commit();\n  }\n  setSym(v){if(!this.editable())return;this.setCell(this.sel,v);this.commit();}\n  handleKey(e){\n    const k=e.key;\n    if(k==='x'||k==='X'||k==='1'){this.setSym(1);return true;}\n    if(k==='o'||k==='O'||k==='0'||k==='2'){this.setSym(2);return true;}\n    if(k==='Backspace'||k==='Delete'){this.setSym(0);return true;}\n    if(k===' '){if(this.editable())this.setSym((this.cur[this.sel]+1)%3);return true;}\n    return false;\n  }\n  pickHint(){\n    const g=this.cur.map((v,i)=>v===this.sol[i]?v:0);\n    const log=[];\n    bxProp(g,this.geo,true,log,true);\n    if(log.length)return {i:log[0].i,text:'Tipp (gelb): '+bxReason(log[0])};\n    for(let i=0;i<g.length;i++){\n      if(g[i])continue;\n      const v=3-this.sol[i],t=g.slice();t[i]=v;\n      if(!bxPropL(t,this.geo,BX_TIERS[3]))\n        return {i,text:`Tipp (gelb
